# tombi
toml-version = "v1.0.0"

[format.rules]
indent-width = 2
line-width = 100
trailing-comment-space-width = 1

[schema.format.rules.array-values-order]
enabled = false

[schema.format.rules.table-keys-order]
enabled = false

# mise
[[overrides]]
[overrides.files]
include = [".mise/locks/**"]

[overrides.format]
enabled = false

[overrides.lint]
enabled = false
