# tombi — the Constitution's parts, copied, each between its two lines, since tombi reads no other file
# from .droneey/constitution/presets/toml/tombi/foundation/self.toml
toml-version = "v1.0.0"

[format.rules]
indent-width = 2
line-width = 100
trailing-comment-space-width = 1

[schema.format.rules]
table-keys-order.enabled = false
array-values-order.enabled = false

# end .droneey/constitution/presets/toml/tombi/foundation/self.toml
# from .droneey/constitution/presets/toml/tombi/foundation/mise.toml
# mise writes the lockfiles of the tools it installs from npm and PyPI
[[overrides]]
files.include = [".mise/locks/**"]
format.enabled = false
lint.enabled = false
# end .droneey/constitution/presets/toml/tombi/foundation/mise.toml
