[test]
preload = ["./src/__tests__/dom.fixtures.ts"]

# bun-test
randomize = true
pathIgnorePatterns = ["tests/**"]
coverage = true
coverageReporter = ["text"]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  # bun-test
  "**/__tests__/**",
  "**/main.*",
  "**/root/wiring.*",
  "**/*.gen.*",

  # workspace
  "../**",
  # The entry files the framework calls, as the tanstack-start block asks; the tests drive the rest.
  "src/client.tsx",
  "src/root/router.ts",
  "src/root/routes/__root.tsx",
  "src/root/routeTree.gen.ts",
  # Another unit of the workspace, which its own specs cover.
  "**/packages/**"
]

# bun-test
[test.coverageThreshold]
functions = 1
lines = 1
