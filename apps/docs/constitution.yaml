  - vite
  - compose
  - hadolint
  - dclint
packs: []
overrides:
  - rule: selector-never-targets-an-id
    level: MAY
    reason: "Fumadocs exposes the parts of its layout only by their ids, so the site's styles reach them there"
  - rule: utilities-only-from-tokens
    level: SHOULD
    reason: "Fumadocs styles its own components with Tailwind's default scales, so the theme cannot reset them"
