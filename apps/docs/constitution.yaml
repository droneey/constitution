name: '@droneey/docs'
axes:
  - architecture
  - workflow
domains:
  - version-control
  - workspace
  - presentation/design-system
platforms:
  - client/browser
languages:
  - typescript
  - json
  - toml
  - yaml
  - shell
  - markdown
  - html
  - css
  - dockerfile
implementations:
  - js-runtime/bun
  - task-runner
  - tsc
  - ast-grep
  - biome
  - dependency-cruiser
  - git
  - knip
  - jscpd
  - mise
  - osv-scanner
  - shellcheck
  - shfmt
  - editorconfig
  - rumdl
  - yamllint
  - tombi
  - bun-test
  - stryker
  - schema/zod
  - yaml-js
  - react/react-dom
  - tailwind
  - tanstack-router
  - tanstack-start
  - testing-library
  - vite
  - compose
  - hadolint
  - dclint
packs:
  - pack
overrides:
  - rule: selector-never-targets-an-id
    level: MAY
    # Why: the program reads an override's reason from its one line.
    # yamllint disable-line rule:line-length
    reason: "Fumadocs exposes the parts of its layout only by their ids, so the site's styles reach them there"
  - rule: utilities-only-from-tokens
    level: SHOULD
    # yamllint disable-line rule:line-length
    reason: "Fumadocs styles its own components with Tailwind's default scales, so the theme cannot reset them"
