# yaml-language-server:$schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: important-modifier-never-in-a-class-list@typescript
language: Tsx
severity: error
message: 'Win by a later layer: the important modifier writes !important'
utils:
  class-call:
    kind: call_expression
    has:
      field: function
      kind: identifier
      regex: ^(?:cva|cn|clsx|twMerge)$
  class-attribute-value:
    any:
      - kind: string
      - kind: jsx_expression
    inside:
      kind: jsx_attribute
      has:
        kind: property_identifier
        regex: ^className$
  class-list:
    any:
      - matches: class-attribute-value
      - matches: class-call
        not:
          inside:
            stopBy: end
            any:
              - matches: class-call
              - matches: class-attribute-value
rule:
  kind: string_fragment
  regex: '[\w\])]!(?:[\s"''`]|$)|(?:^|[\s"''`])![a-z]'
  inside:
    stopBy: end
    matches: class-list
