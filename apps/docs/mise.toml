# osv-scanner: the image, its licences held to the parts' allowlist and to osv-scanner.toml
[tasks."check:audit"]
run = [
  "docker build --quiet --target base --tag droneey-constitution-docs-base:local --file docker/images/app.Dockerfile ../..",
  'osv-scanner scan image --config osv-scanner.toml --licenses="0BSD,Apache-2.0,BlueOak-1.0.0,BSD-2-Clause,BSD-3-Clause,CC-BY-4.0,CC0-1.0,ISC,MIT,MIT-0,MPL-2.0,OFL-1.1,PSF-2.0,Python-2.0,Unlicense,Zlib" droneey-constitution-docs-base:local',
]
