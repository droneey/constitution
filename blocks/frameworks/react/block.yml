kind: framework
name: react
summary: >-
  The discipline of React 19 with the Compiler on, shared by the web and
  mobile spheres: the modern API over its legacy forms, no hand-written
  memoisation, hooks as the binding units of the app layer, effects only in
  hooks, function components composed without inheritance, compound components.
  Stack-free: the router, the data layer and the styling engine are the stack's.
requires: [languages/typescript, spheres/client]
refines: [spheres/client]
chapters:
  framework: framework.md
