kind: sphere
name: client
summary: >-
  The anatomy of a client application — a program that renders a user
  interface over a server that owns the data: feature slices with a pure
  domain, adapters, a framework-binding layer and UI; a small shared kernel;
  the state model; screen composition; authorization. Framework-free: the
  binding units, the cache and the router are named by concern. Shared by the
  web and mobile spheres, which refine it.
requires: [languages/typescript]
chapters:
  architecture: architecture.md
