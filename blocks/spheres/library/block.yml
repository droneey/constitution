kind: sphere
name: library
summary: >-
  The anatomy of a library monorepo — a repository whose product is a set of
  packages other repositories install: one publishable package per folder
  with a curated surface, a common area for language-agnostic files, one
  version for every package, templates copied once by consumers. Language-free
  and tool-free: the package manager, the registry and the workspace mechanics
  are the stack's.
requires: [languages/typescript]
chapters:
  architecture: architecture.md
