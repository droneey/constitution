pre-commit:
  jobs:
    # betterleaks
    - name: secrets
      run: betterleaks git --pre-commit --staged --redact --no-banner

    # lefthook
    - name: validate-branch
      run: >-
        .droneey/constitution/presets/lefthook/plugins/shell/branch-named-type-issue-name.sh
        feature fix hotfix

    # biome
    - name: biome
      run: bunx --bun biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    # ruff
    - name: ruff
      stage_fixed: true
      glob: '*.{py,pyi}'
      run: >-
        uv run --locked ruff check --fix --force-exclude {staged_files} && uv run --locked ruff
        format --force-exclude {staged_files}
      exclude:
        - apps/docs/**
        - packages/@design/browser/**
        - packages/@design/cli/**
        - packages/@design/tokens/**
        - packages/@mutation-check/python/**
        - packages/@mutation-check/typescript/**
        - packages/brand/**
        - packages/constitution/**

    # rumdl
    - name: rumdl
      stage_fixed: true
      glob: '*.md'
      run: rumdl check --fix {staged_files}

    # shfmt
    - name: shfmt
      stage_fixed: true
      glob: '*.{sh,bash}'
      run: shfmt -w {staged_files}
      exclude:
        - apps/docs/**
        - packages/@design/browser/**
        - packages/@design/cli/**
        - packages/@design/tokens/**
        - packages/@mutation-check/python/**
        - packages/@mutation-check/typescript/**
        - packages/brand/**
        - packages/constitution/**

    # tombi
    - name: tombi
      stage_fixed: true
      glob: '*.toml'
      run: tombi format {staged_files}

    # shellcheck
    - name: shellcheck
      glob: '*.{sh,bash}'
      run: shellcheck {staged_files}
      exclude:
        - apps/docs/**
        - packages/@design/browser/**
        - packages/@design/cli/**
        - packages/@design/tokens/**
        - packages/@mutation-check/python/**
        - packages/@mutation-check/typescript/**
        - packages/brand/**
        - packages/constitution/**
    - name: check apps/docs
      root: apps/docs/
      glob: '*'
      run: &unit-check bun run check:lint && bun run check:format
    - name: check packages/constitution
      root: packages/constitution/
      glob: '*'
      run: *unit-check
    - name: check packages/@design/cli
      root: packages/@design/cli/
      glob: '*'
      run: *unit-check
    - name: check packages/@design/tokens
      root: packages/@design/tokens/
      glob: '*'
      run: *unit-check
    - name: check packages/@design/browser
      root: packages/@design/browser/
      glob: '*'
      run: *unit-check
    - name: check packages/brand
      root: packages/brand/
      glob: '*'
      run: *unit-check
    - name: check packages/@mutation-check/typescript
      root: packages/@mutation-check/typescript/
      glob: '*'
      run: *unit-check
    - name: check packages/@mutation-check/python
      root: packages/@mutation-check/python/
      glob: '*'
      run: uv run --locked poe check:lint && uv run --locked poe check:format

  # lefthook
  parallel: true

# lefthook
commit-msg:
  jobs:
    - name: commit-body
      run: >-
        .droneey/constitution/presets/lefthook/plugins/shell/commit-body-left-empty.sh {1}
    - name: commit-footer
      run: >-
        .droneey/constitution/presets/lefthook/plugins/shell/commit-footer-holds-only-trailers.sh
        {1}
    - name: commit-header-length
      run: >-
        .droneey/constitution/presets/lefthook/plugins/shell/commit-header-within-100-characters.sh
        {1}
    - name: commit-header-format
      run: >-
        .droneey/constitution/presets/lefthook/plugins/shell/commit-header-follows-conventional-commits.sh
        {1}
    - name: commit-subject-capital
      run: >-
        .droneey/constitution/presets/lefthook/plugins/shell/commit-subject-opens-with-a-capital.sh
        {1}
    - name: commit-placeholder
      run: >-
        .droneey/constitution/presets/lefthook/plugins/shell/commit-msg-hook-rejects-a-placeholder-subject.sh
        {1}
