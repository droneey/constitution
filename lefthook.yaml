pre-commit:
  jobs:
    # lefthook
    - name: validate-branch
      run: |
        BRANCH="$(git branch --show-current)"
        if [ -z "$BRANCH" ]; then
          exit 0
        fi
        PATTERN='^(feature|fix|hotfix)'
        PATTERN="$PATTERN/[0-9]+-[a-z0-9]+(-[a-z0-9]+)*\$"
        if ! echo "$BRANCH" | grep -qE "$PATTERN"; then
          echo "Branch '$BRANCH' must match: (feature|fix|hotfix)/{id}-{name}"
          exit 1
        fi

    # betterleaks
    - name: secrets
      run: betterleaks git --pre-commit --staged --redact --no-banner

    # biome
    - name: biome
      run: bunx --bun biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    # ruff
    - name: ruff
      stage_fixed: true
      glob: '*.{py,pyi}'
      run: >-
        uv run --locked ruff check --fix --force-exclude {staged_files} && uv run --locked ruff
        format --force-exclude {staged_files}

    # rumdl
    - name: rumdl
      stage_fixed: true
      glob: '*.md'
      run: rumdl check --fix {staged_files}

    # shfmt
    - name: shfmt
      stage_fixed: true
      glob: '*.{sh,bash}'
      run: shfmt -w {staged_files}
      exclude:
        - apps/docs/**
        - packages/@design/browser/**
        - packages/@design/cli/**
        - packages/@design/tokens/**
        - packages/@mutation-check/python/**
        - packages/@mutation-check/typescript/**
        - packages/brand/**
        - packages/constitution/**
        - packages/python-check/**

    # tombi
    - name: tombi
      stage_fixed: true
      glob: '*.toml'
      run: tombi format {staged_files}

    # shellcheck
    - name: shellcheck
      glob: '*.{sh,bash}'
      run: shellcheck {staged_files}
      exclude:
        - apps/docs/**
        - packages/@design/browser/**
        - packages/@design/cli/**
        - packages/@design/tokens/**
        - packages/@mutation-check/python/**
        - packages/@mutation-check/typescript/**
        - packages/brand/**
        - packages/constitution/**
        - packages/python-check/**
    - name: biome apps/docs
      root: apps/docs/
      stage_fixed: true
      run: &unit-lint bun run fix:lint --no-errors-on-unmatched {staged_files}
    - name: biome packages/constitution
      root: packages/constitution/
      stage_fixed: true
      run: *unit-lint
    - name: biome packages/@design/cli
      root: packages/@design/cli/
      stage_fixed: true
      run: *unit-lint
    - name: biome packages/@design/tokens
      root: packages/@design/tokens/
      stage_fixed: true
      run: *unit-lint
    - name: biome packages/@design/browser
      root: packages/@design/browser/
      stage_fixed: true
      run: *unit-lint
    - name: biome packages/brand
      root: packages/brand/
      stage_fixed: true
      run: *unit-lint
    - name: biome packages/@mutation-check/typescript
      root: packages/@mutation-check/typescript/
      stage_fixed: true
      run: *unit-lint
    - name: biome packages/@mutation-check/python
      root: packages/@mutation-check/python/
      stage_fixed: true
      run: &python-unit-lint bunx --bun biome check --write --no-errors-on-unmatched {staged_files}
    - name: biome packages/python-check
      root: packages/python-check/
      stage_fixed: true
      run: *python-unit-lint
    - name: rumdl apps/docs
      root: apps/docs/
      glob: '*.md'
      stage_fixed: true
      run: &unit-markdown bun run fix:markdown {staged_files}
    - name: rumdl packages/constitution
      root: packages/constitution/
      glob: '*.md'
      stage_fixed: true
      run: *unit-markdown
    - name: rumdl packages/@design/cli
      root: packages/@design/cli/
      glob: '*.md'
      stage_fixed: true
      run: *unit-markdown
    - name: rumdl packages/@design/tokens
      root: packages/@design/tokens/
      glob: '*.md'
      stage_fixed: true
      run: *unit-markdown
    - name: rumdl packages/@design/browser
      root: packages/@design/browser/
      glob: '*.md'
      stage_fixed: true
      run: *unit-markdown
    - name: shell apps/docs
      root: apps/docs/
      glob: '*.{sh,bash}'
      run: &unit-shell bun run check:shell
    - name: shell packages/constitution
      root: packages/constitution/
      glob: '*.{sh,bash}'
      run: *unit-shell
    - name: tombi apps/docs
      root: apps/docs/
      glob: '*.toml'
      stage_fixed: true
      # lefthook hands a job with a root its files as ./path, and tombi skips a file its tombi.toml
      # excludes only when named without the ./
      run: &unit-toml |
        set -- {staged_files}
        for file; do shift; set -- "$@" "${file#./}"; done
        tombi format "$@"
    - name: tombi packages/constitution
      root: packages/constitution/
      glob: '*.toml'
      stage_fixed: true
      run: *unit-toml
    - name: tombi packages/@design/cli
      root: packages/@design/cli/
      glob: '*.toml'
      stage_fixed: true
      run: *unit-toml
    - name: tombi packages/@design/tokens
      root: packages/@design/tokens/
      glob: '*.toml'
      stage_fixed: true
      run: *unit-toml
    - name: tombi packages/@design/browser
      root: packages/@design/browser/
      glob: '*.toml'
      stage_fixed: true
      run: *unit-toml
    - name: tombi packages/@mutation-check/typescript
      root: packages/@mutation-check/typescript/
      glob: '*.toml'
      stage_fixed: true
      run: *unit-toml
    - name: tombi packages/@mutation-check/python
      root: packages/@mutation-check/python/
      glob: '*.toml'
      stage_fixed: true
      run: *unit-toml
    - name: tombi packages/python-check
      root: packages/python-check/
      glob: '*.toml'
      stage_fixed: true
      run: *unit-toml

  # lefthook
  parallel: true

# lefthook
commit-msg:
  jobs:
    - name: commit-message
      run: |
        MSG="$(head -1 {1})"

        if [ "${#MSG}" -gt 100 ]; then
          echo "Header must be 100 characters or less (got ${#MSG})"
          exit 1
        fi

        TYPE="$(printf '%s\n' "$MSG" | sed -n 's/^\([a-z]*\)!\{0,1\}: .*/\1/p')"
        SUBJECT="$(printf '%s\n' "$MSG" | sed -n 's/^[a-z]*!\{0,1\}: \(.*\)/\1/p')"

        if [ -z "$TYPE" ] || [ -z "$SUBJECT" ]; then
          echo "Commit must match format: type: Subject," \
            "or type!: Subject for a breaking change"
          exit 1
        fi

        case "$TYPE" in
          feat|fix|refactor|chore) ;;
          *) echo "Invalid type '$TYPE'. Allowed: feat, fix, refactor, chore"; exit 1 ;;
        esac

        FIRST_CHAR="$(printf '%s' "$SUBJECT" | cut -c1)"
        if ! printf '%s' "$FIRST_CHAR" | grep -q '[A-Z]'; then
          echo "Subject must start with an uppercase letter (sentence-case)"
          exit 1
        fi

        case "$(printf '%s' "$SUBJECT" | tr '[:upper:]' '[:lower:]')" in
          update | updates | changes | change | misc | wip | fix | fixes | \
            "fix stuff" | stuff | \
            "minor changes" | "small fix" | tmp | test)
            echo "Subject '$SUBJECT' says nothing; say what changed"
            exit 1
            ;;
        esac

        BODY="$(sed '1d;/^#/d;/^$/d' {1} | grep -vE '^[A-Za-z][A-Za-z-]*: .+$' || true)"
        if [ -n "$BODY" ]; then
          echo "Body must be empty; a footer holds only trailers"
          exit 1
        fi
