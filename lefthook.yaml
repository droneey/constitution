pre-commit:
  jobs:
    # betterleaks
    - name: secrets
      run: betterleaks git --pre-commit --staged --redact --no-banner

    # lefthook
    - name: validate-branch
      run: >-
        .droneey/constitution/presets/lefthook/plugins/shell/branch-named-type-issue-name.sh feature
        fix hotfix

    # biome
    - name: biome
      run: bunx --bun biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    # ruff
    - name: ruff
      stage_fixed: true
      glob: '*.{py,pyi}'
      run: >-
        uv run --locked ruff check --fix --force-exclude {staged_files} && uv run --locked ruff
        format --force-exclude {staged_files}

    # rumdl
    - name: rumdl
      stage_fixed: true
      glob: '*.md'
      run: rumdl check --fix {staged_files}

    # shfmt
    - name: shfmt
      stage_fixed: true
      glob: '*.{sh,bash}'
      run: shfmt -w {staged_files}
      exclude:
        - apps/docs/**
        - packages/@design/browser/**
        - packages/@design/cli/**
        - packages/@design/tokens/**
        - packages/@mutation-check/python/**
        - packages/@mutation-check/typescript/**
        - packages/brand/**
        - packages/constitution/**
        - packages/python-check/**

    # tombi
    - name: tombi
      stage_fixed: true
      glob: '*.toml'
      run: tombi format {staged_files}

    # shellcheck
    - name: shellcheck
      glob: '*.{sh,bash}'
      run: shellcheck {staged_files}
      exclude:
        - apps/docs/**
        - packages/@design/browser/**
        - packages/@design/cli/**
        - packages/@design/tokens/**
        - packages/@mutation-check/python/**
        - packages/@mutation-check/typescript/**
        - packages/brand/**
        - packages/constitution/**
        - packages/python-check/**
    - name: biome apps/docs
      root: apps/docs/
      stage_fixed: true
      run: &unit-lint bun run fix:lint --no-errors-on-unmatched {staged_files}
    - name: biome packages/constitution
      root: packages/constitution/
      stage_fixed: true
      run: *unit-lint
    - name: biome packages/@design/cli
      root: packages/@design/cli/
      stage_fixed: true
      run: *unit-lint
    - name: biome packages/@design/tokens
      root: packages/@design/tokens/
      stage_fixed: true
      run: *unit-lint
    - name: biome packages/@design/browser
      root: packages/@design/browser/
      stage_fixed: true
      run: *unit-lint
    - name: biome packages/brand
      root: packages/brand/
      stage_fixed: true
      run: *unit-lint
    - name: biome packages/@mutation-check/typescript
      root: packages/@mutation-check/typescript/
      stage_fixed: true
      run: *unit-lint
    - name: biome packages/@mutation-check/python
      root: packages/@mutation-check/python/
      stage_fixed: true
      run: &python-unit-lint bunx --bun biome check --write --no-errors-on-unmatched {staged_files}
    - name: biome packages/python-check
      root: packages/python-check/
      stage_fixed: true
      run: *python-unit-lint
    - name: rumdl apps/docs
      root: apps/docs/
      glob: '*.md'
      stage_fixed: true
      run: &unit-markdown bun run fix:markdown {staged_files}
    - name: rumdl packages/constitution
      root: packages/constitution/
      glob: '*.md'
      stage_fixed: true
      run: *unit-markdown
    - name: rumdl packages/@design/cli
      root: packages/@design/cli/
      glob: '*.md'
      stage_fixed: true
      run: *unit-markdown
    - name: rumdl packages/@design/tokens
      root: packages/@design/tokens/
      glob: '*.md'
      stage_fixed: true
      run: *unit-markdown
    - name: rumdl packages/@design/browser
      root: packages/@design/browser/
      glob: '*.md'
      stage_fixed: true
      run: *unit-markdown
    - name: shell apps/docs
      root: apps/docs/
      glob: '*.{sh,bash}'
      run: &unit-shell bun run check:shell
    - name: shell packages/constitution
      root: packages/constitution/
      glob: '*.{sh,bash}'
      run: *unit-shell
    - name: tombi apps/docs
      root: apps/docs/
      glob: '*.toml'
      stage_fixed: true
      run: &unit-toml ../../scripts/format-toml.sh {staged_files}
    - name: tombi packages/constitution
      root: packages/constitution/
      glob: '*.toml'
      stage_fixed: true
      run: *unit-toml
    - name: tombi packages/@design/cli
      root: packages/@design/cli/
      glob: '*.toml'
      stage_fixed: true
      run: &scoped-unit-toml ../../../scripts/format-toml.sh {staged_files}
    - name: tombi packages/@design/tokens
      root: packages/@design/tokens/
      glob: '*.toml'
      stage_fixed: true
      run: *scoped-unit-toml
    - name: tombi packages/@design/browser
      root: packages/@design/browser/
      glob: '*.toml'
      stage_fixed: true
      run: *scoped-unit-toml
    - name: tombi packages/@mutation-check/typescript
      root: packages/@mutation-check/typescript/
      glob: '*.toml'
      stage_fixed: true
      run: *scoped-unit-toml
    - name: tombi packages/@mutation-check/python
      root: packages/@mutation-check/python/
      glob: '*.toml'
      stage_fixed: true
      run: *scoped-unit-toml
    - name: tombi packages/python-check
      root: packages/python-check/
      glob: '*.toml'
      stage_fixed: true
      run: *unit-toml

  # lefthook
  parallel: true

# lefthook
commit-msg:
  jobs:
    - name: commit-body
      run: >-
        .droneey/constitution/presets/lefthook/plugins/shell/commit-body-left-empty.sh {1}
    - name: commit-header-length
      run: >-
        .droneey/constitution/presets/lefthook/plugins/shell/commit-header-within-100-characters.sh
        {1}
    - name: commit-header-format
      run: >-
        .droneey/constitution/presets/lefthook/plugins/shell/commit-header-follows-conventional-commits.sh
        {1}
    - name: commit-subject-capital
      run: >-
        .droneey/constitution/presets/lefthook/plugins/shell/commit-subject-opens-with-a-capital.sh
        {1}
    - name: commit-placeholder
      run: >-
        .droneey/constitution/presets/lefthook/plugins/shell/commit-msg-hook-rejects-a-placeholder-subject.sh
        {1}
