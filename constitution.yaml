axes:
  - architecture
  - workflow
domains:
  - version-control
  - open-source
  - workspace
platforms: []
languages:
  - typescript
  - python
  - json
  - toml
  - yaml
  - shell
  - markdown
implementations:
  - bun
  - tsc
  - biome
  - dependency-cruiser
  - syncpack
  - git
  - lefthook
  - betterleaks
  - mise
  - knip
  - osv-scanner
  - uv
  - shellcheck
  - shfmt
  - rumdl
  - yamllint
packages:
  apps/docs:
    domains:
      - ui
      - design-system
      - untrusted-client
    platforms:
      - browser
    languages:
      - html
      - css
      - dockerfile
    implementations:
      - bun-test
      - stryker
      - zod
      - yaml-js
      - react-dom
      - tailwind
      - tanstack-router
      - tanstack-start
      - testing-library
      - vite
      - compose
      - hadolint
      - dclint
    overrides:
      - rule: selector-never-targets-an-id
        level: MAY
        reason: "Fumadocs exposes the parts of its layout only by their ids, so the site's styles reach them there"
      - rule: utilities-only-from-tokens
        level: SHOULD
        reason: "Fumadocs styles its own components with Tailwind's default scales, so the theme cannot reset them"
  packages/design-tokens:
    domains:
      - ui
      - design-system
    implementations:
      - bun-test
  packages/design-terminal:
    domains:
      - ui
      - design-system
    platforms:
      - cli
    implementations:
      - bun-test
      - stryker
      - ink
  packages/design-web:
    domains:
      - ui
      - design-system
      - untrusted-client
    platforms:
      - browser
    languages:
      - html
      - css
    implementations:
      - bun-test
      - stryker
      - react-dom
      - tailwind
      - testing-library
  # The archive itself: a link of its own to .droneey/constitution would point at its own folder, so
  # the root's biome.json serves it.
  packages/constitution:
    platforms:
      - cli
    implementations:
      - bun-test
      - stryker
      - zod
      - yaml-js
      - bunli
  packages/mutation-check/languages/python:
    implementations:
      - poe
      - ruff
      - ty
      - pytest
      - mutmut
      - deptry
      - vulture
      - complexipy
      - python-check
  packages/mutation-check/languages/typescript:
    implementations:
      - bun-test
      - stryker
  packages/python-check:
    implementations:
      - poe
      - ruff
      - ty
      - pytest
      - mutmut
      - deptry
      - vulture
      - complexipy
      - python-check
packs: []
check: bun run check
overrides:
  - rule: agent-file-restates-no-rule
    level: MAY
    reason: "The Constitution's authors read the working-tree blocks they edit, not the installed ones"
