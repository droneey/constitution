name: '@droneey/constitution-workspace'
axes:
  - architecture
  - workflow
domains:
  - version-control
  - open-source
  - workspace
platforms: []
languages:
  - typescript
  - python
  - json
  - toml
  - yaml
  - shell
  - markdown
implementations:
  - bun
  - biome
  - syncpack
  - git
  - lefthook
  - betterleaks
  - mise
  - osv-scanner
  - uv
  - shellcheck
  - shfmt
  - editorconfig
  - rumdl
  - yamllint
  - tombi
packs: []
overrides:
  - rule: agent-file-restates-no-rule
    level: MAY
    # constitution reads an override's reason from its one line
    # yamllint disable-line rule:line-length
    reason: "The Constitution's authors read the working-tree blocks they edit, not the installed ones"
