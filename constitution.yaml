version: 0.71.0

axes:
  - architecture
  - workflow
domains:
  - version-control
  - open-source
  - workspace
platforms: []
languages:
  - typescript
  - python
  - yaml
  - shell
  - markdown
implementations:
  - bun
  - bun-test
  - tsc
  - biome
  - dependency-cruiser
  - syncpack
  - stryker
  - zod
  - yaml-js
  - git
  - lefthook
  - betterleaks
  - mise
  - knip
  - osv-scanner
  - uv
  - ruff
  - ty
  - pytest
  - mutmut
  - deptry
  - vulture
  - complexipy
  - python-check
  - shellcheck
  - shfmt
  - rumdl
  - yamllint
packages:
  apps/docs:
    domains:
      - ui
      - design-system
      - untrusted-client
    platforms:
      - browser
    languages:
      - css
    implementations:
      - react-dom
      - tailwind
      - tanstack-router
      - tanstack-start
      - testing-library
      - vite
    overrides:
      - rule: selector-never-targets-an-id
        level: MAY
        reason: "Fumadocs exposes the parts of its layout only by their ids, so the site's styles reach them there"
      - rule: utilities-only-from-tokens
        level: SHOULD
        reason: "Fumadocs styles its own components with Tailwind's default scales, so the theme cannot reset them"
check: bun run check
overrides:
  - rule: agent-file-restates-no-rule
    level: MAY
    reason: "The Constitution's authors read the working-tree blocks they edit, not the installed ones"
