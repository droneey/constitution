[tools]
actionlint = "1.7.12"
betterleaks = "1.9.0"
bun = "1.4.4"
hadolint = "2.15.1"
lefthook = "2.2.2"
"npm:dclint" = "3.1.0"
osv-scanner = "2.7.0"
python = "3.14.8"
rumdl = "0.2.79"
shellcheck = "0.11.0"
shfmt = "3.14.1"
tombi = "1.9.5"
uv = "0.13.5"
yamllint = "1.38.0"

[tools."npm:renovate"]
version = "44.155.7"
trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"]

[env._]
path = ["{{config_root}}/.droneey/constitution/bin"]

[hooks]
postinstall = [
  "bun install --frozen-lockfile",
  "bun run --filter '@droneey/constitution^...' generate",
  "mkdir -p .droneey",
  "ln -sfn ../packages/constitution .droneey/constitution",
  "cd packages/constitution && bun link",
  "lefthook install",
  "uv sync --locked"
]

[settings]
lockfile = true
minimum_release_age = "3d"

[tool_config]
locked = true
