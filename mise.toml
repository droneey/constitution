[tools]
actionlint = "1.7.12"
betterleaks = "1.8.1"
bun = "1.4.2"
lefthook = "2.1.14"
ls-lint = "2.3.1"
osv-scanner = "2.6.0"
"github:droneey/devkit" = { version = "1.31.0", asset_pattern = "devkit.tar.gz", strip_components = 0 }

[hooks]
postinstall = [
  "ln -sfn \"$(mise where github:droneey/devkit)\" .devkit",
  "ln -sfn . .constitution",
  "lefthook install",
]

[settings]
lockfile = true

[tool_config]
locked = true
