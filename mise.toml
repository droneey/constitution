[tools]
actionlint = "1.7.12"
betterleaks = "1.9.0"
bun = "1.4.3"
hadolint = "2.15.1"
lefthook = "2.2.2"
"npm:dclint" = "3.1.0"
# @yarnpkg/libzip 3.2.2, a dependency of Renovate, lost the provenance 3.2.0 carried; reviewed, nothing else is exempt.
"npm:renovate" = { version = "44.155.7", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }
osv-scanner = "2.7.0"
python = "3.14.8"
rumdl = "0.2.79"
shellcheck = "0.11.0"
shfmt = "3.14.1"
tombi = "1.9.0"
uv = "0.13.0"
yamllint = "1.38.0"

[hooks]
postinstall = [
  "mkdir -p .droneey",
  "ln -sfn ../packages/constitution .droneey/constitution",
  # the constitution program, run from its sources: bun puts it on PATH in ~/.bun/bin
  "cd packages/constitution && bun link",
  "lefthook install",
  "uv sync --locked",
]

[settings]
lockfile = true
# ADR-0202: the cooldown, also for the dependencies of an npm or a PyPI tool
minimum_release_age = "3d"

[tool_config]
locked = true

# --no-ignore: osv-scanner reads a checkout nested in a folder another repository ignores, an agent's worktree,
# as ignored and finds no lockfile
[tasks."audit:check"]
run = 'licenses="$(cat .droneey/constitution/presets/common/osv-scanner/foundation/core.txt | paste -sd, -)" && osv-scanner scan source --licenses="$licenses" --no-ignore .'
