[tools]
actionlint = "1.7.12"
betterleaks = "1.9.0"
# Why: from 1.4.4, coverage counts as missed the default branch of an enum switch that ends in
# `satisfies never`.
bun = "1.4.3"
hadolint = "2.15.1"
lefthook = "2.2.2"
"npm:dclint" = "3.1.0"
# Why: @yarnpkg/libzip 3.2.2, a dependency of Renovate, lost the provenance 3.2.0 carried; reviewed,
# nothing else is exempt.
"npm:renovate" = { version = "44.155.7", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }
osv-scanner = "2.7.0"
python = "3.14.8"
rumdl = "0.2.79"
shellcheck = "0.11.0"
shfmt = "3.14.1"
tombi = "1.9.5"
uv = "0.13.5"
yamllint = "1.38.0"

[hooks]
postinstall = [
  "mkdir -p .droneey",
  "ln -sfn ../packages/constitution .droneey/constitution",
  "cd packages/constitution && bun link",
  "lefthook install",
  "uv sync --locked",
]

[settings]
lockfile = true
# Why: three days catch the hijacked releases found at once, and the cooldown holds for the
# dependencies of an npm or a PyPI tool too.
minimum_release_age = "3d"

[tool_config]
locked = true
