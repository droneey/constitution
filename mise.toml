[tools]
actionlint = "1.7.12"
betterleaks = "1.9.0"
bun = "1.4.2"
hadolint = "2.15.1"
lefthook = "2.2.1"
osv-scanner = "2.6.0"
python = "3.14.8"
rumdl = "0.2.79"
shellcheck = "0.11.0"
shfmt = "3.14.1"
uv = "0.12.21"

[hooks]
postinstall = [
  "mkdir -p .droneey",
  "ln -sfn .. .droneey/constitution",
  "lefthook install",
  "uv sync --locked",
]

[settings]
lockfile = true

[tool_config]
locked = true
