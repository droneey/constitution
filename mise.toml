[tools]
actionlint = "1.7.12"
betterleaks = "1.8.1"
bun = "1.4.2"
hadolint = "2.15.1"
lefthook = "2.1.14"
ls-lint = "2.3.1"
osv-scanner = "2.6.0"

[hooks]
postinstall = [
  "mkdir -p .droneey",
  "ln -sfn .. .droneey/constitution",
  "lefthook install",
]

[settings]
lockfile = true

[tool_config]
locked = true
