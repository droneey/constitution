<svg xmlns="http://www.w3.org/2000/svg" width="161" height="24" viewBox="0 0 161 24" role="img" aria-label="Made for Claude Code">
  <title>Made for Claude Code</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#936E00"/>
      <stop offset="1" stop-color="#A66200"/>
    </linearGradient>
    <clipPath id="shape">
      <rect width="161" height="24" rx="8"/>
    </clipPath>
  </defs>
  <g clip-path="url(#shape)">
    <rect width="69" height="24" fill="#3F3F46"/>
    <rect x="69" width="92" height="24" fill="url(#accent)"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    <text x="34.5" y="16" fill="#F4F4F5">made for</text>
    <text x="115" y="16" fill="#FFFFFF">Claude Code</text>
  </g>
</svg>
