[global]
force_exclude = true

# rumdl
extend-enable = ["MD087", "MD001", "MD025", "MD036", "MD040", "MD045", "MD051", "MD057", "MD059"]

# workspace
exclude = [
  "apps/docs/**",
  "packages/@design/browser/**",
  "packages/@design/cli/**",
  "packages/@design/tokens/**",
  "packages/@mutation-check/python/**",
  "packages/@mutation-check/typescript/**",
  "packages/brand/**",
  "packages/constitution/**",
  "packages/python-check/**"
]

# rumdl
disable = ["MD013", "MD041"]

# rumdl
# The distribution's entries, repeated since this table replaces its own.
[per-file-ignores]
"**/AGENTS.md" = ["MD033"]
"**/CLAUDE.md" = ["MD033"]
"**/SKILL.md" = ["MD033"]
# The brand's banner switches with the reader's theme and its badges sit centred, which Markdown cannot write.
"README.md" = ["MD033"]

[MD046]
style = "fenced"

[MD057]
absolute-links = "relative_to_roots"

[MD033]
allowed-elements = ["details", "summary", "kbd", "img"]

[MD024]
siblings-only = true
