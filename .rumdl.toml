extends = ".droneey/constitution/presets/markdown/rumdl/foundation/core.toml"

# The archive's entries, repeated since this table replaces its own.
[per-file-ignores]
"**/AGENTS.md" = ["MD033"]
"**/CLAUDE.md" = ["MD033"]
"**/SKILL.md" = ["MD033"]
# A block's format fixes its levels: rules are H3 under the title or an H2 chapter.
"packages/constitution/blocks/**/*.md" = ["MD001"]
# The brand's banner switches with the reader's theme and its badges sit centred, which Markdown cannot write.
"README.md" = ["MD033"]
# The template shows that format, its placeholders in angle brackets.
"packages/constitution/templates/block/foundation/chapter.md" = ["MD001", "MD033"]
