# rumdl: the Constitution's parts, each extending the one before; rumdl extends the last
# from .droneey/constitution/presets/markdown/rumdl/foundation/self.toml, .droneey/constitution/presets/markdown/rumdl/foundation/core.toml
extends = ".droneey/constitution/presets/markdown/rumdl/foundation/core.toml"

# rumdl: the members, each checked by its own configuration in its own run
[global]
exclude = [
  "apps/**",
  "packages/**",
]
force_exclude = true

# The archive's entries, repeated since this table replaces its own.
[per-file-ignores]
"**/AGENTS.md" = ["MD033"]
"**/CLAUDE.md" = ["MD033"]
"**/SKILL.md" = ["MD033"]
# The brand's banner switches with the reader's theme and its badges sit centred, which Markdown cannot write.
"README.md" = ["MD033"]
