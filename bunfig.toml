[test]
root = "."
coverage = true
coverageReporter = ["text"]
coverageSkipTestFiles = true
coverageThreshold = { functions = 1.0, lines = 1.0 }
coveragePathIgnorePatterns = [
  "**/__tests__/**",
  "tests/**",
  "**/main.*",
  "**/root/wiring.*",
]

[install]
minimumReleaseAge = 259200 # three days, in seconds

[run]
bun = true
