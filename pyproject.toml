[dependency-groups]
dev = [
  "anyio==4.15.1",
  "complexipy==8.0.1",
  "deptry==0.25.1",
  "hypothesis==6.169.0",
  "import-linter==2.15",
  "mutmut==3.8.0",
  "mutmut-check",
  "pydantic==2.14.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-randomly==5.0.0",
  "pytest-timeout==2.4.0",
  "python-check",
  "ruff==0.17.0",
  "ty==0.0.86",
  "vulture==2.16",
]

[tool.uv]
exclude-newer = "3 days"
no-build = true
python-downloads = "never"
python-preference = "only-system"

[tool.uv.sources]
mutmut-check = { workspace = true }
python-check = { workspace = true }

[tool.uv.workspace]
members = ["tools/mutmut-check", "tools/python-check"]

[tool.ruff]
extend = ".droneey/constitution/presets/python/ruff/pytest.toml"
target-version = "py314"

[tool.ruff.lint.extend-per-file-ignores]
"tools/*/tests/**" = [
  "INP001",
  "PLR2004",
  "S101",
]
