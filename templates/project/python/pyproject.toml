# python: the project
[project]
name = "<name>"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

# uv: the build backend
[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# uv: the tools, pinned exactly
[dependency-groups]
dev = [
  "anyio==4.15.1",
  "complexipy==8.0.1",
  "deptry==0.25.1",
  "hypothesis==6.168.3",
  "import-linter==2.15",
  "mutmut==3.8.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-randomly==5.0.0",
  "pytest-timeout==2.4.0",
  "ruff==0.16.9",
  "ty==0.0.84",
  "vulture==2.16",
]

# uv: installs
[tool.uv]
exclude-newer = "3 days"
no-build = true
python-downloads = "never"
python-preference = "only-system"

# ruff: the constitution's chain of parts
[tool.ruff]
extend = ".droneey/constitution/presets/python/ruff/foundation/pytest.toml"

# ruff: what the specs lift
[tool.ruff.lint.extend-per-file-ignores]
"tests/**" = [
  "INP001",
  "S101",
]

# pytest: the specs, strict and offline, in a random order
[tool.pytest]
minversion = "9.1"
strict = true
testpaths = ["tests"]
pythonpath = ["tests"]
# the list replaces pytest's defaults: `.*` keeps the hidden folders out, or Hypothesis warns of .hypothesis/
norecursedirs = [".*", "integration", "e2e"]
addopts = ["-ra", "--import-mode=importlib"]
filterwarnings = ["error"]
anyio_mode = "auto"
timeout = "10"

# pytest: the coverage gate, with branches
[tool.coverage.run]
branch = true
source = ["src"]
omit = ["**/main.py", "**/__main__.py", "**/entrypoints/*/main.py", "**/root/wiring.py", "**/*_gen.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "assert_never\\("]

# mutmut: the mutants, each one killed
[tool.mutmut]
source_paths = ["src"]
do_not_mutate = ["*/main.py", "*/root/wiring.py", "*_gen.py"]
pytest_add_cli_args = ["-p", "no:randomly"]
type_check_command = ["ty", "check", "--output-format", "gitlab"]

# import-linter: core's import rules, by the folders of its anatomy
[tool.importlinter]
root_packages = ["<package>"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "no-import-cycles"
type = "acyclic_siblings"
ancestors = ["<package>"]

[[tool.importlinter.contracts]]
name = "kernel-imports-only-itself"
type = "forbidden"
source_modules = ["*.kernel"]
forbidden_modules = ["*.adapters", "*.composition", "*.contracts", "*.entrypoints", "*.features", "*.integrations", "*.libs", "*.root", "*.shared"]

[[tool.importlinter.contracts]]
name = "libs-import-no-application-code"
type = "forbidden"
source_modules = ["*.libs"]
forbidden_modules = ["*.adapters", "*.composition", "*.contracts", "*.entrypoints", "*.features", "*.integrations", "*.kernel", "*.root", "*.shared"]

[[tool.importlinter.contracts]]
name = "shared-imports-no-feature-adapter-contract-or-root"
type = "forbidden"
source_modules = ["*.shared"]
forbidden_modules = ["*.adapters", "*.contracts", "*.features", "*.integrations", "*.root"]

[[tool.importlinter.contracts]]
name = "contracts-know-no-vendor-or-other-contract"
type = "forbidden"
source_modules = ["*.contracts"]
forbidden_modules = ["*.adapters", "*.composition", "*.entrypoints", "*.features", "*.integrations", "*.root", "*.shared"]

[[tool.importlinter.contracts]]
name = "domain-imports-only-itself-kernel-and-contracts"
type = "forbidden"
source_modules = ["*.features.*.domain"]
forbidden_modules = ["*.adapters", "*.composition", "*.entrypoints", "*.features.*.adapters", "*.features.*.app", "*.integrations", "*.libs", "*.root", "*.shared"]

[[tool.importlinter.contracts]]
name = "domain-imports-no-logging"
type = "forbidden"
source_modules = ["*.features.*.domain"]
forbidden_modules = ["logging"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "features-blind-to-each-other"
type = "independence"
modules = ["*.features.*"]

[[tool.importlinter.contracts]]
name = "adapters-never-import-each-other-or-callers"
type = "independence"
modules = ["*.adapters.*", "*.features.*.adapters.*"]

[[tool.importlinter.contracts]]
name = "adapters-never-import-each-other-or-callers"
type = "forbidden"
source_modules = ["*.adapters", "*.features.*.adapters"]
forbidden_modules = ["*.composition", "*.entrypoints", "*.features.*.app", "*.root"]

[[tool.importlinter.contracts]]
name = "root-imported-only-by-entry-and-delivery-wiring"
type = "protected"
protected_modules = ["*.root"]
allowed_importers = ["*.main", "*.entrypoints.*.main"]

[[tool.importlinter.contracts]]
name = "nothing-imports-an-entrypoint"
type = "protected"
protected_modules = ["*.entrypoints"]
allowed_importers = []

[[tool.importlinter.contracts]]
name = "nothing-imports-an-entrypoint"
type = "independence"
modules = ["*.entrypoints.*"]

[[tool.importlinter.contracts]]
name = "nothing-imports-an-integration"
type = "protected"
protected_modules = ["*.integrations"]
allowed_importers = []

[[tool.importlinter.contracts]]
name = "nothing-imports-an-integration"
type = "independence"
modules = ["*.integrations.*"]

[[tool.importlinter.contracts]]
name = "dependencies-point-inward"
type = "forbidden"
source_modules = ["*.adapters", "*.contracts", "*.features", "*.kernel", "*.libs", "*.shared"]
forbidden_modules = ["*.composition"]

[[tool.importlinter.contracts]]
name = "reads-and-writes-apart"
type = "forbidden"
source_modules = ["**.repositories.queries", "**.use_cases.queries"]
forbidden_modules = ["**.repositories.commands", "**.use_cases.commands"]

[[tool.importlinter.contracts]]
name = "reads-and-writes-apart"
type = "forbidden"
source_modules = ["**.repositories.commands", "**.use_cases.commands"]
forbidden_modules = ["**.repositories.queries", "**.use_cases.queries"]

# a layer folder's __init__.py, the import package's own among them, is never imported
[[tool.importlinter.contracts]]
name = "layer-folder-has-no-surface"
type = "forbidden"
source_modules = ["**"]
forbidden_modules = ["<package>", "*.adapters", "*.features", "*.features.*.adapters", "*.features.*.app", "*.features.*.domain", "*.integrations", "*.libs"]
as_packages = false
allow_indirect_imports = true

# the kernel and a module of each layer are reached from outside only through their __init__.py
[[tool.importlinter.contracts]]
name = "access-only-through-curated-surface"
type = "protected"
protected_modules = ["*.kernel.*"]
allowed_importers = ["*.kernel"]

[[tool.importlinter.contracts]]
name = "access-only-through-curated-surface"
type = "protected"
protected_modules = ["*.adapters.*.*"]
allowed_importers = ["*.adapters.*"]

[[tool.importlinter.contracts]]
name = "access-only-through-curated-surface"
type = "protected"
protected_modules = ["*.composition.*.*"]
allowed_importers = ["*.composition.*"]

[[tool.importlinter.contracts]]
name = "access-only-through-curated-surface"
type = "protected"
protected_modules = ["*.contracts.*.*"]
allowed_importers = ["*.contracts.*"]

[[tool.importlinter.contracts]]
name = "access-only-through-curated-surface"
type = "protected"
protected_modules = ["*.features.*.*"]
allowed_importers = ["*.features.*"]

[[tool.importlinter.contracts]]
name = "access-only-through-curated-surface"
type = "protected"
protected_modules = ["*.libs.*.*"]
allowed_importers = ["*.libs.*"]

[[tool.importlinter.contracts]]
name = "access-only-through-curated-surface"
type = "protected"
protected_modules = ["*.shared.*.*"]
allowed_importers = ["*.shared.*"]

# cli: the commands reached only from the entries
[[tool.importlinter.contracts]]
name = "dependencies-point-inward"
type = "forbidden"
source_modules = ["*.adapters", "*.composition", "*.contracts", "*.features", "*.kernel", "*.libs", "*.shared"]
forbidden_modules = ["*.cli"]

# api: the handlers reached only from the entries
[[tool.importlinter.contracts]]
name = "dependencies-point-inward"
type = "forbidden"
source_modules = ["*.adapters", "*.composition", "*.contracts", "*.features", "*.kernel", "*.libs", "*.shared"]
forbidden_modules = ["*.api"]

# python-check: the home of each block's package
[tool.python-check]
extend = [
  ".droneey/constitution/presets/python/python-check/architecture/httpx2.toml",
  ".droneey/constitution/presets/python/python-check/architecture/pydantic.toml",
  ".droneey/constitution/presets/python/python-check/architecture/structlog.toml",
]

# vulture: the code nothing in src/ uses
[tool.vulture]
paths = ["src"]
min_confidence = 60

# complexipy: the cognitive complexity of a function
[tool.complexipy]
max-complexity-allowed = 10

