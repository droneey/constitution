[global]
disable = [
  "MD013",
  "MD041",
]
extend-enable = [
  "MD001",
  "MD025",
  "MD036",
  "MD040",
  "MD045",
  "MD051",
  "MD057",
  "MD059",
]

[per-file-ignores]
"**/AGENTS.md" = ["MD033"]
"**/CLAUDE.md" = ["MD033"]
"**/SKILL.md" = ["MD033"]

[MD024]
siblings-only = true

[MD033]
allowed-elements = [
  "details",
  "summary",
  "kbd",
  "img",
]

[MD046]
style = "fenced"

[MD057]
absolute-links = "relative_to_roots"
