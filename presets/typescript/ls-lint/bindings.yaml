expo:
  expo-router-file-names-kept:
    - _layout
  file-name-in-its-owners-case:
    - app
    - 'src/app'
tanstack-router:
  tanstack-router-file-names-kept:
    - 'src/routes'
typescript:
  file-name-in-its-owners-case:
    - '.dir'
  test-folder-files-in-test-forms:
    - 'src/**/__tests__'
    - tests
    - 'tests/*'
  typescript-file-forms:
    - '.ts'
    - '.tsx'
    - 'src/**/__tests__'
    - tests
    - 'tests/*'
  format-has-one-extension:
    - '.yml'
