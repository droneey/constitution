ls:
  .dir: kebab-case | regex:^\.[a-z0-9]+(-[a-z0-9]+)*$ | regex:^__tests__$
  .ts: kebab-case
  .tsx: kebab-case
  "src/**/__tests__": &tests
    .dir: kebab-case | regex:^__tests__$
    .*: kebab-case
    .*.*: kebab-case
    .ts: exists:0
    .tsx: exists:0
    .*.ts: exists:0
    .*.tsx: exists:0
    .*.*.ts: exists:0
    .*.*.tsx: exists:0
    .test.ts: kebab-case
    .test.tsx: kebab-case
    .*.test.ts: kebab-case
    .*.test.tsx: kebab-case
    .*.*.test.ts: kebab-case
    .*.*.test.tsx: kebab-case
    .fake.ts: kebab-case
    .fixtures.ts: kebab-case
    .fixtures.tsx: kebab-case
    .yml: regex:^$
  tests: *tests
  tests/*: *tests
ignore:
  - node_modules
