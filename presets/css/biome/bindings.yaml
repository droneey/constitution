tailwind:
  utilities-only-from-tokens:
    - utilities-only-from-tokens.grit
css:
  feature-supported-by-every-target-browser:
    - useBaseline
  class-declared-is-used:
    - noUnusedClasses
  custom-property-read-where-defined:
    - noUndeclaredCustomProperties
    - noInvalidPropertyInitValue
    - noMissingVarFunction
  declaration-never-important:
    - noImportantStyles
  stylesheet-value-read-from-the-theme:
    - noHexColors
  selector-classes-within-the-limit:
    - noExcessiveSelectorClasses
  selector-specificity-never-descends:
    - noDescendingSpecificity
  style-rule-in-a-named-layer:
    - useLayeredStyles
    - useNamedLayer
  selector-never-targets-an-id:
    - selector-never-targets-an-id.grit
