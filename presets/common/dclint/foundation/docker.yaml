rules:
  no-build-and-image: 2
  no-duplicate-container-names: 2
  no-duplicate-exported-ports: 2
  no-quotes-in-volumes: 2
  no-unbound-port-interfaces: 2
  no-version-field: 2
  require-project-name-field: 0
  require-quotes-in-ports:
    - 2
    - quoteType: single
  service-container-name-regex: 2
  service-dependencies-alphabetical-order: 0
  service-image-require-explicit-tag: 2
  service-keys-order:
    - 2
    - groupOrder:
        - Core Definitions
      groups:
        Core Definitions:
          - image
          - build
          - container_name
          - extends
          - profiles
          - restart
          - command
          - depends_on
          - networks
          - ports
          - volumes
          - logging
          - healthcheck
          - security_opt
          - labels
          - tmpfs
          - environment
  service-ports-alphabetical-order: 0
  services-alphabetical-order: 0
  top-level-properties-order:
    - 2
    - customOrder:
        - version
        - name
        - x-properties
        - services
        - networks
        - volumes
        - secrets
        - configs
