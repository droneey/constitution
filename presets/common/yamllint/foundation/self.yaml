---
extends: default

rules:
  indentation:
    spaces: 2
    indent-sequences: true
  line-length:
    max: 120
    allow-non-breakable-inline-mappings: true
  braces:
    min-spaces-inside: 1
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 0
  comments:
    level: error
    min-spaces-from-content: 1
  comments-indentation:
    level: error
  document-start: disable
  document-end: disable
  empty-lines:
    max: 1
  key-duplicates: enable
  truthy:
    level: error
    allowed-values: ['true', 'false']
    check-keys: false
