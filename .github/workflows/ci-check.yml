name: ☑️ Check

on:
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore the mutation results
        uses: actions/cache@v4.3.0
        with:
          path: reports/stryker-incremental.json
          key: mutation-${{ github.head_ref }}-${{ github.sha }}
          restore-keys: |
            mutation-${{ github.head_ref }}-
            mutation-

      - name: Check
        run: bun run check

      - name: Lint the workflows
        run: |
          set -euo pipefail
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/actionlint" -color
