name: 🔖 Pre-release

on:
  push:
    tags: ['v*']

jobs:
  pre-release:
    uses: droneey/.github/.github/workflows/cd-release.yaml@v2.6.0
    permissions:
      contents: write
    with:
      prerelease: true
      assets-command: npx --yes bun@1.4.2 run build && tar -czf constitution.tar.gz presets templates tools/mutation-check/dist && sha256sum constitution.tar.gz > constitution.tar.gz.sha256
      assets: constitution.tar.gz constitution.tar.gz.sha256
