name: 🔖 Pre-release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Every file the release carries, built before it opens: an immutable release
  # takes no file after. The Constitution's archive with its checksum, and the
  # constitution program for each platform, an archive of bin/constitution that
  # mise unpacks beside it; Bun builds every platform's from one runner.
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup the toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.9

      # The build of the program runs the React Compiler, a development
      # dependency.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Pack the Constitution
        run: |
          bun run build
          tar -czf constitution.tar.gz -C packages/constitution package.json blocks presets templates tools
          sha256sum constitution.tar.gz > constitution.tar.gz.sha256

      - name: Build the program for each platform
        run: |
          for platform in linux-x64:linux-x64 linux-arm64:linux-arm64 darwin-x64:macos-x64 darwin-arm64:macos-arm64; do
            target="${platform%%:*}"
            archive="${platform##*:}"
            bun run build:cli --target "bun-${target}" --outfile "dist/cli/${archive}/bin/constitution"
            tar -czf "constitution-${archive}.tar.gz" -C "dist/cli/${archive}" bin
          done

      - name: Hand the files to the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            constitution.tar.gz
            constitution.tar.gz.sha256
            constitution-*.tar.gz
          if-no-files-found: error

  pre-release:
    needs: assets
    uses: droneey/.github/.github/workflows/cd-release.yaml@1b247b5e6f351a996ce828435b1a4cd89f387914 # v2.8.0
    permissions:
      contents: write
    with:
      prerelease: true
      assets-artifact: release-assets
      assets: >-
        constitution.tar.gz constitution.tar.gz.sha256
        constitution-linux-x64.tar.gz constitution-linux-arm64.tar.gz
        constitution-macos-x64.tar.gz constitution-macos-arm64.tar.gz
