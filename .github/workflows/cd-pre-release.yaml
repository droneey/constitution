name: 🔖 Pre-release

on:
  push:
    tags:
      - 'v*'

jobs:
  pre-release:
    uses: droneey/.github/.github/workflows/cd-release.yaml@b1df2c9432a507a8c2ff15d19ecf524c6ad9ddf0 # v2.6.0
    permissions:
      contents: write
    with:
      prerelease: true
      # The install runs no package's scripts: the archive needs none, and the
      # docs app's would read presets through a link this job never makes.
      assets-command: >-
        npx --yes bun@1.4.3 install --production --frozen-lockfile --ignore-scripts
        && npx --yes bun@1.4.3 run build
        && tar -czf constitution.tar.gz -C packages/constitution
        package.json blocks presets templates tools vocabulary.yaml
        && sha256sum constitution.tar.gz > constitution.tar.gz.sha256
        && npx --yes bun@1.4.3 run build:cli
      # The constitution program for each platform, an archive of bin/constitution that mise
      # unpacks beside the Constitution's as its additional asset.
      assets: >-
        constitution.tar.gz constitution.tar.gz.sha256
        dist/cli/constitution-linux-x64.tar.gz dist/cli/constitution-linux-arm64.tar.gz
        dist/cli/constitution-macos-x64.tar.gz dist/cli/constitution-macos-arm64.tar.gz
        dist/cli/constitution-windows-x64.tar.gz
