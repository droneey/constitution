name: 🔖 Pre-release

on:
  push:
    tags:
      - 'v*'

jobs:
  pre-release:
    uses: droneey/.github/.github/workflows/cd-release.yaml@b1df2c9432a507a8c2ff15d19ecf524c6ad9ddf0 # v2.6.0
    permissions:
      contents: write
    with:
      prerelease: true
      assets-command: >-
        npx --yes bun@1.4.2 install --production --frozen-lockfile
        && npx --yes bun@1.4.2 run build
        && tar -czf constitution.tar.gz presets templates
        tools/mutation-check/dist tools/python-check/dist tools/mutmut-check/dist
        && sha256sum constitution.tar.gz > constitution.tar.gz.sha256
      assets: constitution.tar.gz constitution.tar.gz.sha256
