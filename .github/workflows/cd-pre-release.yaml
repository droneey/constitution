name: 🔖 Pre-release

on:
  push:
    tags: ['v*']

jobs:
  pre-release:
    uses: droneey/.github/.github/workflows/cd-release.yml@v2.5.0
    permissions:
      contents: write
    with:
      prerelease: true
      assets-command: tar -czf constitution.tar.gz presets && sha256sum constitution.tar.gz > constitution.tar.gz.sha256
      assets: constitution.tar.gz constitution.tar.gz.sha256
