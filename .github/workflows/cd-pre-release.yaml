name: 🔖 Pre-release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Why: built before the release opens: an immutable release takes no file after.
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup the toolchain
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19

      # Why: not --production: the executable's build needs the React Compiler.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Pack the release
        run: scripts/pack-release.sh "${GITHUB_WORKSPACE}"

      - name: Hand the files to the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            constitution-*.tar.gz
            constitution-*.tar.gz.sha256
          if-no-files-found: error

  pre-release:
    needs: assets
    # Why: Renovate reads the version from the comment after the pinned digest.
    # yamllint disable-line rule:line-length
    uses: droneey/.github/.github/workflows/cd-release.yaml@95685e4bc5b1d94f67431e96a130ee90207f533d # v2.11.0
    permissions:
      contents: write
    with:
      prerelease: true
      assets-artifact: release-assets
      assets: >-
        constitution-linux-x64.tar.gz constitution-linux-x64.tar.gz.sha256
        constitution-linux-arm64.tar.gz constitution-linux-arm64.tar.gz.sha256
        constitution-macos-x64.tar.gz constitution-macos-x64.tar.gz.sha256
        constitution-macos-arm64.tar.gz constitution-macos-arm64.tar.gz.sha256
        constitution-docs.tar.gz constitution-docs.tar.gz.sha256
