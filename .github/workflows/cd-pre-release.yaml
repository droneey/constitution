name: 🔖 Pre-release

on:
  push:
    tags:
      - 'v*'

jobs:
  pre-release:
    uses: droneey/.github/.github/workflows/cd-release.yaml@b1df2c9432a507a8c2ff15d19ecf524c6ad9ddf0 # v2.6.0
    permissions:
      contents: write
    with:
      prerelease: true
      # The archive a project pins: the rules, the digests the plugin's hooks
      # read, the presets, the templates and the built tools.
      assets-command: >-
        npx --yes bun@1.4.3 install --production --frozen-lockfile
        && npx --yes bun@1.4.3 run build
        && npx --yes bun@1.4.3 run digests:write
        && tar -czf constitution.tar.gz -C packages/constitution
        package.json blocks digests presets templates tools vocabulary.yaml
        && sha256sum constitution.tar.gz > constitution.tar.gz.sha256
      assets: constitution.tar.gz constitution.tar.gz.sha256
