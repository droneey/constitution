name: 🏷️ Version

on:
  push:
    branches: [main]

concurrency:
  group: version
  cancel-in-progress: false

jobs:
  version:
    if: "!startsWith(github.event.head_commit.message, 'chore: Release v')"
    uses: droneey/.github/.github/workflows/cd-version.yaml@v2.6.0
    permissions:
      contents: write
      pull-requests: read
    with:
      version-command: >-
        npm version --no-git-tag-version "$VERSION"
        && sed -i "s/^version: .*/version: $VERSION/" constitution.yaml
        && sed -i "s/\"ref\": \"v[0-9.]*\"/\"ref\": \"v$VERSION\"/" .claude-plugin/marketplace.json
    secrets:
      token: ${{ secrets.GH_TOKEN }}
