name: 🏷️ Version

on:
  push:
    branches:
      - main

concurrency:
  group: version
  cancel-in-progress: false

jobs:
  version:
    if: "!startsWith(github.event.head_commit.message, 'chore: Release v')"
    # Why: Renovate reads the version from the comment after the pinned digest.
    # yamllint disable-line rule:line-length
    uses: droneey/.github/.github/workflows/cd-version.yaml@95685e4bc5b1d94f67431e96a130ee90207f533d # v2.11.0
    permissions:
      contents: write
      pull-requests: read
    with:
      version-command: >-
        sed -i "s/^  \"version\": \".*\",$/  \"version\": \"$VERSION\",/"
        packages/constitution/package.json
        && sed -i "/packages\/constitution\": {/,/version/
        s/version\": \"[^\"]*/version\": \"$VERSION/"
        bun.lock
        && sed -i "s/\"ref\": \"v[0-9.]*\"/\"ref\": \"v$VERSION\"/" .claude-plugin/marketplace.json
    secrets:
      token: ${{ secrets.GH_TOKEN }}
