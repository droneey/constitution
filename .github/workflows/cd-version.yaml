name: 🏷️ Version

on:
  push:
    branches:
      - main

concurrency:
  group: version
  cancel-in-progress: false

jobs:
  version:
    if: "!startsWith(github.event.head_commit.message, 'chore: Release v')"
    uses: droneey/.github/.github/workflows/cd-version.yaml@b1df2c9432a507a8c2ff15d19ecf524c6ad9ddf0 # v2.6.0
    permissions:
      contents: write
      pull-requests: read
    with:
      version-command: >-
        sed -i "s/^  \"version\": \".*\",$/  \"version\": \"$VERSION\",/" packages/constitution/package.json
        && sed -i "/packages\/constitution\": {/,/version/ s/version\": \"[^\"]*/version\": \"$VERSION/" bun.lock
        && sed -i "s/^version: .*/version: $VERSION/" constitution.yaml
        && sed -i "s/\"ref\": \"v[0-9.]*\"/\"ref\": \"v$VERSION\"/" .claude-plugin/marketplace.json
    secrets:
      token: ${{ secrets.GH_TOKEN }}
