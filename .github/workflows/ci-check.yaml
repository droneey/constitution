name: ☑️ Check

on:
  pull_request:
    branches:
      - main

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The project's one check, the same command an agent runs before it hands a
  # change back; Ubuntu's awk is mawk unless gawk is installed, so the hook's
  # specs inside it run under mawk.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup the toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Put mawk first as awk
        run: |
          mkdir -p "${RUNNER_TEMP}/mawk"
          ln -s "$(command -v mawk)" "${RUNNER_TEMP}/mawk/awk"
          echo "${RUNNER_TEMP}/mawk" >> "${GITHUB_PATH}"

      - name: Check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Lint the workflows
        run: actionlint -color

  # The hook must run under every shell and awk a project may have: its specs
  # again under gawk, whose length() counts bytes under the hook's LC_ALL=C as
  # mawk's and BSD awk's do, and under the bash 3.2 and the awk macOS ships.
  test-hooks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: gawk
            os: ubuntu-latest
            shell: bash
          - environment: macOS bash 3.2 and awk
            os: macos-latest
            shell: /bin/bash
    name: test:hooks (${{ matrix.environment }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup the toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Put gawk first as awk
        if: matrix.environment == 'gawk'
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes gawk
          mkdir -p "${RUNNER_TEMP}/gawk"
          ln -s "$(command -v gawk)" "${RUNNER_TEMP}/gawk/awk"
          echo "${RUNNER_TEMP}/gawk" >> "${GITHUB_PATH}"

      - name: Run the hook's specs
        env:
          HOOK_SHELL: ${{ matrix.shell }}
        run: bun run test:hooks
