name: ☑️ Check

on:
  pull_request:
    branches:
      - main

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The project's one check, the same command an agent runs before it hands a
  # change back.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup the toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run constitution run check

      - name: Build
        run: bun run --cwd packages/constitution build

  # check proves the logic once; an executable the release ships can still break on
  # its own platform, so each is built and run on its own runner.
  executable:
    name: executable (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup the toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the executable's specs
        env:
          HOOK_SHELL: /bin/bash
        run: bun run --cwd packages/constitution executable:test
