name: ☑️ Check

on:
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A changed spec mutates the files it proves in full: up to about 3,000 mutants, about 30 minutes here.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup the toolchain
        uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.9.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Ubuntu's awk is mawk unless gawk is installed; the hook must run under mawk.
      - name: Put mawk first as awk
        run: |
          mkdir -p "${RUNNER_TEMP}/mawk"
          ln -s "$(command -v mawk)" "${RUNNER_TEMP}/mawk/awk"
          echo "${RUNNER_TEMP}/mawk" >> "${GITHUB_PATH}"

      - name: Check
        run: bun run check

      - name: Build
        run: bun run build

      # The spec, again with gawk as awk: under the hook's LC_ALL=C its length()
      # counts bytes, as mawk's and BSD awk's do.
      - name: Run the hook under gawk
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes gawk
          mkdir -p "${RUNNER_TEMP}/gawk"
          ln -s "$(command -v gawk)" "${RUNNER_TEMP}/gawk/awk"
          PATH="${RUNNER_TEMP}/gawk:${PATH}" bun run test

      - name: Lint the workflows
        run: actionlint -color

  check-on-macos:
    needs: check
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup the toolchain
        uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.9.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The whole suite, since the coverage gate fails a run of one folder; the
      # end-to-end spec runs the hook under /bin/bash 3.2 and the system awk.
      - name: Run the hook under bash 3.2 and the system awk
        env:
          HOOK_SHELL: /bin/bash
        run: bun run test
