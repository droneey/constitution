name: 📦 Publish

# Points the marketplace at the plugin archive a release attaches, pre-releases
# included: the archive holds the digests, which no commit does.
on:
  release:
    types:
      - published

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.GH_TOKEN }}

      # The digest pinned is the one of the file the release serves, checked
      # against the digest the release attaches beside it.
      - name: Point the marketplace at the release archive
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "${TAG} is not a release tag v<major>.<minor>.<patch>" >&2
            exit 1
          fi
          download="${RUNNER_TEMP}/release"
          gh release download "${TAG}" --repo "${REPOSITORY}" --dir "${download}" \
            --pattern constitution-plugin.zip --pattern constitution-plugin.zip.sha256
          (cd "${download}" && sha256sum --check --strict constitution-plugin.zip.sha256)
          SHA256="$(cut -d ' ' -f 1 "${download}/constitution-plugin.zip.sha256")"
          URL="https://github.com/${REPOSITORY}/releases/download/${TAG}/constitution-plugin.zip"
          export SHA256 URL
          jq '(.plugins[] | select(.name == "constitution") | .source)
            = {source: "archive", url: env.URL, sha256: env.SHA256}' \
            .claude-plugin/marketplace.json >"${RUNNER_TEMP}/marketplace.json"
          mv "${RUNNER_TEMP}/marketplace.json" .claude-plugin/marketplace.json

      - name: Commit the marketplace to main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json
          if git diff --cached --quiet; then
            echo "The marketplace already serves ${TAG}"
            exit 0
          fi
          git commit -m "chore: Publish ${TAG} to the marketplace" --no-verify
          git pull --rebase origin main
          git push origin HEAD:main
