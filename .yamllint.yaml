# the members, each checked by its own configuration in its own run; then .gitignore's paths, the
# environment uv builds and the lockfiles mise writes
ignore:
  - /apps/docs/**
  - /packages/constitution/**
  - /packages/design-browser/**
  - /packages/design-cli/**
  - /packages/design-tokens/**
  - /packages/mutation-check/languages/python/**
  - /packages/mutation-check/languages/typescript/**
  - /packages/python-check/**
  - /.droneey/
  - /.mise/locks/
  - /.venv/
  - /local/
  - node_modules/
  - dist/
rules:
  indentation:
    spaces: 2
    indent-sequences: true
  key-duplicates: enable
  braces:
    forbid: non-empty
  brackets:
    forbid: non-empty
  truthy:
    level: error
    allowed-values:
      - 'true'
      - 'false'
    check-keys: false
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
  anchors:
    forbid-unused-anchors: true
  line-length:
    max: 100
    allow-non-breakable-inline-mappings: true
  comments:
    level: error
    min-spaces-from-content: 1
  comments-indentation:
    level: error
  document-start: disable
  document-end: disable
  empty-lines:
    max: 1
extends: default
