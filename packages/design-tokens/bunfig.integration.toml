[test]
preload = []
randomize = true
pathIgnorePatterns = ["tests/**"]
coverage = true
coverageReporter = ["text"]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "**/__tests__/**",
  "**/main.*",
  "**/root/wiring.*",
  "**/*.gen.*",
  "../**"
]

[test.coverageThreshold]
functions = 1
lines = 1
