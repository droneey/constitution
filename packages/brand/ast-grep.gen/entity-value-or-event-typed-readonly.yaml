# typescript
# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: entity-value-or-event-typed-readonly@typescript
language: Tsx
severity: error
message: 'A field of a business type that is not readonly: the value is shared, and a change made
  in place goes unseen'
files:
  - '**/domain/**'
  - '**/kernel/**'
ignores:
  - '**/__tests__/**'
rule:
  any:
    - kind: property_signature
    - kind: index_signature
      not:
        has:
          kind: mapped_type_clause
  not:
    any:
      - regex: ^readonly\s
      - inside:
          stopBy: end
          any:
            - kind: generic_type
              has:
                field: name
                regex: ^Readonly$
            - kind: required_parameter
            - kind: optional_parameter
            - kind: function_type
  matches: entity-value-or-event-typed-readonly@typescript
