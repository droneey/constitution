# yaml-language-server:$schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: str-enum-member-value-never-left-to-auto@python
language: Python
severity: error
message: "Write out the string the program stores and sends: `auto()` follows the member's name"
rule:
  kind: assignment
  has:
    field: right
    regex: ^(?:enum\.)?auto\(\)$
  inside:
    kind: expression_statement
    inside:
      kind: block
      inside:
        kind: class_definition
        field: body
        has:
          field: superclasses
          has:
            regex: ^(?:enum\.)?StrEnum$
