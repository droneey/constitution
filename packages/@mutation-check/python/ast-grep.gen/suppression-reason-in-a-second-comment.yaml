# yaml-language-server:$schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: suppression-reason-in-a-second-comment@python
language: Python
severity: error
message: >-
  Give the suppression its reason in a second comment after its codes, opened by the reason
  marker, as `# noqa: <code>  # Why: <reason>`
# Why: every tool's codes end at a second `#`, so the codes of each form are skipped up to it.
rule:
  kind: comment
  any:
    - regex: '^#\s*(?:type|ty|pyright)\s*:\s*ignore\b'
    - regex: '(?i)^#\s*noqa\s*:'
    - regex: '(?i)^#\s*ruff\s*:\s*ignore\b'
    - regex: '^#\s*pragma\s*:'
  not:
    regex: '(?i:^#\s*(?:(?:type|ty|pyright|ruff)\s*:\s*ignore(?:\[[^\]]*\])?|(?:noqa|pragma)\s*:[^#]*))\s*#\s*Why:\s*\S'
