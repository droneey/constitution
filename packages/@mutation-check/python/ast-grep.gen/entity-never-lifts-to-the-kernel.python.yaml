# yaml-language-server:$schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: entity-never-lifts-to-the-kernel@python
language: Python
severity: error
message: >-
  An entity in the kernel: keep it in the feature that owns its life, and give the others a narrow
  view of it or its identifier
files:
  - '**/kernel/**/*entity.py'
  - '**/kernel/**/*aggregate.py'
  - '**/kernel/**/entities/**/*.py'
rule:
  kind: module
