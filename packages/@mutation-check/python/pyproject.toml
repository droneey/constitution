source_modules = ["**.use_cases.queries", "**.bindings.queries"]
forbidden_modules = ["**.use_cases.commands", "**.bindings.commands"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "query-and-command-apart.commands"
name = "query-and-command-apart"
type = "forbidden"
source_modules = ["**.use_cases.commands", "**.bindings.commands"]
forbidden_modules = ["**.use_cases.queries", "**.bindings.queries"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "layer-imports-dependencies-by-its-role"
type = "layer-imports-dependencies-by-its-role"
feature_form_layers = ["features", "composition"]
pure_layers = ["kernel"]
pure_module_layers = ["domain", "application"]
edge_layers = ["infrastructure", "integrations", "libs", "root"]
edge_module_layers = ["infrastructure"]
module_layers = ["domain", "application", "infrastructure", "presentation"]
entry = "main"
extra_entry = "entrypoints"

[[tool.importlinter.contracts]]
name = "surface-only-on-a-module-or-one-kind"
type = "forbidden"
source_modules = ["**"]
forbidden_modules = [
  "droneey_mutation_check_python",
  "*.infrastructure",
  "*.composition",
  "*.composition.*.infrastructure",
  "*.composition.*.application",
  "*.composition.*.presentation",
  "*.composition.*.domain",
  "*.composition.*.domain.*",
  "*.features",
  "*.features.*.infrastructure",
  "*.features.*.application",
  "*.features.*.presentation",
  "*.features.*.domain",
  "*.features.*.domain.*",
  "*.integrations",
  "*.kernel",
  "*.libs",
  "*.shared"
]
as_packages = false
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "module-reached-only-through-its-surface.kernel"
name = "module-reached-only-through-its-surface"
type = "protected"
protected_modules = ["*.kernel.*.*"]
allowed_importers = ["*.kernel.*"]

[[tool.importlinter.contracts]]
id = "module-reached-only-through-its-surface.adapters"
name = "module-reached-only-through-its-surface"
type = "protected"
protected_modules = ["*.infrastructure.*.*"]
allowed_importers = ["*.infrastructure.*"]

[[tool.importlinter.contracts]]
id = "module-reached-only-through-its-surface.composition"
name = "module-reached-only-through-its-surface"
type = "protected"
protected_modules = ["*.composition.*.*"]
allowed_importers = ["*.composition.*"]
ignore_imports = [
  "*.root -> *.composition.*.infrastructure.*",
  "*.root.** -> *.composition.*.infrastructure.*",
  "* -> *.composition.*.infrastructure.*"
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
id = "module-reached-only-through-its-surface.features"
name = "module-reached-only-through-its-surface"
type = "protected"
protected_modules = ["*.features.*.*"]
allowed_importers = ["*.features.*"]
ignore_imports = [
  "*.root -> *.features.*.infrastructure.*",
  "*.root.** -> *.features.*.infrastructure.*",
  "* -> *.features.*.infrastructure.*"
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
id = "module-reached-only-through-its-surface.libs"
name = "module-reached-only-through-its-surface"
type = "protected"
protected_modules = ["*.libs.*.*"]
allowed_importers = ["*.libs.*"]

[[tool.importlinter.contracts]]
id = "module-reached-only-through-its-surface.shared"
name = "module-reached-only-through-its-surface"
type = "protected"
protected_modules = ["*.shared.*.*"]
allowed_importers = ["*.shared.*"]

[[tool.importlinter.contracts]]
name = "relative-imports-stay-in-the-module"
type = "relative-imports-stay-in-the-module"
