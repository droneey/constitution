# python
[project]
name = "droneey-mutation-check-python"
version = "0.0.0"
requires-python = ">=3.14"
authors = [{ name = "Dmytro Kurovskyi", email = "me@kurovskyi.dev" }]
# Why: it ships only inside the Constitution's distribution.
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[project.scripts]
mutmut-check = "droneey_mutation_check_python.main:main"

# uv
[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

# pytest
[tool.pytest]
minversion = "9.1"
strict = true
testpaths = ["tests"]
pythonpath = ["tests"]
# Why: the list replaces pytest's defaults: `.*` keeps the hidden folders out, or Hypothesis warns
# of .hypothesis/.
norecursedirs = [".*", "integration", "e2e"]
addopts = ["-ra", "--import-mode=importlib"]
filterwarnings = ["error"]
anyio_mode = "auto"
timeout = "10"

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["**/main.py", "**/__main__.py", "**/root/wiring.py", "**/*_gen.py", "**/*_gen/**"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "assert_never\\("]

[tool.mutmut]
# mutmut
source_paths = ["src"]
do_not_mutate = ["*/root/wiring.py", "*_messages.py", "*/main.py", "*_gen.py", "*_gen/*"]
# Why: a log call's text and level are no behaviour a caller relies on.
do_not_mutate_patterns = ['^\s*logger\.(debug|info|warning|error|exception|critical)\(']
# Why: each mutant's run collects the integration specs too, as the coverage gate's run does.
pytest_add_cli_args = ["-p", "no:randomly", "-o", "norecursedirs=.* e2e"]

# ty
type_check_command = ["ty", "check", "--output-format", "gitlab"]

# vulture
[tool.vulture]
ignore_names = [
  "main", # the entry of the zipapp in the distribution and of the console script
]
paths = ["src"]
min_confidence = 60

# complexipy
[tool.complexipy]
max-complexity-allowed = 15

# deptry
[tool.deptry]
ignore = []

[tool.ruff]
target-version = "py314"

# ruff
indent-width = 2
line-length = 100

[tool.ruff.lint]
extend-select = [
  # ruff
  "ARG",
  "F401",
  "F841",
  "F842",
  "B904",
  "BLE",
  "EM",
  "TRY",
  "FBT",
  "ERA",
  "FIX",
  "PLR0917",
  "PLR2004",
  "RUF006",
  "S",
  "T10",
  "T20",
  "E722",
  "G001",
  "G002",
  "G003",
  "G004",
  "D",
  "SLF",
  "TC",
  "ANN",
  "ASYNC",
  "DTZ",
  "INP",
  "N",
  "N999",
  "PLW0602",
  "PLW0603",
  "RUF012",
  "S110",
  "S112",
  "SIM115",
  "TID251",
  "UP037",
  "UP040",
  "UP046",
  "UP047",

  # pytest
  "PT"
]

# ruff
extend-ignore = ["D1"]
ignore = ["PLR09"]
select = [
  "PGH",
  "RUF",
  "A",
  "ASYNC",
  "B",
  "C4",
  "E",
  "EXE",
  "F402",
  "F403",
  "F404",
  "F405",
  "F406",
  "F407",
  "F5",
  "F6",
  "F7",
  "F81",
  "F82",
  "F9",
  "FURB",
  "G",
  "I",
  "ICN",
  "ISC",
  "LOG",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PYI",
  "RET",
  "RSE",
  "SIM",
  "SLOT",
  "UP",
  "W"
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**" = ["INP001", "PLR2004", "S101"]

[tool.ruff.lint.pylint]
max-positional-args = 3

# pytest
[tool.ruff.lint.flake8-tidy-imports.extend-banned-api."pytest.importorskip"]
msg = "a spec runs whole, or is deleted"

[tool.ruff.lint.flake8-tidy-imports.extend-banned-api."pytest.mark.skip"]
msg = "a spec runs whole, or is deleted"

[tool.ruff.lint.flake8-tidy-imports.extend-banned-api."pytest.mark.skipif"]
msg = "a spec runs whole, or is deleted"

[tool.ruff.lint.flake8-tidy-imports.extend-banned-api."pytest.mark.xfail"]
msg = "a spec runs whole, or is deleted"

[tool.ruff.lint.flake8-tidy-imports.extend-banned-api."pytest.skip"]
msg = "a spec runs whole, or is deleted"

[tool.ruff.lint.flake8-tidy-imports.extend-banned-api."pytest.xfail"]
msg = "a spec runs whole, or is deleted"

[tool.ruff.lint.flake8-tidy-imports.extend-banned-api."pytest.mark.flaky"]
msg = "a flaky case is fixed or deleted, never run again"

[tool.ruff.lint.flake8-tidy-imports.extend-banned-api.pytest_asyncio]
msg = "async specs run on anyio's plugin"

[tool.ruff.lint.flake8-tidy-imports.extend-banned-api."unittest.mock"]
msg = "an effect is replaced by the fake of its contract"

# ruff
[tool.ruff.lint.flake8-tidy-imports.banned-api."sys.path"]
msg = "a module is imported as a member of an installed package"

# ruff
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

# pytest
[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

# ruff
[tool.ruff.format]
docstring-code-format = true
quote-style = "single"

[tool.poe]
# poe
executor = "simple"

[tool.poe.tasks]
# biome
"check:biome" = "bunx --bun biome check --error-on-warnings"
"fix:biome" = "bunx --bun biome check --write"

# complexipy
"check:complexity" = "complexipy src tests"

# deptry
"check:dependencies" = "deptry src"

# pytest
"test:specs" = "pytest --cov -o \"norecursedirs=.* e2e\""

# python-check
"check:code" = "python-check src tests"

# ruff
"check:format" = "ruff format --check"
"check:lint" = "ruff check"
"fix:format" = "ruff format"
"fix:lint" = "ruff check --fix"

# ty
"check:types" = "ty check"

# vulture
"check:unused" = "vulture"

# tombi
"fix:toml" = "tombi format"

# yamllint
"check:yaml" = "yamllint --strict ."

# mutmut
"mutate:branch" = "mutmut-check"
"mutate:all" = "mutmut-check all"

# jscpd
"check:duplicates" = "bunx --bun jscpd"

# poe
[tool.poe.tasks.test]
shell = "for task in $(poe _list_tasks | tr ' ' '\\n' | sort); do case \"$task\" in test:*) poe \"$task\" || exit 1;; esac; done"

[tool.poe.tasks.fix]
shell = "for task in $(poe _list_tasks | tr ' ' '\\n' | sort); do case \"$task\" in fix:*) poe \"$task\" || exit 1;; esac; done"

# tombi
[tool.poe.tasks."check:toml"]
shell = "tombi format --check && tombi lint"

# poe
[tool.poe.tasks.check]
shell = "for task in $(poe _list_tasks | tr ' ' '\\n' | sort); do case \"$task\" in check:*) poe \"$task\" || exit 1;; esac; done && poe test && poe mutate:branch"

[tool.poe.tasks.build]
shell = "mkdir -p dist && python -m zipapp src -m droneey_mutation_check_python.main:main -o dist/mutmut-check.pyz"

# ty
[tool.ty.rules]
all = "error"

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.terminal]
error-on-warning = true
