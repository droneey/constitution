# python
[project]
name = "droneey-mutation-check-python"
version = "0.0.0"
requires-python = ">=3.14"
authors = [{ name = "Dmytro Kurovskyi", email = "me@kurovskyi.dev" }]
# Why: it ships only inside the Constitution's distribution.
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[project.scripts]
mutmut-check = "droneey_mutation_check_python.main:main"

# uv
[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

# pytest
[tool.pytest]
minversion = "9.1"
strict = true
testpaths = ["tests"]
pythonpath = ["tests"]
# Why: the list replaces pytest's defaults: `.*` keeps the hidden folders out, or Hypothesis warns
# of .hypothesis/.
norecursedirs = [".*", "integration", "e2e"]
addopts = ["-ra", "--import-mode=importlib"]
filterwarnings = ["error"]
anyio_mode = "auto"
timeout = "10"

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["**/root/**", "**/main.py", "**/__main__.py", "**/*_gen.py", "**/*_gen/**"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "assert_never\\("]

[tool.mutmut]
# mutmut
source_paths = ["src"]
do_not_mutate = ["*/root/*", "*/main.py", "*_gen.py", "*_gen/*"]
# Why: a log call's text and level are no behaviour a caller relies on.
do_not_mutate_patterns = ['^\s*logger\.(debug|info|warning|error|exception|critical)\(']
# Why: each mutant's run collects the integration specs too, as the coverage gate's run does.
pytest_add_cli_args = ["-p", "no:randomly", "-o", "norecursedirs=.* e2e"]

# ty
type_check_command = ["ty", "check", "--output-format", "gitlab"]

# vulture
[tool.vulture]
ignore_names = [
  "main", # the entry of the zipapp in the distribution and of the console script
]
paths = ["src"]
min_confidence = 60

# complexipy
[tool.complexipy]
max-complexity-allowed = 15

# deptry
[tool.deptry]
ignore = []

[tool.ruff]
target-version = "py314"

# ruff
indent-width = 2
line-length = 100

# import-linter
extend-exclude = ["import_linter_gen"]

[tool.ruff.lint]
extend-select = [
  # ruff
  "ARG",
  "F401",
  "F841",
  "F842",
  "B904",
  "BLE",
  "EM",
  "TRY",
  "FBT",
  "ERA",
  "FIX",
  "PLR0917",
  "PLR2004",
  "RUF006",
  "S",
  "T10",
  "E722",
  "G001",
  "G002",
  "G003",
  "G004",
  "S101",
  "D",
  "SLF",
  "TC",
  "ANN",
  "ASYNC",
  "DTZ",
  "INP",
  "N",
  "N999",
  "PLW0602",
  "PLW0603",
  "RUF012",
  "S110",
  "S112",
  "SIM115",
  "TID251",
  "UP037",
  "UP040",
  "UP046",
  "UP047",
  "RUF022",

  # pytest
  "PT"
]

# ruff
ignore = ["D1", "PLR09"]
select = [
  "PGH",
  "RUF",
  "A",
  "ASYNC",
  "B",
  "C4",
  "E",
  "EXE",
  "F402",
  "F403",
  "F404",
  "F405",
  "F406",
  "F407",
  "F5",
  "F6",
  "F7",
  "F81",
  "F82",
  "F9",
  "FURB",
  "G",
  "I",
  "ICN",
  "ISC",
  "LOG",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PYI",
  "RET",
  "RSE",
  "SIM",
  "SLOT",
  "UP",
  "W"
]
explicit-preview-rules = true

[tool.ruff.lint.extend-per-file-ignores]
"tests/**" = ["S101", "INP001", "PLR2004"]

[tool.ruff.lint.pylint]
max-positional-args = 3

# pytest
[tool.ruff.lint.flake8-tidy-imports.extend-banned-api."pytest.importorskip"]
msg = "a spec runs whole, or is deleted"

[tool.ruff.lint.flake8-tidy-imports.extend-banned-api."pytest.mark.skip"]
msg = "a spec runs whole, or is deleted"

[tool.ruff.lint.flake8-tidy-imports.extend-banned-api."pytest.mark.skipif"]
msg = "a spec runs whole, or is deleted"

[tool.ruff.lint.flake8-tidy-imports.extend-banned-api."pytest.mark.xfail"]
msg = "a spec runs whole, or is deleted"

[tool.ruff.lint.flake8-tidy-imports.extend-banned-api."pytest.skip"]
msg = "a spec runs whole, or is deleted"

[tool.ruff.lint.flake8-tidy-imports.extend-banned-api."pytest.xfail"]
msg = "a spec runs whole, or is deleted"

[tool.ruff.lint.flake8-tidy-imports.extend-banned-api."pytest.mark.flaky"]
msg = "a flaky case is fixed or deleted, never run again"

[tool.ruff.lint.flake8-tidy-imports.extend-banned-api.pytest_asyncio]
msg = "async specs run on anyio's plugin"

[tool.ruff.lint.flake8-tidy-imports.extend-banned-api."unittest.mock"]
msg = "an effect is replaced by the fake of its contract"

# ruff
[tool.ruff.lint.flake8-tidy-imports.banned-api."sys.path"]
msg = "a module is imported as a member of an installed package"

[tool.ruff.lint.flake8-tidy-imports.banned-api."typing.cast"]
msg = "a type is proven by a check, never claimed by a cast"

[tool.ruff.lint.flake8-tidy-imports.banned-api."typing_extensions.cast"]
msg = "a type is proven by a check, never claimed by a cast"

# ruff
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

# pytest
[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

# ruff
[tool.ruff.format]
docstring-code-format = true
quote-style = "single"
indent-style = "space"

[tool.poe]
# task-runner/poe
executor = "simple"

[tool.poe.tasks]
# complexipy
"check:complexity" = "complexipy src tests"

# deptry
"check:dependencies" = "deptry src"

# pytest
"test:specs" = "pytest --cov -o \"norecursedirs=.* e2e\""

# ty
"check:types" = "ty check"

# vulture
"check:unused" = "vulture"

# mutmut
"mutate:branch" = "mutmut-check"
"mutate:all" = "mutmut-check all"

# jscpd
"check:duplicates" = "bunx --bun jscpd"

[tool.poe.tasks.build]
shell = "mkdir -p dist && python -m zipapp src -m droneey_mutation_check_python.main:main -o dist/mutmut-check.pyz"

# task-runner/poe
[tool.poe.tasks.check]
shell = "../../../.droneey/constitution/presets/task-runner/poe/plugins/shell/task-group-walks-poes-own-list.sh check && poe test && poe mutate:branch"

[tool.poe.tasks.test]
shell = "../../../.droneey/constitution/presets/task-runner/poe/plugins/shell/task-group-walks-poes-own-list.sh test"

[tool.poe.tasks.fix]
shell = "../../../.droneey/constitution/presets/task-runner/poe/plugins/shell/task-group-walks-poes-own-list.sh fix"

[tool.poe.tasks.pack]
cmd = "scripts/pack.sh"

# biome
[tool.poe.tasks."check:format"]
shell = "bunx --bun biome format && ruff format --check && tombi format --check"

[tool.poe.tasks."fix:format"]
shell = "bunx --bun biome format --write && ruff format && tombi format"

# ast-grep
[tool.poe.tasks."check:lint"]
shell = "ast-grep scan && bunx --bun biome check --formatter-enabled=false --error-on-warnings && ruff check && tombi lint && ../../../.droneey/constitution/presets/plugins/shell/run-on-files.sh '*.yaml' '*.yml' -- yamllint --strict --"

# biome
[tool.poe.tasks."fix:lint"]
shell = "bunx --bun biome check --write && ruff check --fix"

# import-linter
[tool.poe.tasks."check:architecture"]
cmd = "lint-imports --no-logo"

[tool.poe.tasks."check:architecture".env]
PYTHONPATH = "import_linter_gen"

# ty
[tool.ty.rules]
all = "error"

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.terminal]
error-on-warning = true

# import-linter
[tool.importlinter]
include_external_packages = true
contract_types = [
  "layer-imports-dependencies-by-its-role: layer_imports_dependencies_by_its_role.LayerImportsDependenciesByItsRoleContract",
  "relative-imports-stay-in-the-module: relative_imports_stay_in_the_module.RelativeImportsStayInTheModuleContract"
]
root_packages = ["droneey_mutation_check_python"]

[[tool.importlinter.contracts]]
name = "module-imports-form-no-cycle"
type = "acyclic_siblings"
ancestors = ["droneey_mutation_check_python"]

[[tool.importlinter.contracts]]
name = "kernel-imports-only-itself"
type = "forbidden"
source_modules = ["*.kernel"]
forbidden_modules = [
  "*.infrastructure",
  "*.composition",
  "*.entrypoints",
  "*.features",
  "*.integrations",
  "*.libs",
  "*.root",
  "*.shared"
]

[[tool.importlinter.contracts]]
name = "libs-import-no-code-of-the-program"
type = "forbidden"
source_modules = ["*.libs"]
forbidden_modules = [
  "*.infrastructure",
  "*.composition",
  "*.entrypoints",
  "*.features",
  "*.integrations",
  "*.kernel",
  "*.root",
  "*.shared"
]

[[tool.importlinter.contracts]]
name = "shared-imports-no-feature-adapter-port-or-root"
type = "forbidden"
source_modules = ["*.shared"]
forbidden_modules = [
  "*.infrastructure",
  "*.composition",
  "*.features",
  "*.integrations",
  "*.kernel.contracts",
  "*.root"
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "domain-imports-only-itself-and-the-kernel"
type = "forbidden"
source_modules = ["*.features.*.domain"]
forbidden_modules = [
  "*.infrastructure",
  "*.composition",
  "*.entrypoints",
  "*.features.*.infrastructure",
  "*.features.*.application",
  "*.features.*.presentation",
  "*.kernel.contracts",
  "*.integrations",
  "*.libs",
  "*.root",
  "*.shared"
]

[[tool.importlinter.contracts]]
name = "application-imports-only-its-domain-the-kernel-and-composed-surfaces"
type = "forbidden"
source_modules = ["*.composition.*.application", "*.features.*.application"]
forbidden_modules = [
  "*.infrastructure",
  "*.composition.*.infrastructure",
  "*.composition.*.presentation",
  "*.features.*.infrastructure",
  "*.features.*.presentation",
  "*.entrypoints",
  "*.integrations",
  "*.libs",
  "*.root",
  "*.shared"
]

[[tool.importlinter.contracts]]
name = "feature-never-imports-a-feature"
type = "independence"
modules = ["*.features.*"]

[[tool.importlinter.contracts]]
name = "binding-unit-calls-only-use-cases"
type = "forbidden"
source_modules = ["*.composition.*.presentation", "*.features.*.presentation"]
forbidden_modules = ["*.composition.*.application.contracts", "*.features.*.application.contracts"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "domain-model-changed-only-through-a-use-case.presentation"
name = "domain-model-changed-only-through-a-use-case"
type = "forbidden"
source_modules = ["*.composition.*.presentation", "*.features.*.presentation"]
forbidden_modules = ["*.composition.*.domain.*.transitions", "*.features.*.domain.*.transitions"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "domain-model-changed-only-through-a-use-case.adapters"
name = "domain-model-changed-only-through-a-use-case"
type = "forbidden"
source_modules = ["*.composition.*.infrastructure", "*.features.*.infrastructure"]
forbidden_modules = ["*.composition.*.domain.*.transitions", "*.features.*.domain.*.transitions"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "composition-module-never-imports-another"
type = "independence"
modules = ["*.composition.*"]

[[tool.importlinter.contracts]]
id = "adapter-imports-only-its-owners-domain-ports-or-shared-layers.adapters-apart"
name = "adapter-imports-only-its-owners-domain-ports-or-shared-layers"
type = "independence"
modules = [
  "*.infrastructure.*",
  "*.composition.*.infrastructure.*",
  "*.features.*.infrastructure.*"
]

[[tool.importlinter.contracts]]
id = "adapter-imports-only-its-owners-domain-ports-or-shared-layers.outer-layers"
name = "adapter-imports-only-its-owners-domain-ports-or-shared-layers"
type = "forbidden"
source_modules = ["*.infrastructure", "*.features.*.infrastructure"]
forbidden_modules = [
  "*.composition",
  "*.entrypoints",
  "*.features.*.application.use_cases",
  "*.features.*.presentation",
  "*.root"
]

[[tool.importlinter.contracts]]
id = "adapter-imports-only-its-owners-domain-ports-or-shared-layers.shared-adapters"
name = "adapter-imports-only-its-owners-domain-ports-or-shared-layers"
type = "forbidden"
source_modules = ["*.infrastructure"]
forbidden_modules = ["*.features"]

[[tool.importlinter.contracts]]
id = "adapter-imports-only-its-owners-domain-ports-or-shared-layers.composition-adapters"
name = "adapter-imports-only-its-owners-domain-ports-or-shared-layers"
type = "forbidden"
source_modules = ["*.composition.*.infrastructure"]
forbidden_modules = [
  "*.composition.*.application.use_cases",
  "*.composition.*.presentation",
  "*.entrypoints",
  "*.features.*.infrastructure",
  "*.features.*.application.use_cases",
  "*.features.*.presentation",
  "*.root"
]

[[tool.importlinter.contracts]]
name = "root-imported-only-by-entry-files"
type = "protected"
protected_modules = ["*.root"]
allowed_importers = ["*.main", "*.entrypoints.*.main"]

[[tool.importlinter.contracts]]
name = "adapter-imported-only-by-the-root"
type = "protected"
protected_modules = [
  "*.infrastructure",
  "*.infrastructure.**",
  "*.composition.*.infrastructure",
  "*.composition.*.infrastructure.**",
  "*.features.*.infrastructure",
  "*.features.*.infrastructure.**"
]
allowed_importers = [
  "*",
  "*.root",
  "*.root.**",
  "*.infrastructure",
  "*.infrastructure.**",
  "*.composition.*.infrastructure",
  "*.composition.*.infrastructure.**",
  "*.features.*.infrastructure",
  "*.features.*.infrastructure.**"
]
as_packages = false

[[tool.importlinter.contracts]]
id = "entrypoint-never-imported.entrypoints"
name = "entrypoint-never-imported"
type = "protected"
protected_modules = ["*.entrypoints"]
allowed_importers = []

[[tool.importlinter.contracts]]
id = "entrypoint-never-imported.entrypoints-apart"
name = "entrypoint-never-imported"
type = "independence"
modules = ["*.entrypoints.*"]

[[tool.importlinter.contracts]]
id = "entrypoint-never-imported.dunder-main"
name = "entrypoint-never-imported"
type = "protected"
protected_modules = ["*.__main__"]
allowed_importers = []

[[tool.importlinter.contracts]]
id = "entrypoint-never-imported.main"
name = "entrypoint-never-imported"
type = "protected"
protected_modules = ["*.main"]
allowed_importers = ["*.__main__"]

[[tool.importlinter.contracts]]
id = "integration-never-imported.integrations"
name = "integration-never-imported"
type = "protected"
protected_modules = ["*.integrations"]
allowed_importers = []

[[tool.importlinter.contracts]]
id = "integration-never-imported.integrations-apart"
name = "integration-never-imported"
type = "independence"
modules = ["*.integrations.*"]

[[tool.importlinter.contracts]]
name = "import-points-inward"
type = "forbidden"
source_modules = ["*.infrastructure", "*.features", "*.kernel", "*.libs", "*.shared"]
forbidden_modules = ["*.composition"]

[[tool.importlinter.contracts]]
id = "query-and-command-apart.queries"
name = "query-and-command-apart"
