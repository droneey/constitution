# Why: the package is mutation-check itself, which runs from its own source.
stryker:
  '*':
    typescript:
      package.json:
        scripts:
          mutate:branch: !replace bun --no-env-file ${role.source}/${role.entry}.ts
          mutate:all: !replace bun --no-env-file ${role.source}/${role.entry}.ts all
