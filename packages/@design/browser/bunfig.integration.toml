[test]
preload = ["./src/__tests__/dom.fixtures.ts"]

# bun-test
randomize = true
pathIgnorePatterns = ["tests/**"]
coverage = true
coverageReporter = ["text"]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  # bun-test
  "**/root/**",
  "**/__tests__/**",
  "**/main.*",
  "**/*.gen.*",

  # workspace
  "../**"
]

# bun-test
[test.coverageThreshold]
functions = 1
lines = 1
