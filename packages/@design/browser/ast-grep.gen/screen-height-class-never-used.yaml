# yaml-language-server:$schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: screen-height-class-never-used@typescript
language: Tsx
severity: error
message: >-
  Size to the small viewport with h-svh, or to the container: h-screen ignores the phone's toolbars
utils:
  class-call:
    kind: call_expression
    has:
      field: function
      kind: identifier
      regex: ^(?:cva|cn|clsx|twMerge)$
  class-attribute-value:
    any:
      - kind: string
      - kind: jsx_expression
    inside:
      kind: jsx_attribute
      has:
        kind: property_identifier
        regex: ^className$
  class-list:
    any:
      - matches: class-attribute-value
      - matches: class-call
        not:
          inside:
            stopBy: end
            any:
              - matches: class-call
              - matches: class-attribute-value
rule:
  matches: class-list
  regex: '(?:^|[^\w-])(?:min-|max-)?h-(?:screen|lvh)(?:[^\w-]|$)'
