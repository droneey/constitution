# yaml-language-server:$schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: spawn-given-an-env-built-for-it@typescript
language: Tsx
severity: error
message: >-
  Build the child's env for it: left out, passed or copied, process.env hands it every secret
files:
  - '**/*.ts'
  - '**/*.tsx'
utils:
  child-process-module:
    kind: string
    regex: ^["'](?:node:)?child_process["']$
  bun-module:
    kind: string
    regex: ^["']bun["']$
  value-import-of-child-process:
    kind: import_statement
    not:
      regex: ^import\s+type\b
    has:
      field: source
      matches: child-process-module
  value-import-of-bun:
    kind: import_statement
    not:
      regex: ^import\s+type\b
    has:
      field: source
      matches: bun-module
  child-process-start-name:
    regex: ^(?:spawn|spawnSync|execFile|execFileSync|exec|execSync|fork)$
  bun-start-name:
    regex: ^spawn(?:Sync)?$
  bun-shell-name:
    regex: ^\$$
  child-process-start-imported:
    kind: import_specifier
    all:
      - any:
          - has:
              field: alias
              pattern: $START
          - all:
              - not:
                  has:
                    field: alias
                    kind: identifier
              - has:
                  field: name
                  pattern: $START
      - has:
          field: name
          matches: child-process-start-name
      - not:
          regex: ^type\s
      - inside:
          stopBy: end
          matches: value-import-of-child-process
  bun-start-imported:
    kind: import_specifier
    all:
      - any:
          - has:
              field: alias
              pattern: $START
          - all:
              - not:
                  has:
                    field: alias
                    kind: identifier
              - has:
                  field: name
                  pattern: $START
      - has:
          field: name
          matches: bun-start-name
      - not:
          regex: ^type\s
      - inside:
          stopBy: end
          matches: value-import-of-bun
  bun-shell-imported:
    kind: import_specifier
    all:
      - any:
          - has:
              field: alias
              pattern: $TAG
          - all:
              - not:
                  has:
                    field: alias
                    kind: identifier
              - has:
                  field: name
                  pattern: $TAG
      - has:
          field: name
          matches: bun-shell-name
      - not:
          regex: ^type\s
      - inside:
          stopBy: end
          matches: value-import-of-bun
  process-starter:
    any:
      - kind: member_expression
        regex: ^Bun\s*\.\s*spawn(?:Sync)?$
      - all:
          - kind: identifier
          - pattern: $START
          # Why: an import stands directly in the program, so the search walks only the imports
          # of the two modules, and in them first the specifier that binds the callee's name.
          - inside:
              stopBy: end
              kind: program
              has:
                kind: import_statement
                all:
                  - has:
                      field: source
                      any:
                        - matches: child-process-module
                        - matches: bun-module
                  - has:
                      stopBy: end
                      kind: import_specifier
                      any:
                        - matches: child-process-start-imported
                        - matches: bun-start-imported
      - all:
          - kind: member_expression
          - has:
              field: property
              matches: child-process-start-name
          - has:
              field: object
              kind: identifier
              pattern: $NAMESPACE
          - inside:
              stopBy: end
              kind: program
              has:
                matches: value-import-of-child-process
                any:
                  - pattern: import * as $NAMESPACE from $SOURCE
                  - pattern: import $NAMESPACE from $SOURCE
  environment:
    kind: member_expression
    regex: ^(?:(?:process|Bun)\s*\.\s*env|import\s*\.\s*meta\s*\.\s*env)$
  whole-environment:
    any:
      - matches: environment
      - kind: object
        has:
          kind: spread_element
          has:
            matches: environment
      - kind: call_expression
        all:
          - has:
              field: function
              regex: ^Object\s*\.\s*assign$
          - has:
              field: arguments
              kind: arguments
              has:
                matches: environment
      - kind: call_expression
        all:
          - has:
              field: function
              regex: ^structuredClone$
          - has:
              field: arguments
              kind: arguments
              has:
                matches: environment
      - kind: call_expression
        all:
          - has:
              field: function
              regex: ^Object\s*\.\s*fromEntries$
          - has:
              field: arguments
              kind: arguments
              has:
                kind: call_expression
                all:
                  - has:
                      field: function
                      regex: ^Object\s*\.\s*entries$
                  - has:
                      field: arguments
                      kind: arguments
                      has:
                        matches: environment
  env-key:
    regex: ^["'`]?env["'`]?$
  shell-tag:
    any:
      - kind: member_expression
        regex: ^Bun\s*\.\s*\$$
      - all:
          - kind: identifier
          - pattern: $TAG
          - inside:
              stopBy: end
              kind: program
              has:
                kind: import_statement
                all:
                  - has:
                      field: source
                      matches: bun-module
                  - has:
                      stopBy: end
                      kind: import_specifier
                      matches: bun-shell-imported
  shell-command:
    kind: call_expression
    all:
      - has:
          field: arguments
          kind: template_string
      - has:
          field: function
          matches: shell-tag
  env-call:
    kind: call_expression
    has:
      field: function
      kind: member_expression
      has:
        field: property
        regex: ^env$
  shell-given-its-env:
    kind: call_expression
    all:
      - has:
          field: function
          kind: member_expression
          all:
            - has:
                field: property
                regex: ^env$
            - has:
                field: object
                matches: shell-tag
      - has:
          field: arguments
          kind: arguments
          all:
            - has:
                nthChild: 1
                not:
                  matches: whole-environment
            - not:
                has:
                  nthChild: 2
  whole-environment-given-to-a-start:
    kind: pair
    all:
      - has:
          field: key
          matches: env-key
      - has:
          field: value
          matches: whole-environment
      - inside:
          stopBy: end
          kind: call_expression
          has:
            field: function
            matches: process-starter
  # Why: a command of Bun's shell runs with Bun.env unless .env() gives it or the shell one.
  shell-command-left-to-inherit:
    kind: call_expression
    all:
      - matches: shell-command
      - not:
          inside:
            stopBy: end
            matches: env-call
      - not:
          inside:
            stopBy: end
            kind: program
            has:
              stopBy: end
              matches: shell-given-its-env
  whole-environment-given-to-the-shell:
    kind: call_expression
    all:
      - matches: env-call
      - has:
          field: function
          has:
            field: object
            any:
              - matches: shell-tag
              - matches: shell-command
              - has:
                  stopBy: end
                  matches: shell-command
      - has:
          field: arguments
          kind: arguments
          all:
            - has:
                nthChild: 1
                matches: whole-environment
            - not:
                has:
                  nthChild: 2
  # Why: an argument read from a name may hold options a pattern cannot see, so its start is left
  # to review.
  start-left-to-inherit:
    kind: call_expression
    all:
      # Why: the arguments' kinds are read before the callee's imports, and the objects' keys
      # after, so the search reaches the imports and the objects' depths only on a likely start.
      - has:
          field: arguments
          kind: arguments
          not:
            has:
              not:
                any:
                  - regex: ^[(),]$
                  - kind: comment
                  - kind: string
                  - kind: template_string
                  - kind: array
                  - kind: arrow_function
                  - kind: function_expression
                  - kind: object
      - has:
          field: function
          matches: process-starter
      - has:
          field: arguments
          kind: arguments
          not:
            has:
              kind: object
              has:
                stopBy: end
                any:
                  - kind: pair
                    has:
                      field: key
                      matches: env-key
                  - kind: shorthand_property_identifier
                    regex: ^env$
                  - kind: spread_element
rule:
  any:
    - kind: pair
      matches: whole-environment-given-to-a-start
    - kind: call_expression
      any:
        - matches: shell-command-left-to-inherit
        - matches: whole-environment-given-to-the-shell
        - matches: start-left-to-inherit
