# yaml-language-server:$schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: class-never-opens-with-a-max-variant@typescript
language: Tsx
severity: error
message: >-
  Widen from the small screen with md:, lg: and xl:: a max-* breakpoint alone undoes the base; bound
  a range after a minimum, as md:max-lg:
utils:
  class-call:
    kind: call_expression
    has:
      field: function
      kind: identifier
      regex: ^(?:cva|cn|clsx|twMerge)$
  class-attribute-value:
    any:
      - kind: string
      - kind: jsx_expression
    inside:
      kind: jsx_attribute
      has:
        kind: property_identifier
        regex: ^className$
  class-list:
    any:
      - matches: class-attribute-value
      - matches: class-call
        not:
          inside:
            stopBy: end
            any:
              - matches: class-call
              - matches: class-attribute-value
rule:
  matches: class-list
  regex: '(?:^|[\s"''`])max-[^\s:]*:'
