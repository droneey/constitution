# yaml-language-server:$schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: web-font-shows-its-text-while-it-loads@css
language: Css
severity: error
message: >-
  Give a web font a font-display of swap, fallback or optional, so its text shows while it loads
files:
  - '**/*.css'
rule:
  kind: at_rule
  has:
    kind: at_keyword
    regex: '(?i)^@font-face$'
  not:
    has:
      stopBy: end
      kind: declaration
      regex: '(?i)^font-display\s*:\s*(?:swap|fallback|optional)\b'
