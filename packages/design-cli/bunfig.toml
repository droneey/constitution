[test]
root = "."
preload = ["./src/__tests__/sandbox.fixtures.ts"]
randomize = true
coverage = true
coverageReporter = ["text"]
coverageSkipTestFiles = true
coverageThreshold = { functions = 1.0, lines = 1.0 }
coveragePathIgnorePatterns = [
  "**/__tests__/**",
  "**/main.*",
  "**/*.gen.*",
]

[run]
bun = true
