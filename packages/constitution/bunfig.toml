[test]
root = "."
pathIgnorePatterns = ["tests/**"]
preload = ["./src/__tests__/sandbox.fixtures.ts"]
randomize = true
coverage = true
coverageReporter = ["text"]
coverageSkipTestFiles = true
coverageThreshold = { functions = 1.0, lines = 1.0 }
coveragePathIgnorePatterns = [
  "**/__tests__/**",
  "tests/**",
  "**/main.*",
  "**/root/wiring.*",
  # Another unit of the workspace, which its own specs cover.
  "../design-cli/**",
  "../design-tokens/**",
]

[run]
bun = true
