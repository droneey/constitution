name: '@droneey/constitution'
axes:
  - architecture
  - workflow
domains:
  - version-control
  - workspace
  - presentation
platforms:
  - client/cli
languages:
  - typescript
  - json
  - toml
  - yaml
  - shell
  - markdown
implementations:
  - js-runtime/bun
  - task-runner
  - tsc
  - ast-grep
  - biome
  - dependency-cruiser
  - git
  - knip
  - jscpd
  - shellcheck
  - shfmt
  - editorconfig
  - rumdl
  - yamllint
  - tombi
  - bun-test
  - stryker
  - schema/zod
  - yaml-js
  - commander
  - react/ink
packs:
  - pack
overrides:
  - rule: scoped-resource-held-by-using
    level: SHOULD
    # Why: constitution reads an override's reason from its one line.
    # yamllint disable-line rule:line-length
    reason: "dependency-cruiser 18's swc visitor fails on UsingDeclaration, so code that must pass check:architecture releases scoped resources with try/finally; removed with #186 (parser tsc on TypeScript 7.1)"
  - rule: use-case-hands-its-deadline-to-every-port-call
    level: SHOULD
    # Why: constitution reads an override's reason from its one line.
    # yamllint disable-line rule:line-length
    reason: "No member of the session feature's WorkingTree port takes a deadline yet, and each git run is bounded by the adapter's own timeout; removed with #428, which hands the stop's remaining time to every WorkingTree call"
