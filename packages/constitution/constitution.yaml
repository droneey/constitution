name: '@droneey/constitution'
axes:
  - architecture
  - workflow
domains:
  - version-control
  - workspace
  - ui
platforms:
  - cli
languages:
  - typescript
  - json
  - toml
  - yaml
  - shell
  - markdown
implementations:
  - bun
  - tsc
  - biome
  - dependency-cruiser
  - git
  - knip
  - shellcheck
  - shfmt
  - rumdl
  - yamllint
  - tombi
  - bun-test
  - stryker
  - zod
  - yaml-js
  - commander
  - ink
packs: []
overrides:
  - rule: scoped-resource-held-by-using
    level: SHOULD
    # the program reads an override's reason from its one line
    # yamllint disable-line rule:line-length
    reason: "dependency-cruiser 18's swc visitor fails on UsingDeclaration, so code that must pass architecture:check releases scoped resources with try/finally; removed with #186 (parser tsc on TypeScript 7.1)"
