[test]
root = "."

# bun-test
pathIgnorePatterns = ["tests/**"]
preload = []
randomize = true
coverage = true
coverageReporter = ["text"]
coverageSkipTestFiles = true
coverageThreshold = { functions = 1.0, lines = 1.0 }
coveragePathIgnorePatterns = [
  # bun-test
  "**/__tests__/**",
  "**/main.*",
  "**/root/wiring.*",
  "**/*.gen.*",

  # workspace
  "../**"
]

[run]
bun = true
