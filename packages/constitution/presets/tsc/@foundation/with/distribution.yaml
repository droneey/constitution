distribution:
  '*':
    typescript:
      tsconfig.json !jsonc:
        compilerOptions:
          allowJs: !replace false
          checkJs: !replace false
          declaration: true
typescript:
  package-export-typed-explicitly:
    typescript:
      tsconfig.json !jsonc:
        compilerOptions:
          isolatedDeclarations: true
  distributed-package-checked-under-its-runtimes-resolution:
    typescript:
      tsconfig.json !jsonc:
        compilerOptions:
          module: !replace nodenext
          moduleResolution: !replace nodenext
