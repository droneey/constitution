jscpd:
  clone-in-source-joined-or-suppressed:
    typescript:
      .jscpd.json:
        pattern: '{${role.source},${role.build-code}}/**'
        format:
          - typescript
          - tsx
        ignore:
          - '**/${role.colocated-specs}/**'
          - '**/${role.end-to-end-suite}/**'
          - '**/*.${role.generated-file}.*'
          - '**/*.${role.generated-file}/**'
        minLines: 5
        minTokens: 50
        exitCode: 1
    python:
      .jscpd.json:
        pattern: '{${role.source},${role.build-code}}/**'
        format:
          - python
        ignore:
          - '**/*_${role.generated-file}.py'
          - '**/*_${role.generated-file}/**'
        minLines: 5
        minTokens: 50
        exitCode: 1
