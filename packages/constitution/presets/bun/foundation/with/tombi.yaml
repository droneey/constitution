tombi:
  '*':
    toml:
      package.json:
        scripts:
          check:toml: tombi format --check && tombi lint
          fix:toml: tombi format
bun:
  '*':
    toml:
      package.json:
        scripts: !sorted {}
  script-group-run-by-its-prefix:
    toml:
      package.json:
        scripts:
          check: !words
            - bun run --sequential
            - slot: checks
            - slot: tests
            - slot: mutations
          check@checks:
            - "'check:*'"
          fix: bun run --sequential 'fix:*'
_task-runner:
  unit-run-through-its-action-tasks:
    toml:
      ${constitution.run}:
        check:
          - bun run check
        fix:
          - bun run fix
