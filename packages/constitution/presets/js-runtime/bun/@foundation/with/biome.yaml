biome:
  '*':
    typescript:
      package.json:
        scripts:
          check:lint: !commands
            - biome check --formatter-enabled=false --error-on-warnings
          check:format: !commands
            - biome format
          fix:lint: !commands
            - biome check --write
          fix:format: !commands
            - biome format --write
js-runtime/bun:
  '*':
    typescript:
      package.json:
        scripts: !sorted {}
  script-group-run-by-its-prefix:
    typescript:
      package.json:
        scripts:
          check: !words
            - bun run --sequential
            - slot: checks
            - slot: tests
            - slot: mutations
          check@checks:
            - "'check:*'"
          fix: bun run --sequential 'fix:*'
task-runner:
  unit-run-through-its-action-tasks:
    typescript:
      ${constitution.run}:
        check:
          - bun run check
        fix:
          - bun run fix
