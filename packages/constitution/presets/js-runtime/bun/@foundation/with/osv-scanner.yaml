osv-scanner:
  every-lockfile-scanned-for-vulnerabilities:
    '*':
      package.json ? ${file.isTop}:
        scripts:
          # Why: --no-ignore: a checkout nested in a folder another repository ignores, an agent's
          # worktree, is otherwise read as ignored, and no lockfile is found.
          check:audit: !words
            - osv-scanner scan source
            - slot: flags
            - --no-ignore .
  lockfile-licences-checked-against-the-allowlist:
    '*':
      package.json ? ${file.isTop}:
        scripts:
          check:audit@flags:
            - '--licenses="0BSD,Apache-2.0,BlueOak-1.0.0,BSD-2-Clause,BSD-3-Clause,CC-BY-4.0,CC0-1.0,ISC,MIT,MIT-0,MPL-2.0,OFL-1.1,PSF-2.0,Python-2.0,Unlicense,Zlib"'
  osv-scan-run-with-all-vulns:
    '*':
      package.json ? ${file.isTop}:
        scripts:
          check:audit@flags:
            - --all-vulns
    dockerfile:
      package.json:
        scripts:
          check:audit-image@flags:
            - --all-vulns
task-runner:
  unit-run-through-its-action-tasks:
    '*':
      ${constitution.run} ? ${file.isTop}:
        check:
          - bun run check
js-runtime/bun:
  '*':
    '*':
      package.json ? ${file.isTop}:
        scripts: !sorted {}
  script-group-run-by-its-prefix:
    '*':
      package.json ? ${file.isTop}:
        scripts:
          check: !words
            - bun run --sequential
            - slot: checks
            - slot: tests
            - slot: mutations
          check@checks:
            - "'check:*'"
