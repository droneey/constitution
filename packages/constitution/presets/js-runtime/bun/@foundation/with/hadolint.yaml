hadolint:
  '*':
    dockerfile:
      package.json:
        scripts:
          check:lint: !commands
            - slot: dockerfile
          check:lint@dockerfile:
            - hadolint Dockerfile
js-runtime/bun:
  '*':
    dockerfile:
      package.json:
        scripts: !sorted {}
  script-group-run-by-its-prefix:
    dockerfile:
      package.json:
        scripts:
          check: !words
            - bun run --sequential
            - slot: checks
            - slot: tests
            - slot: mutations
          check@checks:
            - "'check:*'"
task-runner:
  unit-run-through-its-action-tasks:
    dockerfile:
      ${constitution.run}:
        check:
          - bun run check
