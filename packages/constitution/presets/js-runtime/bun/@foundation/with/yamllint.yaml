yamllint:
  '*':
    yaml:
      package.json:
        scripts:
          # Why: the unit's script reads only the files git keeps, and skips its members, each
          # checked in its own run.
          check:lint: !commands
            - !words
              - ${constitution.path}/presets/plugins/shell/run-on-files.sh
              - "'*.yaml'"
              - "'*.yml'"
              - --
              - yamllint
              - --strict
              - --
              - "'${workspace.members}'"
js-runtime/bun:
  '*':
    yaml:
      package.json:
        scripts: !sorted {}
  script-group-run-by-its-prefix:
    yaml:
      package.json:
        scripts:
          check: !words
            - bun run --sequential
            - slot: checks
            - slot: tests
            - slot: mutations
          check@checks:
            - "'check:*'"
task-runner:
  unit-run-through-its-action-tasks:
    yaml:
      ${constitution.run}:
        check:
          - bun run check
