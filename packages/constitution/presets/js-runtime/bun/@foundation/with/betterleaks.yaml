betterleaks:
  '*':
    '*':
      package.json ? ${file.isTop}:
        scripts:
          # Why: a commit of more files than git's rename limit makes the history's scan
          # warn; a secrets scan needs no rename detection, and without it a moved file's
          # lines are read again whole.
          check:secrets: >-
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=diff.renames GIT_CONFIG_VALUE_0=false
            betterleaks git . --redact --no-banner
            && betterleaks git . --pre-commit --redact --no-banner
            && betterleaks git . --pre-commit --staged --redact --no-banner
js-runtime/bun:
  '*':
    '*':
      package.json ? ${file.isTop}:
        scripts: !sorted {}
  script-group-run-by-its-prefix:
    '*':
      package.json ? ${file.isTop}:
        scripts:
          check: !words
            - bun run --sequential
            - slot: checks
            - slot: tests
            - slot: mutations
          check@checks:
            - "'check:*'"
task-runner:
  unit-run-through-its-action-tasks:
    '*':
      ${constitution.run} ? ${file.isTop}:
        check:
          - bun run check
