tombi:
  '*':
    toml:
      package.json:
        scripts:
          check:lint: !commands
            - tombi lint
          check:format: !commands
            - tombi format --check
          fix:format: !commands
            - tombi format
js-runtime/bun:
  '*':
    toml:
      package.json:
        scripts: !sorted {}
  script-group-run-by-its-prefix:
    toml:
      package.json:
        scripts:
          check: !words
            - bun run --sequential
            - slot: checks
            - slot: tests
            - slot: mutations
          check@checks:
            - "'check:*'"
          fix: bun run --sequential 'fix:*'
task-runner:
  unit-run-through-its-action-tasks:
    toml:
      ${constitution.run}:
        check:
          - bun run check
        fix:
          - bun run fix
