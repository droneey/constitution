rumdl:
  '*':
    markdown:
      package.json:
        scripts:
          check:lint: !commands
            - rumdl check .
          check:format: !commands
            - rumdl fmt --check .
          fix:lint: !commands
            - rumdl check --fix .
          fix:format: !commands
            - rumdl fmt .
js-runtime/bun:
  '*':
    markdown:
      package.json:
        scripts: !sorted {}
  script-group-run-by-its-prefix:
    markdown:
      package.json:
        scripts:
          check: !words
            - bun run --sequential
            - slot: checks
            - slot: tests
            - slot: mutations
          check@checks:
            - "'check:*'"
          fix: bun run --sequential 'fix:*'
task-runner:
  unit-run-through-its-action-tasks:
    markdown:
      ${constitution.run}:
        check:
          - bun run check
        fix:
          - bun run fix
