yamllint:
  '*':
    yaml:
      .yamllint.yaml:
        extends: default
        rules:
          comments:
            min-spaces-from-content: 1
          document-start: disable
          document-end: disable
          empty-lines:
            max: 1
          octal-values:
            forbid-explicit-octal: true
core:
  rule-held-by-a-tool-where-one-can:
    yaml:
      .yamllint.yaml:
        rules:
          comments:
            level: error
          comments-indentation:
            level: error
  formatters-share-one-indent:
    yaml:
      .yamllint.yaml:
        rules:
          indentation:
            spaces: 2
            indent-sequences: true
  formatters-share-one-width:
    yaml:
      .yamllint.yaml:
        rules:
          line-length:
            max: 100
            allow-non-breakable-inline-mappings: true
  mapping-key-unique:
    yaml:
      .yamllint.yaml:
        rules:
          key-duplicates: enable
  dead-code-deleted:
    yaml:
      .yamllint.yaml:
        rules:
          anchors:
            forbid-unused-anchors: true
yaml:
  collection-never-written-in-flow-style:
    yaml:
      .yamllint.yaml:
        rules:
          braces:
            forbid: non-empty
          brackets:
            forbid: non-empty
  ambiguous-scalar-quoted:
    yaml:
      .yamllint.yaml:
        rules:
          truthy:
            level: error
            allowed-values:
              - 'true'
              - 'false'
            check-keys: false
          octal-values:
            forbid-implicit-octal: true
  boolean-written-true-or-false:
    yaml:
      .yamllint.yaml:
        rules:
          truthy:
            level: error
            allowed-values:
              - 'true'
              - 'false'
            check-keys: false
