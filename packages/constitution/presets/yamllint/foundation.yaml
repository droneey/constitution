yamllint:
  '*':
    yaml:
      .yamllint.yaml:
        extends: default
        rules:
          comments:
            level: error
            min-spaces-from-content: 1
          comments-indentation:
            level: error
          document-start: disable
          document-end: disable
          empty-lines:
            max: 1
          octal-values:
            forbid-explicit-octal: true
core:
  formatters-share-one-indent-and-width:
    yaml:
      .yamllint.yaml:
        rules:
          line-length:
            max: 100
            allow-non-breakable-inline-mappings: true
          indentation:
            spaces: 2
            indent-sequences: true
  mapping-key-unique:
    yaml:
      .yamllint.yaml:
        rules:
          key-duplicates: enable
yaml:
  collection-written-in-block-style:
    yaml:
      .yamllint.yaml:
        rules:
          braces:
            forbid: non-empty
          brackets:
            forbid: non-empty
  ambiguous-scalar-quoted:
    yaml:
      .yamllint.yaml:
        rules:
          truthy:
            level: error
            allowed-values:
              - 'true'
              - 'false'
            check-keys: false
          octal-values:
            forbid-implicit-octal: true
  boolean-written-true-or-false:
    yaml:
      .yamllint.yaml:
        rules:
          truthy:
            level: error
            allowed-values:
              - 'true'
              - 'false'
            check-keys: false
  anchor-aliased-at-least-once:
    yaml:
      .yamllint.yaml:
        rules:
          anchors:
            forbid-unused-anchors: true
