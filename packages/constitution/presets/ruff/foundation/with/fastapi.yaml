fastapi:
  dependencies-declared-in-annotated:
    python:
      pyproject.toml:
        tool:
          ruff:
            lint:
              extend-select:
                - FAST
  path-parameters-read-by-the-handler:
    python:
      pyproject.toml:
        tool:
          ruff:
            lint:
              extend-select:
                - FAST
  program-raises-no-http-exception:
    python:
      pyproject.toml:
        tool:
          ruff:
            lint:
              flake8-tidy-imports:
                extend-banned-api:
                  fastapi.HTTPException:
                    msg: >-
                      the program raises the error kit's errors, which the handlers answer
                  starlette.exceptions.HTTPException:
                    msg: >-
                      the program raises the error kit's errors, which the handlers answer
  '*':
    python:
      pyproject.toml:
        tool:
          ruff:
            lint:
              flake8-tidy-imports:
                extend-banned-api:
                  pytest.importorskip:
                    msg: a spec runs whole, or is deleted
                  pytest.mark.flaky:
                    msg: a flaky case is fixed or deleted, never run again
                  pytest.mark.skip:
                    msg: a spec runs whole, or is deleted
                  pytest.mark.skipif:
                    msg: a spec runs whole, or is deleted
                  pytest.mark.xfail:
                    msg: a spec runs whole, or is deleted
                  pytest.skip:
                    msg: a spec runs whole, or is deleted
                  pytest.xfail:
                    msg: a spec runs whole, or is deleted
                  pytest_asyncio:
                    msg: async specs run on anyio's plugin
                  unittest.mock:
                    msg: an effect is replaced by the fake of its contract
