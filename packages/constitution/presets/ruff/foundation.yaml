ruff:
  '*':
    python:
      pyproject.toml:
        tool:
          ruff:
            format:
              docstring-code-format: true
            lint:
              ignore:
                - PLR09
              select:
                - A
                - ASYNC
                - B
                - C4
                - E
                - EXE
                # Why: pyflakes but its unused imports and locals, which dead-code-deleted selects.
                - F402
                - F403
                - F404
                - F405
                - F406
                - F407
                - F5
                - F6
                - F7
                - F81
                - F82
                - F9
                - FURB
                - G
                - I
                - ICN
                - ISC
                - LOG
                - 'N'
                - PERF
                - PIE
                - PL
                - PYI
                - RET
                - RSE
                - SIM
                - SLOT
                - UP
                - W
              extend-per-file-ignores:
                ${role.package-suites}/**:
                  - INP001
                  - PLR2004
                  - S101
  ruff-format-is-the-formatter:
    python:
      pyproject.toml:
        tool:
          ruff:
            format:
              quote-style: single
  noqa-names-its-codes:
    python:
      pyproject.toml:
        tool:
          ruff:
            lint:
              select:
                - PGH
                - RUF
