      # yamllint disable-line rule:line-length
      ast-grep.${role.generated-file}/ast-grep-reason-on-the-line-above.python.yaml !text: !copy ${constitution.path}/presets/ast-grep/plugins/python/ast-grep-reason-on-the-line-above.yaml
