ast-grep:
  '*':
    '*':
      sgconfig.yaml: !sorted
        ruleDirs: []
      # Why: a generated file changes only by being generated again, so no finding in it can be
      # fixed by hand; ast-grep leaves out what the ignore file of the tree it scans names.
      .ignore:
        - '*.${role.generated-file}.*'
        - '*.${role.generated-file}/'
    typescript:
      sgconfig.yaml:
        # Why: one grammar reads every TypeScript file, so each rule is written once for the files
        # with markup and those without.
        languageGlobs:
          tsx:
            - '*.ts'
            - '*.mts'
            - '*.cts'
  ast-grep-reason-on-the-line-above:
    typescript:
      sgconfig.yaml:
        ruleDirs:
          - ast-grep.${role.generated-file}
      # Why: a key and a path, which YAML cannot break.
      # yamllint disable-line rule:line-length
      ast-grep.${role.generated-file}/ast-grep-reason-on-the-line-above.yaml !text: !copy ${constitution.path}/presets/ast-grep/plugins/typescript/ast-grep-reason-on-the-line-above.yaml
    css:
      sgconfig.yaml:
        ruleDirs:
          - ast-grep.${role.generated-file}
      # Why: a key and a path, which YAML cannot break.
      # yamllint disable-line rule:line-length
      ast-grep.${role.generated-file}/ast-grep-reason-on-the-line-above.css.yaml !text: !copy ${constitution.path}/presets/ast-grep/plugins/css/ast-grep-reason-on-the-line-above.yaml
    python:
