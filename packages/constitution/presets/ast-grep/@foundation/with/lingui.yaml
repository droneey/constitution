localization:
  module-level-text-holds-the-message:
    typescript:
      sgconfig.yaml:
        ruleDirs:
          - ast-grep.${role.generated-file}
      # Why: a key and a path, which YAML cannot break.
      # yamllint disable-line rule:line-length
      ast-grep.${role.generated-file}/module-level-text-holds-the-message.yaml !text: !copy ${constitution.path}/presets/ast-grep/plugins/typescript/module-level-text-holds-the-message.yaml
