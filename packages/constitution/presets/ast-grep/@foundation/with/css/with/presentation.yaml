css:
  type-sized-in-rem:
    css:
      sgconfig.yaml:
        ruleDirs:
          - ast-grep.${role.generated-file}
      # Why: a key and a path, which YAML cannot break.
      # yamllint disable-line rule:line-length
      ast-grep.${role.generated-file}/type-sized-in-rem.yaml !text: !copy ${constitution.path}/presets/ast-grep/plugins/css/type-sized-in-rem.yaml
