yaml:
  value-holding-a-backslash-never-double-quoted:
    yaml:
      sgconfig.yaml:
        ruleDirs:
          - ast-grep.${role.generated-file}
      # Why: a key and a path, which YAML cannot break.
      # yamllint disable-line rule:line-length
      ast-grep.${role.generated-file}/value-holding-a-backslash-never-double-quoted.yaml !text: !copy ${constitution.path}/presets/ast-grep/plugins/yaml/value-holding-a-backslash-never-double-quoted.yaml
