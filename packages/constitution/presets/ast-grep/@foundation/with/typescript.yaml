      # Why: the rule's scope leaves out the folders the architecture's blocks leave out, which a
      # copied rule cannot take.
      ast-grep.${role.generated-file}/closed-name-set-is-a-string-enum.yaml:
        id: closed-name-set-is-a-string-enum@typescript
        language: Tsx
        severity: error
        message: >-
          A closed set of named values is a string enum, not a union of string literals or a type
          taken from an as-const array
        files:
          - '**/*.ts'
          - '**/*.tsx'
        ignores:
          - slot: left-out
        rule:
          matches: closed-name-set-is-a-string-enum@typescript
