      # Why: the rule's scope leaves out markup files, where React's API spells absence as null, and
      # the folders the architecture's blocks leave out, which a copied rule cannot take.
      ast-grep.${role.generated-file}/undefined-is-the-only-absence.yaml:
        id: undefined-is-the-only-absence@typescript
        language: Tsx
        severity: error
        message: >-
          null outside the boundary: internal code spells absence as undefined; an adapter maps null
          to it
        files:
          - '**/*.ts'
        ignores:
          - slot: left-out
        rule:
          matches: undefined-is-the-only-absence@typescript
