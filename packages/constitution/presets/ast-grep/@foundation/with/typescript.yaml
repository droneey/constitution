typescript:
  module-level-variable-declared-const:
    typescript:
      sgconfig.yaml:
        ruleDirs:
          - ast-grep.${role.generated-file}
      # Why: a key and a path, which YAML cannot break.
      # yamllint disable-line rule:line-length
      ast-grep.${role.generated-file}/module-level-variable-declared-const.yaml !text: !copy ${constitution.path}/presets/ast-grep/plugins/typescript/module-level-variable-declared-const.yaml
  closed-name-set-is-a-string-enum:
    typescript:
      sgconfig.yaml:
        ruleDirs:
          - ast-grep.${role.generated-file}
        utilDirs:
          - ast-grep-utils.${role.generated-file}
      # Why: a key and a path, which YAML cannot break.
      # yamllint disable-line rule:line-length
      ast-grep-utils.${role.generated-file}/closed-name-set-is-a-string-enum.yaml !text: !copy ${constitution.path}/presets/ast-grep/plugins/typescript/closed-name-set-is-a-string-enum.yaml
      # Why: the rule's scope leaves out the folders the architecture's blocks leave out, which a
      # copied rule cannot take.
      ast-grep.${role.generated-file}/closed-name-set-is-a-string-enum.yaml:
        id: closed-name-set-is-a-string-enum@typescript
        language: Tsx
        severity: error
        message: >-
          A closed set of named values is a string enum, not a union of string literals or a type
          taken from an as-const array
        files:
          - '**/*.ts'
          - '**/*.tsx'
        ignores:
          - slot: left-out
        rule:
          matches: closed-name-set-is-a-string-enum@typescript
  entity-value-or-event-typed-readonly:
    typescript:
      sgconfig.yaml:
        ruleDirs:
          - ast-grep.${role.generated-file}
        utilDirs:
          - ast-grep-utils.${role.generated-file}
      # Why: a key and a path, which YAML cannot break.
      # yamllint disable-line rule:line-length
      ast-grep-utils.${role.generated-file}/entity-value-or-event-typed-readonly.yaml !text: !copy ${constitution.path}/presets/ast-grep/plugins/typescript/entity-value-or-event-typed-readonly.yaml
      # Why: the folders of business types are the architecture's to name, which a copied rule
      # cannot take.
      ast-grep.${role.generated-file}/entity-value-or-event-typed-readonly.yaml:
        id: entity-value-or-event-typed-readonly@typescript
        language: Tsx
        severity: error
        message: >-
          A field of a business type that is not readonly: the value is shared, and a change made in
          place goes unseen
        files:
          - slot: business-types
        ignores:
          - '**/${role.colocated-specs}/**'
        rule:
          matches: entity-value-or-event-typed-readonly@typescript
  undefined-is-the-only-absence:
    typescript:
      sgconfig.yaml:
        ruleDirs:
          - ast-grep.${role.generated-file}
        utilDirs:
          - ast-grep-utils.${role.generated-file}
