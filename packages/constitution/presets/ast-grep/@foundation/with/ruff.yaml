ruff:
  ruff-suppression-written-on-its-line:
    python:
      sgconfig.yaml:
        ruleDirs:
          - ast-grep.${role.generated-file}
      # Why: a key and a path, which YAML cannot break.
      # yamllint disable-line rule:line-length
      ast-grep.${role.generated-file}/ruff-suppression-written-on-its-line.yaml !text: !copy ${constitution.path}/presets/ast-grep/plugins/python/ruff-suppression-written-on-its-line.yaml
