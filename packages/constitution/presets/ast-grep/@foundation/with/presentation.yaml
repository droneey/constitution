presentation:
  field-never-blocks-paste-or-autofill:
    html:
      sgconfig.yaml:
        ruleDirs:
          - ast-grep.${role.generated-file}
      # Why: a key and a path, which YAML cannot break.
      # yamllint disable-line rule:line-length
      ast-grep.${role.generated-file}/field-never-blocks-paste-or-autofill.html.yaml !text: !copy ${constitution.path}/presets/ast-grep/plugins/html/field-never-blocks-paste-or-autofill.yaml
    typescript:
      sgconfig.yaml:
        ruleDirs:
          - ast-grep.${role.generated-file}
      # Why: a key and a path, which YAML cannot break.
      # yamllint disable-line rule:line-length
      ast-grep.${role.generated-file}/field-never-blocks-paste-or-autofill.yaml !text: !copy ${constitution.path}/presets/ast-grep/plugins/typescript/field-never-blocks-paste-or-autofill.yaml
