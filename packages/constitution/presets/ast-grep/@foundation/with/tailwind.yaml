  primitive-class-merged-by-cn:
    typescript:
      sgconfig.yaml:
        ruleDirs:
          - ast-grep.${role.generated-file}
        utilDirs:
          - ast-grep-utils.${role.generated-file}
      # Why: a key and a path, which YAML cannot break.
      # yamllint disable-line rule:line-length
      ast-grep-utils.${role.generated-file}/primitive-class-merged-by-cn.yaml !text: !copy ${constitution.path}/presets/ast-grep/plugins/typescript/primitive-class-merged-by-cn.yaml
      # Why: the folder of the component primitives is the architecture's to name, which a copied
      # rule cannot take.
      ast-grep.${role.generated-file}/primitive-class-merged-by-cn.yaml:
        id: primitive-class-merged-by-cn@typescript
        language: Tsx
        severity: error
        message: >-
          Merge the caller's className through cn(), as its last argument: classes joined without
          the merge fight by their order in the stylesheet
        files:
          - slot: primitive-files
        rule:
          matches: primitive-class-merged-by-cn@typescript
