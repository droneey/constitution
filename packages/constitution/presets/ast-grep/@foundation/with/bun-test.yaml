bun-test:
  bun-spec-mocks-no-module:
    typescript:
      sgconfig.yaml:
        ruleDirs:
          - ast-grep.${role.generated-file}
      # Why: a key and a path, which YAML cannot break.
      # yamllint disable-line rule:line-length
      ast-grep.${role.generated-file}/bun-spec-mocks-no-module.yaml !text: !copy ${constitution.path}/presets/ast-grep/plugins/typescript/bun-spec-mocks-no-module.yaml
