stryker:
  equivalent-mutant-marked-on-its-line:
    typescript:
      sgconfig.yaml:
        ruleDirs:
          - ast-grep.${role.generated-file}
      # Why: a key and a path, which YAML cannot break.
      # yamllint disable-line rule:line-length
      ast-grep.${role.generated-file}/equivalent-mutant-marked-on-its-line.yaml !text: !copy ${constitution.path}/presets/ast-grep/plugins/typescript/equivalent-mutant-marked-on-its-line.yaml
