dclint:
  dclint-disable-line-comment:
    yaml:
      sgconfig.yaml:
        ruleDirs:
          - ast-grep.${role.generated-file}
      # Why: a key and a path, which YAML cannot break.
      # yamllint disable-line rule:line-length
      ast-grep.${role.generated-file}/dclint-disable-line-comment.yaml !text: !copy ${constitution.path}/presets/ast-grep/plugins/yaml/dclint-disable-line-comment.yaml
