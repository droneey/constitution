commander:
  commander-exits-overridden:
    typescript:
      sgconfig.yaml:
        ruleDirs:
          - ast-grep.${role.generated-file}
      # Why: a key and a path, which YAML cannot break.
      # yamllint disable-line rule:line-length
      ast-grep.${role.generated-file}/commander-exits-overridden.yaml !text: !copy ${constitution.path}/presets/ast-grep/plugins/typescript/commander-exits-overridden.yaml
