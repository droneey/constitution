# yaml-language-server:$schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: third-party-script-rendered-by-its-component@typescript
language: Tsx
severity: error
message: >-
  Render the third-party script in the component that uses it, as <script async src>: React then
  dedupes it and loads it with that component
files:
  - '**/*.tsx'
rule:
  any:
    - kind: call_expression
      has:
        field: function
        regex: '^document\.createElement$'
      all:
        - has:
            field: arguments
            has:
              nthChild: 1
              regex: '(?i)^[''"`]script[''"`]$'
    - any:
        - kind: jsx_opening_element
        - kind: jsx_self_closing_element
      has:
        field: name
        regex: '^script$'
      all:
        - has:
            kind: jsx_attribute
            regex: '^src\s*=\s*\{?\s*[''"`](?:https?:)?//'
        - not:
            has:
              kind: jsx_attribute
              has:
                kind: property_identifier
                regex: '^async$'
