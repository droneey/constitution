# yaml-language-server:$schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: entity-never-lifts-to-the-kernel@typescript
language: Tsx
severity: error
message: >-
  An entity in the kernel: keep it in the feature that owns its life, and give the others a narrow
  view of it or its identifier
files:
  - '**/${role.shared-kernel}/**/*.${role.entity-file}.ts'
  - '**/${role.shared-kernel}/**/*.${role.aggregate-file}.ts'
  - '**/${role.shared-kernel}/**/${role.entity}/**/*.ts'
  - '**/${role.shared-kernel}/**/*.${role.entity-file}.tsx'
  - '**/${role.shared-kernel}/**/*.${role.aggregate-file}.tsx'
  - '**/${role.shared-kernel}/**/${role.entity}/**/*.tsx'
rule:
  kind: program
