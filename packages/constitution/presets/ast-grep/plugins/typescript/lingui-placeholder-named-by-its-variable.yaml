# yaml-language-server:$schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: lingui-placeholder-named-by-its-variable@typescript
language: Tsx
severity: error
message: >-
  Interpolate a value by a variable's name, or label it with ph(): Lingui turns any other
  expression into a positional placeholder that tells the translator nothing
files:
  - '**/*.ts'
  - '**/*.tsx'
utils:
  macro-template:
    kind: template_string
    inside:
      kind: call_expression
      field: arguments
      has:
        field: function
        regex: '^(?:t|msg|defineMessage)$'
  # Why: a nested choice macro names its placeholder by its own first argument.
  named-value:
    any:
      - kind: identifier
      - kind: call_expression
        has:
          field: function
          regex: '^ph$'
      - kind: call_expression
        has:
          field: function
          regex: '^(?:plural|select|selectOrdinal)$'
        all:
          - has:
              field: arguments
              has:
                nthChild: 1
                kind: identifier
  # Why: text, a comment or an empty expression in Trans's children is no value.
  trans-text:
    any:
      - kind: string
      - kind: template_string
        not:
          has:
            kind: template_substitution
      - kind: comment
  trans-element:
    kind: jsx_element
    has:
      field: open_tag
      has:
        field: name
        regex: '^Trans$'
  choice-element:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    has:
      field: name
      regex: '^(?:Plural|Select|SelectOrdinal)$'
rule:
  any:
    - kind: template_substitution
      inside:
        matches: macro-template
      not:
        has:
          matches: named-value
    # Why: an element inside Trans keeps its children's values in the same message.
    - kind: jsx_expression
      inside:
        kind: jsx_element
        any:
          - matches: trans-element
          - inside:
              stopBy: end
              matches: trans-element
      has:
        nthChild: 1
      not:
        has:
          any:
            - matches: named-value
            - matches: trans-text
    - kind: call_expression
      has:
        field: function
        regex: '^(?:plural|select|selectOrdinal)$'
      all:
        - has:
            field: arguments
            has:
              nthChild: 1
              not:
                kind: identifier
    - kind: jsx_attribute
      inside:
        matches: choice-element
      has:
        kind: property_identifier
        regex: '^value$'
      all:
        - has:
            kind: jsx_expression
            not:
              has:
                kind: identifier
