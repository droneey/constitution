# yaml-language-server:$schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: bun-module-with-an-effect-imported-only-by-the-edge@typescript
language: Tsx
severity: error
message: >-
  An effect reached through Bun outside the edge: reach it through a port its adapter implements
files:
  - '**/${role.source}/*/**'
ignores:
  - '**/${role.source}/${role.adapter}/**'
  - '**/${role.source}/${role.bounded-context}/*/${role.adapter}/**'
  - '**/${role.source}/${role.composition-module}/*/${role.adapter}/**'
  - '**/${role.source}/${role.generic-library}/**'
  - '**/${role.source}/${role.composition-root}/**'
  - '**/${role.source}/${role.extra-entry}/*/${role.entry}.ts'
  - '**/${role.source}/${role.host-integration}/**'
  - '**/${role.colocated-specs}/**'
  - '**/${role.source}/${role.extra-entry}/*/${role.entry}.tsx'
utils:
  # Why: each member reaches the file system, a process, the network, a store, the clock,
  # randomness, the environment or a stream; one that only computes, such as Bun.hash, is left out.
  effect-member:
    regex: ^(?:\$|argv|build|connect|dns|env|file|gc|listen|mmap|nanoseconds|openInEditor|randomUUIDv7|redis|RedisClient|resolve|resolveSync|s3|S3Client|serve|sleep|sleepSync|spawn|spawnSync|sql|SQL|stderr|stdin|stdout|udpSocket|which|write)$
  effect-module:
    kind: string
    regex: ^["']bun:(?:ffi|sqlite)["']$
  bun-module:
    kind: string
    regex: ^["']bun["']$
  type-only:
    any:
      - regex: ^import\s+type\b
      - regex: ^export\s+type\b
rule:
  any:
    - matches: effect-module
      any:
        - inside:
            kind: import_statement
            field: source
            not:
              matches: type-only
        - inside:
            kind: export_statement
            field: source
            not:
              matches: type-only
        - inside:
            kind: arguments
            inside:
              kind: call_expression
              has:
                field: function
                kind: import
    - kind: import_specifier
      not:
        regex: ^type\s
      has:
        field: name
        matches: effect-member
      inside:
        stopBy: end
        kind: import_statement
        not:
          matches: type-only
        has:
          field: source
          matches: bun-module
    - kind: member_expression
      all:
        - has:
            field: object
            kind: identifier
            regex: ^Bun$
        - has:
            field: property
            matches: effect-member
