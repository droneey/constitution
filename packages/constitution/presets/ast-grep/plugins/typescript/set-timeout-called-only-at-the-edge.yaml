# yaml-language-server:$schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: set-timeout-called-only-at-the-edge@typescript
language: Tsx
severity: error
message: >-
  A timer outside the edge and the binding units: the clock reaches this code through a port
files:
  - '**/${role.source}/*/**'
ignores:
  - '**/${role.source}/${role.adapter}/**'
  - '**/${role.source}/${role.bounded-context}/*/${role.adapter}/**'
  - '**/${role.source}/${role.composition-module}/*/${role.adapter}/**'
  - '**/${role.source}/${role.generic-library}/**'
  - '**/${role.source}/${role.composition-root}/**'
  - '**/${role.source}/${role.extra-entry}/*/${role.entry}.ts'
  - '**/${role.source}/${role.host-integration}/**'
  - '**/${role.source}/${role.bounded-context}/*/${role.presentation-layer}/${role.binding}/**'
  - '**/${role.source}/${role.composition-module}/*/${role.presentation-layer}/${role.binding}/**'
  - '**/${role.source}/${role.presentation-layer}/${role.binding}/**'
  - '**/${role.colocated-specs}/**'
  - '**/${role.source}/${role.extra-entry}/*/${role.entry}.tsx'
rule:
  kind: call_expression
  has:
    field: function
    any:
      - regex: ^(?:setTimeout|setInterval|setImmediate)$
        kind: identifier
      - kind: member_expression
        all:
          - has:
              field: object
              kind: identifier
              regex: ^(?:globalThis|window|self|global)$
          - has:
              field: property
              regex: ^(?:setTimeout|setInterval|setImmediate)$
