# yaml-language-server:$schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: components-take-t-from-use-lingui@typescript
language: Tsx
severity: error
message: >-
  Take t or i18n from useLingui in a component or a hook: the global one does not render the
  component again when the locale changes
files:
  - '**/*.ts'
  - '**/*.tsx'
utils:
  global-t-imported:
    kind: program
    has:
      kind: import_statement
      regex: '[''"]@lingui/(?:core/)?macro[''"]'
      has:
        stopBy: end
        kind: import_specifier
        regex: '^t$'
  global-i18n-imported:
    kind: program
    has:
      kind: import_statement
      regex: '[''"]@lingui/core[''"]'
      has:
        stopBy: end
        kind: import_specifier
        regex: '^i18n$'
  # Why: a function that renders markup is a component, and one named use… a hook.
  component-or-hook:
    all:
      - any:
          - kind: function_declaration
          - kind: function_expression
          - kind: arrow_function
      - any:
          - has:
              stopBy: end
              any:
                - kind: jsx_element
                - kind: jsx_self_closing_element
          - has:
              field: name
              regex: '^use[A-Z]'
          - inside:
              kind: variable_declarator
              has:
                field: name
                regex: '^use[A-Z]'
rule:
  inside:
    stopBy: end
    matches: component-or-hook
  any:
    - kind: call_expression
      has:
        field: function
        regex: '^t$'
      inside:
        stopBy: end
        matches: global-t-imported
      # Why: a t is the component's own once the component or hook around it takes useLingui.
      not:
        inside:
          stopBy: end
          matches: component-or-hook
          has:
            stopBy: end
            kind: variable_declarator
            regex: 'useLingui\s*\('
    - kind: call_expression
      has:
        field: function
        regex: '^i18n\.(?:_|t)$'
      inside:
        stopBy: end
        matches: global-i18n-imported
