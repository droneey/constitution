# yaml-language-server:$schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: credential-kept-in-a-device-only-keychain-item@typescript
language: Tsx
severity: error
message: >-
  Store the item in a keychain class that ends in ThisDeviceOnly: the default class travels in the
  device's backup to another device
files:
  - '**/*.ts'
  - '**/*.tsx'
utils:
  # Why: Expo's SecureStore names a class keychainAccessible and react-native-keychain accessible.
  device-only-class:
    kind: pair
    has:
      field: key
      regex: '^[''"]?(?:keychainAccessible|accessible)[''"]?$'
    all:
      - has:
          field: value
          regex: '(?i)this_?device_?only[''"`]?$'
  options-built-elsewhere:
    any:
      - kind: identifier
      - kind: member_expression
      - kind: call_expression
  # Why: the options follow the key and the value, or the server, the user and the password.
  options-place:
    any:
      - inside:
          kind: arguments
          inside:
            kind: call_expression
            has:
              field: function
              regex: '(?:^|\.)(?:setItemAsync|setItem|setGenericPassword)$'
        nthChild: 3
      - inside:
          kind: arguments
          inside:
            kind: call_expression
            has:
              field: function
              regex: '(?:^|\.)setInternetCredentials$'
        nthChild: 4
rule:
  kind: call_expression
  has:
    field: function
    any:
      - regex: '^(?:[A-Za-z_$][\w$]*\.)?(?:setItemAsync|setGenericPassword|setInternetCredentials)$'
      - regex: '^SecureStore\.setItem$'
  not:
    has:
      field: arguments
      has:
        matches: options-place
        any:
          - kind: object
            has:
              matches: device-only-class
          # Why: options built elsewhere are read where they are built.
          - matches: options-built-elsewhere
