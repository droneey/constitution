# yaml-language-server:$schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: field-never-blocks-paste-or-autofill@html
language: Html
severity: error
message: >-
  Let the field take pasting and autofill: blocking them turns sign-in into a test of memory and
  pushes people to weaker passwords
files:
  - '**/*.html'
# Why: test code builds the documents its cases read, which are no pages of the program.
ignores:
  - '**/${role.colocated-specs}/**'
  - '**/${role.package-suites}/**'
rule:
  kind: attribute
  any:
    - regex: '(?i)^autocomplete\s*=\s*["'']?\s*off\s*["'']?$'
    - regex: '(?i)^onpaste\s*=.*\bpreventDefault\s*\(|^onpaste\s*=\s*["'']?\s*return\s+false'
