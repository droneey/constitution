# yaml-language-server:$schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: app-assembled-by-the-root@python
language: Python
severity: error
message: 'Only the composition root builds the FastAPI app: take its parts from where they live'
files:
  - '**/${role.source}/**'
ignores:
  - '**/${role.source}/*/${role.composition-root}/**'
rule:
  kind: call
  has:
    field: function
    any:
      - regex: ^fastapi\.FastAPI$
      - kind: identifier
        regex: ^FastAPI$
