# yaml-language-server:$schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: case-named-test-should@python
language: Python
severity: error
message: A case is named `test_should_<behaviour>`, with `_when_<condition>` where it has one
files:
  - '**/${role.package-suites}/**/*.py'
rule:
  kind: identifier
  regex: ^test_
  any:
    - not:
        regex: ^test_should_[a-z0-9]
    - regex: ^test_should_when(?:_|$)
    - regex: _when_?$
  inside:
    kind: function_definition
    field: name
    # Why: pytest finds no case in a fixture, whatever its name.
    not:
      inside:
        kind: decorated_definition
        has:
          kind: decorator
          regex: ^@(?:pytest\.)?fixture\b
