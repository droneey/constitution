# yaml-language-server:$schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: init-of-a-folder-without-a-surface-empty@python
language: Python
severity: error
message: >-
  A folder with no surface keeps its __init__.py empty: import its members by their own modules
# Why: a glob's star crosses folders, so the layers are named only where no folder module or role
# folder of the same name can sit: a layer's name directly under the import package, a feature's or
# a composition module's, and a concept folder directly under a domain layer.
files:
  - '**/${role.source}/*/{${role.bounded-context},${role.composition-module},${role.adapter},${role.shared-kernel},${role.shared-code},${role.generic-library},${role.host-integration},${role.extra-entry},${role.presentation-layer},${role.domain-layer},${role.application}}/${role.surface}.py'
  - '**/${role.source}/*/{${role.bounded-context},${role.composition-module}}/*/${role.domain-layer}/*/${role.surface}.py'
ignores:
  # Why: a role folder of a concept, and what it holds, may have a surface.
  - '**/${role.domain-layer}/*/*/${role.surface}.py'
  # Why: a folder module named like a layer, as a feature named for presentations, has a surface.
  - '**/{${role.bounded-context},${role.composition-module},${role.adapter},${role.shared-code},${role.generic-library},${role.host-integration},${role.extra-entry}}/{${role.bounded-context},${role.composition-module},${role.adapter},${role.shared-kernel},${role.shared-code},${role.generic-library},${role.host-integration},${role.extra-entry},${role.presentation-layer},${role.domain-layer},${role.application}}/${role.surface}.py'
  - '**/*_${role.generated-file}/**'
rule:
  kind: module
  has:
    all:
      - pattern: $STATEMENT
      - not:
          kind: comment
