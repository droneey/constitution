typescript:
  null-mapped-to-undefined-in-the-adapter:
    typescript:
      ast-grep.${role.generated-file}/undefined-is-the-only-absence.yaml:
        ignores@left-out:
          - '**/${role.adapter}/**'
          - '**/${role.wire-model}/**'
  set-timeout-called-only-at-the-edge:
    typescript:
      sgconfig.yaml:
        ruleDirs:
          - ast-grep.${role.generated-file}
      # Why: a key and a path, which YAML cannot break.
      # yamllint disable-line rule:line-length
      ast-grep.${role.generated-file}/set-timeout-called-only-at-the-edge.yaml !text: !copy ${constitution.path}/presets/ast-grep/plugins/typescript/set-timeout-called-only-at-the-edge.yaml
core:
  business-value-lives-in-the-domain:
    typescript:
      ast-grep.${role.generated-file}/entity-value-or-event-typed-readonly.yaml:
        files@business-types:
          - '**/${role.domain-layer}/**'
          - '**/${role.shared-kernel}/**'
  outside-shape-mapped-in-the-adapter:
    typescript:
      ast-grep.${role.generated-file}/closed-name-set-is-a-string-enum.yaml:
        ignores@left-out:
          - '**/${role.adapter}/**'
          - '**/${role.wire-model}/**'
  surface-only-re-exports:
    typescript:
      sgconfig.yaml:
        ruleDirs:
          - ast-grep.${role.generated-file}
        utilDirs:
          - ast-grep-utils.${role.generated-file}
      # Why: a key and a path, which YAML cannot break.
      # yamllint disable-line rule:line-length
      ast-grep-utils.${role.generated-file}/surface-only-re-exports.yaml !text: !copy ${constitution.path}/presets/ast-grep/plugins/typescript/surface-only-re-exports.yaml
      # Why: the rule's scope takes the files other blocks leave out of it, which a copied rule
      # cannot, so it matches the copied utility of its syntax.
      ast-grep.${role.generated-file}/surface-only-re-exports.yaml:
        id: surface-only-re-exports@typescript
        language: Tsx
        severity: error
        message: 'A surface only re-exports by name: move this into a file of its own'
        files:
          - '**/${role.surface}.ts'
          - '**/${role.surface}.tsx'
        ignores:
          - '**/${role.source}/${role.composition-root}/**/${role.surface}.tsx'
          - slot: left-out
        rule:
          matches: surface-only-re-exports@typescript
