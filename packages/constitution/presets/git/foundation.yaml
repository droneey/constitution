version-control:
  working-notes-stay-out-of-history:
    '*':
      .gitignore:
        - /${role.working-notes}/
  machine-local-files-ignored:
    '*':
      .gitignore ? ${file.isTop}:
        - /.droneey
      .gitignore:
        - .claude/settings.local.json
        - .claude/worktrees/
        - .env*
        - '!.env.example'
        - .DS_Store
        - .vscode/*
        - '!.vscode/settings.json'
        - '!.vscode/tasks.json'
        - '!.vscode/launch.json'
        - '!.vscode/extensions.json'
        - .idea/
        - '*.log'
        - '**/logs/'
        - .temp/
        - .tmp/
        - '*.bak'
        - '*.orig'
        - '*~'
core:
  secret-never-in-the-repository:
    '*':
      .gitignore:
        - '*.pem'
        - '*.key'
        - '*.p12'
        - '*.pfx'
        - '*.jks'
        - credentials.json
        - id_rsa
        - '*.secrets'
