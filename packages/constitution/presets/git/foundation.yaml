version-control:
  machine-local-files-ignored:
    '*':
      .gitignore ? ${file.isTop}:
        - /.droneey
      .gitignore:
        - .claude/settings.local.json
        - .claude/worktrees/
        - .DS_Store
        - .vscode/*
        - '!.vscode/settings.json'
        - '!.vscode/tasks.json'
        - '!.vscode/launch.json'
        - '!.vscode/extensions.json'
        - .idea/
        - '*.log'
        - '**/logs/'
        - .temp/
        - .tmp/
        - '*.bak'
        - '*.orig'
        - '*~'
git:
  gitignore-covers-environment-files:
    '*':
      .gitignore:
        - .env*
        - '!.env.example'
core:
  secret-never-in-the-repository:
    '*':
      .gitignore:
        - '*.pem'
        - '*.key'
        - '*.p12'
        - '*.pfx'
        - '*.jks'
        - credentials.json
        - id_rsa
        - '*.secrets'
