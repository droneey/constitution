storybook:
  stories-unreachable-from-production:
    typescript:
      .dependency-cruiser.json:
        forbidden[name=stories-unreachable-from-production]:
          severity: error
          from:
            pathNot:
              - \.stories\.[^/]+$
              - ^\.storybook/
          to:
            path: \.stories\.[^/]+$
core:
  production-code-imports-no-tool:
    typescript:
      .dependency-cruiser.json:
        forbidden[name=no-development-dependency-in-production]:
          from:
            pathNot:
              - \.stories\.[^/]+$
