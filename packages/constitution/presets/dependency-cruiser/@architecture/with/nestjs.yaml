nestjs:
  '*':
    typescript:
      .dependency-cruiser.jsonc:
        allowedSeverity: error
  feature-module-imports-no-other-features-module:
    typescript:
      .dependency-cruiser.jsonc:
        # Why: a feature's surface re-exports its module, so the import of another feature's module
        # is seen by what the module file reaches.
        forbidden[name=feature-module-imports-no-other-features-module]:
          severity: error
          from:
            path: ^${role.source}/${role.bounded-context}/([^/]+)/.*\.${role.nest-module}$
          to:
            path: ^${role.source}/.*\.${role.nest-module}$
            pathNot:
              - ^${role.source}/${role.bounded-context}/$1/
              - ^${role.source}/${role.shared-code}/
            reachable: true
contracts/api:
  server-framework-imported-by-the-presentation:
    typescript:
      .dependency-cruiser.jsonc:
        'allowed[comment=server-framework-imported-by-the-presentation: nestjs]':
          from:
            path:
              - ^${role.source}/(${role.bounded-context}|${role.composition-module})/[^/]+/${role.presentation-layer}/
              - ^${role.source}/${role.presentation-layer}/
              - /${role.framework-provider}/
          to:
            path: node_modules/@nestjs/
