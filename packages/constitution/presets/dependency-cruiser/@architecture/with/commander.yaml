commander:
  '*':
    typescript:
      .dependency-cruiser.jsonc:
        allowedSeverity: error
client/cli:
  command-line-parser-imported-only-by-binding-units:
    typescript:
      .dependency-cruiser.jsonc:
        'allowed[comment=command-line-parser-imported-only-by-binding-units: commander]':
          from:
            path:
              - ^${role.source}/(${role.bounded-context}|${role.composition-module})/[^/]+/${role.presentation-layer}/${role.binding}/
              - ^${role.source}/${role.presentation-layer}/${role.binding}/
          to:
            path: node_modules/commander/
