presentation:
  binding-unit-consumed-only-by-screens-or-widgets:
    typescript:
      .dependency-cruiser.jsonc:
        forbidden[name=components-take-data-and-callbacks]:
          severity: error
          from:
            path: /${role.presentation-layer}/${role.component}/
          to:
            path:
              - ^${role.source}/(${role.bounded-context}|${role.composition-module})/[^/]+/(${role.application}|${role.adapter}|${role.presentation-layer}/${role.binding})/
              - ^${role.source}/(${role.shared-kernel}/${role.port}|${role.adapter})/
            pathNot: ^${role.source}/(${role.bounded-context}|${role.composition-module})/[^/]+/${role.application}/${role.use-case}/${role.surface}\.[^/]+$
  feature-ui-imports-nothing-of-its-workings:
    typescript:
      .dependency-cruiser.jsonc:
        forbidden[name=ui-reaches-no-mechanism]:
          severity: error
          from:
            path: ^${role.source}/(${role.bounded-context}|${role.composition-module})/([^/]+)/${role.presentation-layer}/(${role.screen}|${role.widget}|${role.component})/
          to:
            path:
              - ^${role.source}/$1/$2/(${role.adapter}|${role.application})/
              - ^${role.source}/(${role.shared-kernel}/${role.port}|${role.adapter})/
            pathNot: ^${role.source}/$1/$2/${role.application}/${role.use-case}/${role.surface}\.[^/]+$
        forbidden[name=ui-takes-only-read-model-types-of-its-use-cases]:
          severity: error
          from:
            path: ^${role.source}/(${role.bounded-context}|${role.composition-module})/([^/]+)/${role.presentation-layer}/(${role.screen}|${role.widget}|${role.component})/
          to:
            path: ^${role.source}/$1/$2/${role.application}/${role.use-case}/${role.surface}\.[^/]+$
            dependencyTypesNot:
              - type-only
  component-never-imports-a-widget:
    typescript:
      .dependency-cruiser.jsonc:
        forbidden[name=components-never-import-widgets]:
          severity: error
          from:
            path: /${role.presentation-layer}/${role.component}/
          to:
            path: /${role.presentation-layer}/${role.widget}/
  binding-unit-imports-nothing-of-the-ui:
    typescript:
      .dependency-cruiser.jsonc:
        forbidden[name=binding-units-reach-no-ui]:
          severity: error
          from:
            path: ^${role.source}/(${role.bounded-context}|${role.composition-module})/[^/]+/${role.presentation-layer}/${role.binding}/
          to:
            path: ^${role.source}/(${role.bounded-context}|${role.composition-module})/[^/]+/${role.presentation-layer}/(${role.screen}|${role.widget}|${role.component})/
  feature-ui-imports-only-ui-shared-layers:
    typescript:
      .dependency-cruiser.jsonc:
        forbidden[name=feature-ui-imports-only-ui-shared-layers]:
          severity: error
          from:
            path: ^${role.source}/${role.bounded-context}/([^/]+)/${role.presentation-layer}/(?:${role.widget}|${role.component})/
            pathNot:
              - (^|/)${role.colocated-specs}/
          to:
            # Why: the program's code is its script files; an asset or a stylesheet is no code.
            path: ^${role.source}/.+\.[cm]?[jt]sx?$
            pathNot:
              - ^${role.source}/${role.bounded-context}/$1/
              - ^${role.source}/(?:${role.generic-library}|${role.shared-code})/${role.ui-kit}/
              - ^${role.source}/${role.shared-kernel}/(?!${role.port}/)
