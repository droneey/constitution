bunli:
  '*':
    typescript:
      .dependency-cruiser.jsonc:
        allowedSeverity: error
cli:
  command-parser-imported-by-the-command-files:
    typescript:
      .dependency-cruiser.jsonc:
        'allowed[comment=command-parser-imported-by-the-command-files: bunli]':
          from:
            path: ^${role.source}/(${role.bounded-context}|${role.composition-module})/[^/]+/${role.presentation-layer}/.*\.${role.command-binding}\.[^/]+$
          to:
            path: node_modules/@bunli/
