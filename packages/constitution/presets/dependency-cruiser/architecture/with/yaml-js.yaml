yaml-js:
  yaml-home-is-the-parsing-adapter-and-lib:
    typescript:
      .dependency-cruiser.jsonc:
        forbidden[name=yaml-home-is-the-parsing-adapter-and-lib]:
          severity: error
          from:
            pathNot:
              - ^${role.source}/${role.adapter}/
              - ^${role.source}/(?:${role.bounded-context}|${role.composition-module})/[^/]+/${role.adapter}/
