zod:
  '*':
    typescript:
      .dependency-cruiser.jsonc:
        allowedSeverity: error
_schema:
  schema-library-home-is-where-input-is-parsed:
    typescript:
      .dependency-cruiser.jsonc:
        allowed[comment=schema-library-home-is-where-input-is-parsed]:
          from:
            path:
              - ^${role.source}/(${role.bounded-context}|${role.composition-module})/[^/]+/${role.presentation-layer}/
              - ^${role.source}/${role.presentation-layer}/
              - ^${role.source}/${role.shared-code}/
          to:
            path: node_modules/zod/
