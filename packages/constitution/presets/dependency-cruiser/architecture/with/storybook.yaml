storybook:
  '*':
    typescript:
      .dependency-cruiser.jsonc:
        allowedSeverity: error
  stories-import-what-they-render-with:
    typescript:
      .dependency-cruiser.jsonc:
        allowed[comment=stories-import-what-they-render-with]:
          from:
            path: \.stories\.[^/]+$
          to:
            dependencyTypes:
              - npm
              - npm-dev
              - npm-peer
              - npm-optional
              - npm-bundled
