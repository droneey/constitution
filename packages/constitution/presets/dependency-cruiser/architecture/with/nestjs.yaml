nestjs:
  '*':
    typescript:
      .dependency-cruiser.jsonc:
        allowedSeverity: error
_api:
  server-framework-imported-by-the-presentation:
    typescript:
      .dependency-cruiser.jsonc:
        'allowed[comment=server-framework-imported-by-the-presentation: nestjs]':
          from:
            path:
              - ^${role.source}/(${role.bounded-context}|${role.composition-module})/[^/]+/${role.presentation-layer}/
              - ^${role.source}/${role.presentation-layer}/
              - /${role.framework-provider}/
          to:
            path: node_modules/@nestjs/
