nestjs:
  '*':
    typescript:
      .dependency-cruiser.json:
        allowedSeverity: error
  nestjs-imported-by-modules-and-providers:
    typescript:
      .dependency-cruiser.json:
        allowed[comment=nestjs-imported-by-modules-and-providers]:
          from:
            path:
              - ^${role.source}/(${role.bounded-context}|${role.composition-module})/[^/]+/${role.application-layer}/
              - /${role.framework-provider}/
          to:
            path: node_modules/@nestjs/
