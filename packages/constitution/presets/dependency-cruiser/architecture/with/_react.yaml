_react:
  '*':
    typescript:
      .dependency-cruiser.jsonc:
        allowedSeverity: error
ui:
  rendering-library-imported-by-the-presentation:
    typescript:
      .dependency-cruiser.jsonc:
        'allowed[comment=rendering-library-imported-by-the-presentation: react]':
          from:
            path:
              - /${role.presentation-layer}/
              - ^${role.source}/(${role.bounded-context}|${role.composition-module})/[^/]+/${role.presentation-layer}/
              - ^${role.source}/(${role.shared-code}|${role.generic-library})/ui/
          to:
            path: node_modules/react/
