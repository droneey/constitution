tanstack-router:
  '*':
    typescript:
      .dependency-cruiser.json:
        allowedSeverity: error
  router-primitives-only-in-the-root:
    typescript:
      .dependency-cruiser.json:
        allowed[comment=router-primitives-only-in-the-root]:
          from:
            path:
              - ^${role.source}/(?!index\.)[^/]+\.[^/]+$
              - ^${role.source}/${role.extra-entry}/[^/]+/main\.[^/]+$
              - ^${role.source}/${role.composition-root}/
              - (^|/)__tests__/
              - ^${role.package-suites}/
          to:
            path: node_modules/@tanstack/react-router/
        forbidden[name=router-only-in-its-home]:
          severity: error
          from:
            pathNot:
              - ^${role.source}/(?!index\.)[^/]+\.[^/]+$
              - ^${role.source}/${role.extra-entry}/[^/]+/main\.[^/]+$
              - ^${role.source}/${role.composition-root}/
              - (^|/)__tests__/
              - ^${role.package-suites}/
          to:
            path: node_modules/@tanstack/react-router/
