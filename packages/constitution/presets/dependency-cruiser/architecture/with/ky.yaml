ky:
  '*':
    typescript:
      .dependency-cruiser.jsonc:
        allowedSeverity: error
  ky-home-is-the-adapters-libs-root-and-its-failure-mapper:
    typescript:
      .dependency-cruiser.jsonc:
        allowed[comment=ky-home-is-the-adapters-libs-root-and-its-failure-mapper]:
          from:
