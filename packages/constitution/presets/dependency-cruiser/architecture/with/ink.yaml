ink:
  '*':
    typescript:
      .dependency-cruiser.jsonc:
        allowedSeverity: error
  ink-imported-by-the-ui:
    typescript:
      .dependency-cruiser.jsonc:
        allowed[comment=ink-imported-by-the-ui]:
          from:
            path: /${role.presentation-layer}/
          to:
            path: node_modules/ink/
