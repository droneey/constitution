react-native:
  '*':
    typescript:
      .dependency-cruiser.jsonc:
        allowedSeverity: error
  react-native-imported-by-the-ui:
    typescript:
      .dependency-cruiser.jsonc:
        allowed[comment=react-native-imported-by-the-ui]:
          from:
            path:
              - /${role.presentation-layer}/
              - ^${role.source}/(${role.bounded-context}|${role.composition-module})/[^/]+/${role.application-layer}/
          to:
            path: node_modules/react-native/
