ui:
  presentational-component-performs-no-io:
    typescript:
      .dependency-cruiser.jsonc:
        forbidden[name=components-take-data-and-callbacks]:
          severity: error
          from:
            path: /${role.presentation-layer}/${role.component}/
          to:
            path:
              - ^${role.source}/(${role.bounded-context}|${role.composition-module})/[^/]+/(${role.application-layer}|${role.gateway}|${role.presentation-layer}/${role.binding})/
              - ^${role.source}/(${role.shared-domain}/${role.port}|${role.gateway})/
  ui-layer-imports-only-what-its-feature-offers:
    typescript:
      .dependency-cruiser.jsonc:
        forbidden[name=ui-reaches-no-mechanism]:
          severity: error
          from:
            path: ^${role.source}/(${role.bounded-context}|${role.composition-module})/([^/]+)/${role.presentation-layer}/(${role.screen}|${role.widget}|${role.component})/
          to:
            path:
              - ^${role.source}/$1/$2/(${role.gateway}|${role.application-layer})/
              - ^${role.source}/(${role.shared-domain}/${role.port}|${role.gateway})/
  component-never-imports-a-widget:
    typescript:
      .dependency-cruiser.jsonc:
        forbidden[name=components-never-import-widgets]:
          severity: error
          from:
            path: /${role.presentation-layer}/${role.component}/
          to:
            path: /${role.presentation-layer}/${role.widget}/
  binding-unit-imports-nothing-of-the-ui:
    typescript:
      .dependency-cruiser.jsonc:
        forbidden[name=binding-units-reach-no-adapter-or-ui]:
          severity: error
          from:
            path: ^${role.source}/(${role.bounded-context}|${role.composition-module})/[^/]+/${role.presentation-layer}/${role.binding}/
          to:
            path:
              - ^${role.source}/(${role.bounded-context}|${role.composition-module})/[^/]+/(${role.gateway}|${role.presentation-layer}/(${role.screen}|${role.widget}|${role.component})/)
              - ^${role.source}/${role.gateway}/
core:
  module-files-import-each-other-directly:
    typescript:
      .dependency-cruiser.jsonc:
        forbidden[name=role-reached-through-its-surface]:
          to:
            path:
              - ^${role.source}/$1/$2/${role.presentation-layer}/[^/]+/
