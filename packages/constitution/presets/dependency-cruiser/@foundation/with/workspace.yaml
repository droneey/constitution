workspace:
  unit-reached-only-through-its-published-entries:
    typescript:
      .dependency-cruiser.jsonc:
        forbidden[name=other-unit-reached-by-its-name]:
          severity: error
          from:
            pathNot: ^\.\./
          to:
            path: ^\.\./
            dependencyTypes:
              - local
      .dependency-cruiser.jsonc ? ${workspace.isRoot}:
        forbidden[name=root-imports-units-by-name]:
          severity: error
          from:
            pathNot: ^(?:${role.deployed-unit}|${role.dependency-unit})/
          to:
            path: ^(?:${role.deployed-unit}|${role.dependency-unit})/
            dependencyTypes:
              - local
  apps-blind-to-each-other:
    typescript:
      .dependency-cruiser.jsonc ? ${unit.parent} = ${role.deployed-unit}:
        forbidden[name=apps-blind-to-each-other]:
          severity: error
          from:
            pathNot: ^\.\./
          to:
            path: ^(?:\.\./){1,${unit.depth}}[^./]
  packages-never-import-apps:
    typescript:
      .dependency-cruiser.jsonc:
        forbidden[name=packages-know-no-app]:
          severity: error
          from:
            pathNot: ^\.\./
          to:
            path: ^(?:\.\./)+${role.deployed-unit}/
