core:
  every-mutant-killed:
    typescript:
      stryker.${role.config-file}.json:
        mutate:
          - '!${role.source}/router.{ts,tsx}'
          - '!${role.source}/client.{ts,tsx}'
tanstack-start:
  '*':
    typescript:
      stryker.${role.config-file}.json:
        ignorePatterns:
          - .output
