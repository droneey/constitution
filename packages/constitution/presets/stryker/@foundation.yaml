core:
  every-mutant-killed:
    typescript:
      stryker.${role.config-file}.json:
        mutate:
          - ${role.source}/**/*.{ts,tsx}
          - '!${role.source}/**/${role.colocated-specs}/**'
          - '!${role.source}/main.{ts,tsx}'
          - '!${role.source}/**/*.${role.generated-file}.*'
          - '!${role.source}/**/*.d.ts'
          - ${role.build-code}/**/*.ts
          - '!${role.build-code}/**/${role.colocated-specs}/**'
          - '!${role.build-code}/*/main.ts'
        thresholds:
          break: 100
  '*':
    typescript:
      stryker.${role.config-file}.json:
        thresholds:
          high: 100
          low: 100
  failure-told-apart-by-code:
    typescript:
      stryker.${role.config-file}.json:
        diagnosticsTextArguments:
          new *Error: 0
          super: 0
stryker:
  diagnostic-mutants-left-out-by-the-ignorer:
    typescript:
      stryker.${role.config-file}.json:
        plugins:
          - ./${constitution.path}/tools/mutation-check/dist/ignorers.js
        ignorers:
          - diagnostics
  '*':
    typescript:
      stryker.${role.config-file}.json:
        reporters:
          - clear-text
        clearTextReporter:
          allowColor: false
          logTests: false
        tempDirName: .stryker-tmp
        tsconfigFile: stryker-has-no-tsconfig.json
        timeoutMS: 30000
        concurrency: 50%
