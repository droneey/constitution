bun-test:
  '*':
    typescript:
      biome.jsonc:
        overrides:
          - includes:
              - '**/${role.colocated-specs}/**'
              - '**/*.${role.spec-file}.ts'
              - '**/*.${role.spec-file}.tsx'
            linter:
              domains:
                test: all
          - includes:
              - '**/${role.colocated-specs}/**'
              - '**/*.${role.spec-file}.ts'
              - '**/*.${role.spec-file}.tsx'
            linter:
              rules:
                complexity:
                  noExcessiveNestedTestSuites: 'off'
          - includes:
              - '**/${role.colocated-specs}/**'
              - '**/*.${role.spec-file}.ts'
              - '**/*.${role.spec-file}.tsx'
            linter:
              rules:
                style:
                  useConsistentTestIt: error
          - includes:
              - '**/${role.colocated-specs}/**'
              - '**/*.${role.spec-file}.ts'
              - '**/*.${role.spec-file}.tsx'
            linter:
              rules:
                style:
                  useTestHooksInOrder: error
          - includes:
              - '**/${role.colocated-specs}/**'
              - '**/*.${role.spec-file}.ts'
              - '**/*.${role.spec-file}.tsx'
            linter:
              rules:
                style:
                  useTestHooksOnTop: error
