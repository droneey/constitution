bun-test:
  '*':
    typescript:
      biome.jsonc:
        overrides:
          - includes:
              - '**/${role.colocated-specs}/**'
              - '**/*.${role.spec-file}.ts'
              - '**/*.${role.spec-file}.tsx'
            linter:
              domains:
                test: all
          - includes:
              - '**/${role.colocated-specs}/**'
              - '**/*.${role.spec-file}.ts'
              - '**/*.${role.spec-file}.tsx'
            linter:
              rules:
                complexity:
                  noExcessiveNestedTestSuites: 'off'
          - includes:
              - '**/${role.colocated-specs}/**'
              - '**/*.${role.spec-file}.ts'
              - '**/*.${role.spec-file}.tsx'
            linter:
              rules:
                style:
                  useConsistentTestIt: error
          - includes:
              - '**/${role.colocated-specs}/**'
              - '**/*.${role.spec-file}.ts'
              - '**/*.${role.spec-file}.tsx'
            linter:
              rules:
                style:
                  useTestHooksInOrder: error
          - includes:
              - '**/${role.colocated-specs}/**'
              - '**/*.${role.spec-file}.ts'
              - '**/*.${role.spec-file}.tsx'
            linter:
              rules:
                style:
                  useTestHooksOnTop: error
  bun-spec-mocks-no-module:
    typescript:
      biome.jsonc:
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/bun-spec-mocks-no-module.${role.grit-rule}]:
          includes:
            - '**/${role.colocated-specs}/**'
            - '**/*.${role.spec-file}.ts'
            - '**/*.${role.spec-file}.tsx'
  strict-matcher-only:
    typescript:
      biome.jsonc:
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/strict-matcher-only.${role.grit-rule}]:
          includes:
            - '**/${role.colocated-specs}/**'
            - '**/*.${role.spec-file}.ts'
            - '**/*.${role.spec-file}.tsx'
  bun-test-retries-no-case:
    typescript:
      biome.jsonc:
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/bun-test-retries-no-case.${role.grit-rule}]:
          includes:
            - '**/${role.colocated-specs}/**'
            - '**/*.${role.spec-file}.ts'
            - '**/*.${role.spec-file}.tsx'
  bun-spec-never-sleeps:
    typescript:
      biome.jsonc:
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/bun-spec-never-sleeps.${role.grit-rule}]:
          includes:
            - '**/${role.colocated-specs}/**'
            - '**/*.${role.spec-file}.ts'
            - '**/*.${role.spec-file}.tsx'
core:
  test-runs-unconditionally:
    typescript:
      biome.jsonc:
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/test-runs-unconditionally.${role.grit-rule}]:
          includes:
            - '**/${role.colocated-specs}/**'
            - '**/*.${role.spec-file}.ts'
            - '**/*.${role.spec-file}.tsx'
