typescript:
  '*':
    typescript:
      biome.jsonc:
        assist:
          actions:
            source:
              useSortedInterfaceMembers:
                level: 'on'
                options: {}
        linter:
          rules:
            suspicious:
              noEvolvingTypes: error
              noDuplicateEnumValues: error
            style:
              noParameterProperties: error
              useConsistentMemberAccessibility:
                level: error
                options:
                  accessibility: explicit
              useReadonlyClassProperties: error
              useUnifiedTypeSignatures: error
              useAsConstAssertion: error
              useConsistentArrayType: error
              useConsistentTypeDefinitions: error
              useConsistentEnumValueType: error
              useConsistentMethodSignatures: error
            nursery:
              useExplicitReturnType: error
              noBaseToString: 'off'
        overrides:
          - includes:
              - '**/*.${role.config-file}.ts'
              - '**/.*rc.ts'
            linter:
              rules:
                nursery:
                  useExplicitReturnType: 'off'
          - includes:
              - '**/*.d.ts'
            linter:
              rules:
                correctness:
                  noUnusedVariables: 'off'
          - includes:
              - '**/${role.colocated-specs}/**'
              - '**/*.${role.spec-file}.ts'
              - '**/*.${role.spec-file}.tsx'
            linter:
              rules:
                style:
                  useConsistentMemberAccessibility: 'off'
          - includes:
              - '**/${role.colocated-specs}/**'
              - '**/*.${role.spec-file}.ts'
              - '**/*.${role.spec-file}.tsx'
            linter:
              rules:
                nursery:
                  useExplicitReturnType: 'off'
  equality-never-loose:
    typescript:
      biome.jsonc:
        linter:
          rules:
            suspicious:
              noDoubleEquals:
                level: error
                options:
                  ignoreNull: false
  any-never-written:
    typescript:
      biome.jsonc:
        linter:
          rules:
            suspicious:
              noExplicitAny: error
  type-error-suppressed-by-ts-expect-error:
    typescript:
      biome.jsonc:
        linter:
          rules:
            suspicious:
              noTsIgnore: error
  enum-never-declared-const:
    typescript:
      biome.jsonc:
        linter:
          rules:
            suspicious:
              noConstEnum: error
  name-cased-by-the-typescript-conventions:
    typescript:
      biome.jsonc:
        linter:
          rules:
            style:
              useNamingConvention:
                level: error
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/name-cased-by-the-typescript-conventions.${role.grit-rule}]:
          includes:
            - '**/*.ts'
            - '**/*.tsx'
        overrides:
          - includes:
              - '**/*.d.ts'
            linter:
              rules:
                style:
                  useNamingConvention: 'off'
  type-parameter-named-by-a-leading-t:
    typescript:
      biome.jsonc:
        linter:
          rules:
            style:
              useNamingConvention:
                level: error
                options:
                  conventions:
                    - selector:
                        kind: typeParameter
                      match: T([A-Z].*)?
                      formats:
                        - PascalCase
  type-assertion-never-written:
    typescript:
      biome.jsonc:
        linter:
          rules:
            style:
              noNonNullAssertion: error
            nursery:
              noUnsafeTypeAssertion: error
  closed-name-set-is-a-string-enum:
    typescript:
      biome.jsonc:
        linter:
          rules:
            style:
              useEnumInitializers: error
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/closed-name-set-is-a-string-enum.${role.grit-rule}]:
          includes:
            - '**/*.ts'
            - '**/*.tsx'
            - slot: left-out
  time-held-as-a-temporal-value:
    typescript:
      biome.jsonc:
        linter:
          rules:
            style:
              noRestrictedImports:
                level: error
                options:
                  paths:
                    moment: 'Use Temporal: date libraries wrap the Date it replaces'
                    dayjs: 'Use Temporal: date libraries wrap the Date it replaces'
                    date-fns: 'Use Temporal: date libraries wrap the Date it replaces'
                    luxon: 'Use Temporal: date libraries wrap the Date it replaces'
                  patterns:
                    - group:
                        - moment/**
                        - dayjs/**
                        - date-fns/**
                        - luxon/**
                      message: 'Use Temporal: date libraries wrap the Date it replaces'
  type-only-import-written-as-import-type:
    typescript:
      biome.jsonc:
        linter:
          rules:
            style:
              useImportType: !replace
                level: error
                options:
                  style: separatedType
              useExportType: !replace
                level: error
                options:
                  style: separatedType
  namespace-never-written:
    typescript:
      biome.jsonc:
        linter:
          rules:
            style:
              noNamespace: error
  module-exports-by-name:
    typescript:
      biome.jsonc:
        linter:
          rules:
            style:
              noDefaultExport: error
        overrides:
          - includes:
              - '**/*.${role.config-file}.ts'
              - '**/*.${role.config-file}.js'
              - '**/*.${role.config-file}.mjs'
              - '**/*.${role.config-file}.cjs'
              - '**/.*rc.ts'
              - '**/.*rc.js'
              - '**/.*rc.mjs'
              - '**/.*rc.cjs'
            linter:
              rules:
                style:
                  noDefaultExport: 'off'
          - includes:
              - '**/*.d.ts'
            linter:
              rules:
                style:
                  noDefaultExport: 'off'
  package-is-an-es-module:
    typescript:
      biome.jsonc:
        linter:
          rules:
            style:
              noCommonJs: error
  undefined-is-the-only-absence:
    typescript:
      biome.jsonc:
        linter:
          rules:
            complexity:
              noUselessUndefined: error
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/undefined-is-the-only-absence.${role.grit-rule}]:
          includes:
            - '**'
            - slot: left-out
            - '!**/*.tsx'
  promise-awaited-returned-or-handed-to-a-scope:
    typescript:
      biome.jsonc:
        linter:
          rules:
            complexity:
              noVoid: error
            nursery:
              noFloatingPromises: error
              noMisusedPromises: error
  code-never-run-from-a-string:
    typescript:
      biome.jsonc:
        linter:
          rules:
            security:
              noGlobalEval: error
            nursery:
              noImpliedEval: error
  exhaustive-branching-over-unions:
    typescript:
      biome.jsonc:
        linter:
          rules:
            nursery:
              useExhaustiveSwitchCases: error
  nullish-operators-for-absence:
    typescript:
      biome.jsonc:
        linter:
          rules:
            nursery:
              useNullishCoalescing: error
  scoped-resource-held-by-using:
    typescript:
      biome.jsonc:
        linter:
          rules:
            nursery:
              useDisposables: error
  value-made-text-by-a-named-form:
    typescript:
      biome.jsonc:
        linter:
          rules:
            nursery:
              noUnsafePlusOperands: error
  return-type-no-wider-than-returned:
    typescript:
      biome.jsonc:
        linter:
          rules:
            nursery:
              noMisleadingReturnType: error
  entity-value-or-event-typed-readonly:
    typescript:
      biome.jsonc:
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/entity-value-or-event-typed-readonly.${role.grit-rule}]:
          includes:
            - slot: business-types
  module-level-variable-declared-const:
    typescript:
      biome.jsonc:
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/module-level-variable-declared-const.${role.grit-rule}]:
          includes:
            - '**'
            - '!**/*.${role.spec-file}.ts'
            - '!**/*.${role.spec-file}.tsx'
  parameter-object-has-a-named-type:
    typescript:
      biome.jsonc:
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/parameter-object-has-a-named-type.${role.grit-rule}]:
          includes:
            - '**/*.ts'
            - '**/*.tsx'
  tsx-only-where-markup-is-written:
    typescript:
      biome.jsonc:
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/tsx-only-where-markup-is-written.${role.grit-rule}]:
          includes:
            - '**/*.tsx'
  outside-value-unknown-until-parsed:
    typescript:
      biome.jsonc:
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/outside-value-unknown-until-parsed.${role.grit-rule}]:
          includes:
            - '**/*.ts'
            - '**/*.tsx'
  duration-measured-by-performance-now:
    typescript:
      biome.jsonc:
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/duration-measured-by-performance-now.${role.grit-rule}]:
          includes:
            - '**/*.ts'
            - '**/*.tsx'
core:
  async-work-awaited-or-held-by-a-scope:
    typescript:
      biome.jsonc:
        linter:
          rules:
            nursery:
              noFloatingPromises: error
              noMisusedPromises: error
  type-name-undecorated:
    typescript:
      biome.jsonc:
        plugins:
          - ./${constitution.path}/presets/biome/plugins/typescript/type-name-undecorated.${role.grit-rule}
  spec-folder-file-carries-its-kinds-mark:
    typescript:
      biome.jsonc:
        overrides:
          - includes:
              - '**/${role.colocated-specs}/**'
              - '**/${role.package-suites}/**'
            linter:
              rules:
                style:
                  useFilenamingConvention:
                    level: error
                    options:
                      filenameCases:
                        - kebab-case
                      match: ([^.]+)[.]((?:[^.]+[.])?(?:integration[.]|e2e[.])?(?:test|fake|suite|fixtures)[.]tsx?)
