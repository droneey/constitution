core:
  dependency-reached-through-its-published-entries:
    typescript:
      biome.jsonc:
        linter:
          rules:
            suspicious:
              noReactNativeDeepImports: error
presentation:
  tokens-single-source-of-appearance:
    typescript:
      biome.jsonc:
        linter:
          rules:
            style:
              noReactNativeLiteralColors: error
react:
  component-module-exports-only-components:
    typescript:
      biome.jsonc:
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/component-module-exports-only-components.${role.grit-rule}]:
          includes:
            - '**/*.tsx'
