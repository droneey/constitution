tailwind:
  '*':
    css:
      biome.jsonc:
        css:
          parser:
            tailwindDirectives: true
        linter:
          rules:
            nursery:
              noUndeclaredCustomProperties: !replace 'off'
    typescript:
      biome.jsonc:
        linter:
          rules:
            nursery:
              noUndeclaredClasses: !replace 'off'
  utilities-only-from-tokens:
    typescript:
      biome.jsonc:
        linter:
          rules:
            nursery:
              noTailwindArbitraryValue: error
