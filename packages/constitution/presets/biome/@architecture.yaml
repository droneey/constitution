core:
  query-and-command-apart:
    typescript:
      biome.jsonc:
        overrides:
          - includes:
              - '**/${role.use-case}/${role.read-operation}/**'
              - '!**/${role.colocated-specs}/**'
            linter:
              rules:
                style:
                  noRestrictedImports:
                    level: error
                    options:
                      patterns:
                        - group:
                            - '**'
                          importNamePattern: .*Repository
                          message: >-
                            A query's use case reads through a queries port, never a repository.
                        - group:
                            - '**'
                          importNamePattern: '\*'
                          message: >-
                            A use case imports each port by its name, never a whole surface as a
                            namespace, so the side of each port it takes shows.
          - includes:
              - '**/${role.use-case}/${role.write-operation}/**'
              - '!**/${role.colocated-specs}/**'
            linter:
              rules:
                style:
                  noRestrictedImports:
                    level: error
                    options:
                      patterns:
                        - group:
                            - '**'
                          importNamePattern: .*Queries
                          message: >-
                            A command's use case takes the repositories of the aggregates it loads,
                            never a queries port.
                        - group:
                            - '**'
                          importNamePattern: '\*'
                          message: >-
                            A use case imports each port by its name, never a whole surface as a
                            namespace, so the side of each port it takes shows.
  surface-only-re-exports:
    typescript:
      biome.jsonc:
        linter:
          rules:
            performance:
              noReExportAll: error
  effects-held-only-by-the-edge:
    typescript:
      biome.jsonc:
        overrides:
          - includes:
              - '**/${role.source}/**'
              - '!**/${role.source}/${role.adapter}/**'
              - '!**/${role.source}/${role.bounded-context}/*/${role.adapter}/**'
              - '!**/${role.source}/${role.composition-module}/*/${role.adapter}/**'
              - '!**/${role.source}/${role.generic-library}/**'
              - '!**/${role.source}/${role.composition-root}/**'
              - '!**/${role.source}/*.ts'
              - '!**/${role.source}/*.tsx'
              - '!**/${role.source}/${role.extra-entry}/*/${role.entry}.*'
              - '!**/${role.source}/${role.host-integration}/**'
              - '!**/${role.colocated-specs}/**'
            linter:
              rules:
                style:
                  noRestrictedGlobals:
                    level: error
                    options:
                      deniedGlobals:
                        EventSource: >-
                          Outside the edge, the network reaches this code through a port.
                        WebSocket: >-
                          Outside the edge, the network reaches this code through a port.
                        XMLHttpRequest: >-
                          Outside the edge, the network reaches this code through a port.
                        fetch: >-
                          Outside the edge, the network reaches this code through a port.
                        indexedDB: Outside the edge, storage reaches this code through a port.
                        localStorage: Outside the edge, storage reaches this code through a port.
                        performance: >-
                          Outside the edge, the clock reaches this code through a port.
                        process: >-
                          Outside the edge, the process, its streams and its arguments reach this
                          code through a port.
                        caches: >-
                          Outside the edge, input and output reach this code through a port.
                        cookieStore: >-
                          Outside the edge, input and output reach this code through a port.
                        document: >-
                          Outside the edge, input and output reach this code through a port.
                        globalThis: >-
                          Outside the edge, input and output reach this code through a port.
                        navigator: >-
                          Outside the edge, input and output reach this code through a port.
                        self: >-
                          Outside the edge, input and output reach this code through a port.
                        window: >-
                          Outside the edge, input and output reach this code through a port.
                        sessionStorage: Outside the edge, storage reaches this code through a port.
