typescript:
  component-reaches-no-io-global:
    typescript:
      biome.jsonc:
        overrides:
          - includes:
              - '**/${role.component}/**'
              - '!**/${role.colocated-specs}/**'
            linter:
              rules:
                style:
                  noRestrictedGlobals:
                    level: error
                    options:
                      deniedGlobals:
                        EventSource: >-
                          A component takes its data and callbacks as props; input and output go
                          through binding units.
                        WebSocket: >-
                          A component takes its data and callbacks as props; input and output go
                          through binding units.
