typescript:
  process-env-read-only-under-root:
    typescript:
      biome.jsonc:
        linter:
          rules:
            style:
              noProcessEnv: error
        overrides:
          - includes:
              - '**/${role.composition-root}/**'
              - '**/main.*'
              - '**/${role.extra-entry}/*/main.*'
              - '**/${role.colocated-specs}/**'
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - '**/${role.package-suites}/**'
            linter:
              rules:
                style:
                  noProcessEnv: 'off'
  null-mapped-to-undefined-in-the-adapter:
    typescript:
      biome.jsonc:
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/undefined-is-the-only-absence.${role.grit-rule}]:
          includes@left-out:
            - '!**/${role.gateway}/**'
            - '!**/${role.wire-model}/**'
  timer-set-only-by-the-edge-and-binding-units:
    typescript:
      biome.jsonc:
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/timer-set-only-by-the-edge-and-binding-units.${role.grit-rule}]:
          includes:
            - '**/${role.source}/**'
            - '!**/${role.source}/${role.gateway}/**'
            - '!**/${role.source}/${role.bounded-context}/*/${role.gateway}/**'
            - '!**/${role.source}/${role.composition-module}/*/${role.gateway}/**'
            - '!**/${role.source}/${role.generic-library}/**'
            - '!**/${role.source}/${role.composition-root}/**'
            - '!**/${role.source}/*.ts'
            - '!**/${role.source}/*.tsx'
            - '!**/${role.source}/${role.extra-entry}/**'
            - '!**/${role.source}/${role.host-integration}/**'
            - '!**/${role.source}/${role.bounded-context}/*/${role.application-layer}/**'
            - '!**/${role.source}/${role.composition-module}/*/${role.application-layer}/**'
            - '!**/${role.colocated-specs}/**'
core:
  outside-shape-mapped-in-the-adapter:
    typescript:
      biome.jsonc:
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/closed-name-set-is-a-string-enum.${role.grit-rule}]:
          includes@left-out:
            - '!**/${role.gateway}/**'
            - '!**/${role.wire-model}/**'
  type-lifts-when-features-share-its-meaning:
    typescript:
      biome.jsonc:
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/business-types-readonly.${role.grit-rule}]:
          includes@business-types:
            - '**/${role.pure-layer}/**'
            - '**/${role.shared-domain}/**'
            - '!**/${role.colocated-specs}/**'
  surface-only-re-exports:
    typescript:
      biome.jsonc:
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/surface-only-re-exports.${role.grit-rule}]:
          includes:
            - '**/index.ts'
            - '**/index.tsx'
            - '!**/${role.source}/${role.composition-root}/**/index.tsx'
            - slot: left-out
