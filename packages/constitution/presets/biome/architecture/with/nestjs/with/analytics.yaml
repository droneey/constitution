nestjs:
  decorated-constructor-takes-every-dependency:
    typescript:
      biome.jsonc:
        overrides:
          - includes:
              - '**/*.${role.analytics-sink-file}.ts'
            linter:
              rules:
                complexity:
                  useMaxParams: 'off'
  injected-classes-imported-as-values:
    typescript:
      biome.jsonc:
        overrides:
          - includes:
              - '**/*.${role.analytics-sink-file}.ts'
            linter:
              rules:
                style:
                  useImportType: 'off'
