nestjs:
  feature-module-takes-its-adapters-from-the-root:
    typescript:
      biome.jsonc:
        overrides:
          - includes:
              - '**/*.${role.nest-module}'
            linter:
              rules:
                complexity:
                  noStaticOnlyClass: 'off'
  providers-injected-through-the-constructor:
    typescript:
      biome.jsonc:
        overrides:
          - includes:
              - '**/*.ts'
            linter:
              rules:
                style:
                  noParameterProperties: 'off'
  adapter-is-an-injectable-class:
    typescript:
      biome.jsonc:
        overrides[slot=decorated-constructors]:
          includes@decorated-constructors:
            - '**/*.${role.gateway-file}.ts'
            - '**/*.${role.data-port-file}.ts'
        overrides[slot=injected-classes]:
          includes@injected-classes:
            - '**/*.${role.gateway-file}.ts'
            - '**/*.${role.data-port-file}.ts'
