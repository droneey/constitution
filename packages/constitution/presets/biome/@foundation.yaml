biome:
  '*':
    '*':
      biome.jsonc:
        files:
          ignoreUnknown: true
          includes:
            - '**'
            - '!!**/.droneey'
        markdown:
          linter:
            enabled: false
        linter:
          rules:
            preset: recommended
            complexity:
              noAdjacentSpacesInRegex: error
              noArguments: error
              noBannedTypes: error
              noCommaOperator: error
              noEmptyTypeParameters: error
              noExtraBooleanCast: error
              noFlatMapIdentity: error
              noStaticOnlyClass: error
              noThisInStatic: error
              noUselessCatch: error
              noUselessConstructor: error
              noUselessContinue: error
              noUselessEmptyExport: error
              noUselessEscapeInRegex: error
              noUselessFragments: error
              noUselessLabel: error
              noUselessLoneBlockStatements: error
              noUselessRename: error
              noUselessStringRaw: error
              noUselessSwitchCase: error
              noUselessTernary: error
              noUselessThisAlias: error
              noUselessTypeConstraint: error
              noUselessUndefinedInitialization: error
              useArrowFunction: error
              useDateNow: error
              useFlatMap: error
              useIndexOf: error
              useLiteralKeys: error
              useMathMinMax: error
              useNumericLiterals: error
              useOptionalChain: error
              useRegexLiterals: error
              useSimpleNumberKeys: error
            correctness:
              useParseIntRadix: error
            performance:
              noAccumulatingSpread: error
              noDynamicNamespaceImportAccess: error
              useDomNodeTextContent: error
            style:
              useArrayLiterals: error
              useConst: error
              useDeprecatedReason: error
              useExponentiationOperator: error
              useLiteralEnumMembers: error
              useNodejsImportProtocol: error
              useShorthandFunctionType: error
              useTemplate: error
            suspicious:
              noApproximativeNumericConstant: error
              noCatchAssign: error
              noConfusingLabels: error
              noConfusingVoidType: error
              noDeprecatedMediaType: error
              noDocumentCookie: error
              noDuplicateEnumValues: error
              noDuplicateFields: error
              noEmptyBlock: error
              noExtraNonNullAssertion: error
              noGlobalIsFinite: error
              noGlobalIsNan: error
              noIrregularWhitespace: error
              noOctalEscape: error
              noProto: error
              noPrototypeBuiltins: error
              noQuickfixBiome: error
              noRedundantUseStrict: error
              noSuspiciousSemicolonInJsx: error
              noTemplateCurlyInString: error
              noUselessEscapeInString: error
              noUselessRegexBackrefs: error
              useAdjacentOverloadSignatures: error
              useBiomeIgnoreFolder: error
              useDefaultSwitchClauseLast: error
              useGoogleFontDisplay: error
              useIsArray: error
        overrides.*.linter.rules.<group>.<rule>.options: !inherits >-
          linter.rules.<group>.<rule>.options
        $schema: !default ./node_modules/@biomejs/biome/configuration_schema.json
    typescript:
      biome.jsonc:
        javascript:
          formatter:
            semicolons: always
            trailingCommas: all
            arrowParentheses: always
            bracketSpacing: true
            bracketSameLine: false
            attributePosition: multiline
        assist:
          actions:
            source:
              organizeImports:
                level: 'on'
                options:
                  identifierOrder: natural
                  groups:
                    - ':URL:'
                    - ':BLANK_LINE:'
                    - ':NODE:'
                    - ':BLANK_LINE:'
                    - ':BUN:'
                    - ':BLANK_LINE:'
                    - slot: frameworks
                    - ':PACKAGE:'
                    - ':BLANK_LINE:'
                    - ':ALIAS:'
                    - ':BLANK_LINE:'
                    - ':PATH:'
        linter:
          rules:
            suspicious:
              noUnusedExpressions: error
              useAwait: error
              useErrorMessage: error
              useNumberToFixedDigitsArgument: error
              noConstantBinaryExpressions: error
              noMisplacedAssertion: error
              noUnassignedVariables: error
              noVar: error
              noReturnAssign: error
              noProto: error
              noForIn: error
              noNestedPromises: error
              noShadow: error
              noUnnecessaryConditions: error
              useArraySortCompare: error
              noEmptyObjectKeys: error
              noLoopFunc: error
            style:
              noParameterAssign: error
              useNumberNamespace: error
              useBlockStatements: error
              noUselessElse: error
              useCollapsedElseIf: error
              noNegationElse: error
              useConsistentBuiltinInstantiation: error
              useShorthandAssign: error
              noYodaExpression: error
              useExplicitLengthCheck: error
              useAtIndex: error
              useTrimStartEnd: error
              noSubstr: error
              noDoneCallback: error
              noExportedImports: error
              useNumericSeparators: error
              useObjectSpread: error
              useSingleVarDeclarator: error
              useSymbolDescription: error
              useThrowNewError: error
              useNodeAssertStrict: error
              useExportsLast: error
              useForOf: error
              useGroupedAccessorPairs: error
              useDefaultParameterLast: error
              useCollapsedIf: error
              useConsistentArrowReturn: error
              useTemplate: error
              useArrayLiterals: error
              useExponentiationOperator: error
              noShoutyConstants: error
              noUnusedTemplateLiteral: error
              noMultiAssign: error
              noExcessiveClassesPerFile: error
              useGlobalThis: error
              noMultilineString: error
              useSpreadOverApply: error
              useNodejsImportProtocol: error
            complexity:
              noUselessConstructor: error
              useFlatMap: error
              noUselessRename: error
              noUselessEmptyExport: error
              noUselessSwitchCase: error
              useLiteralKeys: !replace 'off'
              noUselessTernary: error
              noUselessLoneBlockStatements: error
              noUselessLabel: error
              noExtraBooleanCast: error
              noUselessStringConcat: error
              noImplicitCoercions: error
              noForEach: error
              useSimplifiedLogicExpression: error
              useWhile: error
              noUselessReturn: error
              noRedundantDefaultExport: error
              useArrayFind: error
              useArraySome: error
              useRegexpTest: error
            correctness:
              noGlobalDirnameFilename: error
              useJsonImportAttributes: error
              noUnusedInstantiation: error
            performance:
              noDelete: error
              noAccumulatingSpread: error
              noAwaitInLoops: error
              noDynamicNamespaceImportAccess: error
            nursery:
              useAwaitThenable: error
              useStringStartsEndsWith: error
              noUselessTypeConversion: error
              noExtendNative: error
              noNegationInEqualityCheck: error
              noThisOutsideOfClass: error
              useIncludes: error
              useModernMathApis: error
              useFlatMathMinMax: error
        overrides:
          - includes:
              - '**/${role.colocated-specs}/**'
              - '**/*.${role.spec-file}.ts'
              - '**/*.${role.spec-file}.tsx'
            linter:
              rules:
                complexity:
                  noStaticOnlyClass: 'off'
          - includes:
              - '**/${role.colocated-specs}/**'
              - '**/*.${role.spec-file}.ts'
              - '**/*.${role.spec-file}.tsx'
            linter:
              rules:
                suspicious:
                  noIdenticalTestTitle: error
  biome-writes-single-quotes:
    css:
      biome.jsonc:
        css:
          formatter:
            quoteStyle: single
    typescript:
      biome.jsonc:
        javascript:
          formatter:
            quoteStyle: single
            jsxQuoteStyle: single
    yaml:
      biome.jsonc:
        yaml:
          formatter:
            quoteStyle: single
  biome-formats-every-file-of-its-languages:
    '*':
      biome.jsonc:
        formatter:
          lineEnding: lf
          attributePosition: multiline
          expand: always
        markdown:
          formatter:
            enabled: false
        overrides:
          - includes:
              - '**/*.jsonc'
            json:
              formatter:
                trailingCommas: all
core:
  formatters-share-one-indent:
    '*':
      biome.jsonc:
        formatter:
          indentStyle: space
          indentWidth: 2
  formatters-share-one-width:
    '*':
      biome.jsonc:
        formatter:
          lineWidth: 100
  failure-never-dropped-unread:
    typescript:
      biome.jsonc:
        linter:
          rules:
            suspicious:
              noEmptyBlockStatements: error
        overrides:
          - includes:
              - '**/${role.colocated-specs}/**'
              - '**/*.${role.spec-file}.ts'
              - '**/*.${role.spec-file}.tsx'
              - '**/${role.package-suites}/**'
            linter:
              rules:
                suspicious:
                  noEmptyBlockStatements: 'off'
  test-runs-unconditionally:
    typescript:
      biome.jsonc:
        linter:
          rules:
            suspicious:
              noSkippedTests: error
              noFocusedTests: error
  test-asserts-something:
    typescript:
      biome.jsonc:
        linter:
          rules:
            suspicious:
              useExpect: error
  deprecated-form-never-used:
    typescript:
      biome.jsonc:
        linter:
          rules:
            suspicious:
              noDeprecatedImports: error
  dead-code-deleted:
    typescript:
      biome.jsonc:
        linter:
          rules:
            suspicious:
              noParametersOnlyUsedInRecursion: error
            correctness:
              noUnreachable: error
              noUnusedFunctionParameters: error
              noUnusedImports: error
              noUnusedLabels: error
              noUnusedPrivateClassMembers: error
              noUnusedVariables: error
  package-declares-every-dependency-it-imports:
    typescript:
      biome.jsonc:
        linter:
          rules:
            correctness:
              noUndeclaredDependencies: error
  file-within-500-lines:
    typescript:
      biome.jsonc:
        linter:
          rules:
            style:
              noExcessiveLinesPerFile:
                level: error
                options:
                  maxLines: 500
        overrides:
          - includes:
              - '**/*.${role.generated-file}.*'
              - '**/*.${role.generated-file}/**'
            linter:
              rules:
                style:
                  noExcessiveLinesPerFile: 'off'
          - includes:
              - '**/${role.colocated-specs}/**'
              - '**/*.${role.spec-file}.ts'
              - '**/*.${role.spec-file}.tsx'
              - '**/${role.package-suites}/**'
            linter:
              rules:
                style:
                  noExcessiveLinesPerFile: 'off'
  error-keeps-its-cause:
    typescript:
      biome.jsonc:
        linter:
          rules:
            style:
              useErrorCause: error
  raised-value-is-an-error:
    typescript:
      biome.jsonc:
        linter:
          rules:
            style:
              useThrowOnlyError: error
            nursery:
              usePromiseRejectErrors: error
  code-reads-plainly:
    typescript:
      biome.jsonc:
        linter:
          rules:
            style:
              noNestedTernary: error
  literal-with-a-meaning-is-named:
    typescript:
      biome.jsonc:
        linter:
          rules:
            style:
              noMagicNumbers: error
        overrides:
          - includes:
              - '**/${role.colocated-specs}/**'
              - '**/*.${role.spec-file}.ts'
              - '**/*.${role.spec-file}.tsx'
              - '**/${role.package-suites}/**'
            linter:
              rules:
                style:
                  noMagicNumbers: 'off'
  function-complexity-within-15:
    typescript:
      biome.jsonc:
        linter:
          rules:
            complexity:
              noExcessiveCognitiveComplexity:
                level: error
                options:
                  maxAllowedComplexity: 15
  function-within-its-limits:
    typescript:
      biome.jsonc:
        linter:
          rules:
            complexity:
              noExcessiveLinesPerFunction:
                level: error
                options:
                  maxLines: 100
        overrides:
          - includes:
              - '**/*.${role.generated-file}.*'
              - '**/*.${role.generated-file}/**'
            linter:
              rules:
                complexity:
                  noExcessiveLinesPerFunction: 'off'
          - includes:
              - '**/${role.colocated-specs}/**'
              - '**/*.${role.spec-file}.ts'
              - '**/*.${role.spec-file}.tsx'
              - '**/${role.package-suites}/**'
            linter:
              rules:
                complexity:
                  noExcessiveLinesPerFunction: 'off'
  function-takes-at-most-three-positions:
    typescript:
      biome.jsonc:
        linter:
          rules:
            complexity:
              useMaxParams:
                level: error
                options:
                  max: 3
  secret-never-in-the-repository:
    typescript:
      biome.jsonc:
        linter:
          rules:
            security:
              noSecrets:
                level: error
                options:
                  entropyThreshold: 60
        overrides:
          - includes:
              - '**/*.${role.config-file}.ts'
              - '**/*.${role.config-file}.js'
              - '**/*.${role.config-file}.mjs'
              - '**/*.${role.config-file}.cjs'
              - '**/.*rc.ts'
              - '**/.*rc.js'
              - '**/.*rc.mjs'
              - '**/.*rc.cjs'
            linter:
              rules:
                security:
                  noSecrets: 'off'
  statements-grouped-by-blank-lines:
    typescript:
      biome.jsonc:
        plugins:
          - ./${constitution.path}/presets/biome/plugins/typescript/statements-grouped-by-blank-lines.${role.grit-rule}
  case-holds-no-logic:
    typescript:
      biome.jsonc:
        linter:
          rules:
            suspicious:
              noConditionalExpect: error
  debug-output-never-ships:
    typescript:
      biome.jsonc:
        linter:
          rules:
            suspicious:
              noAlert: error
              noDebugger: error
