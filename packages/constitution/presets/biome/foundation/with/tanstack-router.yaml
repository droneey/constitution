tanstack-router:
  '*':
    typescript:
      biome.jsonc:
        overrides:
          - includes:
              - '**/${role.source}/${role.composition-root}/${role.file-routes}/**'
              - '**/${role.source}/${role.composition-root}/routeTree.gen.ts'
            linter:
              rules:
                style:
                  useFilenamingConvention: 'off'
        assist:
          actions:
            source:
              organizeImports:
                options:
                  groups@frameworks:
                    - '@tanstack/**'
                    - ':BLANK_LINE:'
  links-name-typed-targets:
    typescript:
      biome.jsonc:
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/links-name-typed-targets.grit]:
          includes:
            - '**/*.ts'
            - '**/*.tsx'
