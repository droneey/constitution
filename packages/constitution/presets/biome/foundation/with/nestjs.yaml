nestjs:
  '*':
    typescript:
      biome.json:
        javascript:
          parser:
            unsafeParameterDecoratorsEnabled: true
        overrides:
          - includes:
              - '**/*.ts'
            linter:
              rules:
                complexity:
                  noStaticOnlyClass: 'off'
          - includes:
              - '**/*.ts'
            linter:
              rules:
                style:
                  noParameterProperties: 'off'
          - includes:
              - '**/*.${role.nest-controller}'
              - '**/*.${role.nest-provider}'
              - '**/*.${role.nest-filter}'
              - '**/*.${role.nest-pipe}'
              - '**/*.${role.nest-guard}'
              - '**/*.${role.nest-interceptor}'
            linter:
              rules:
                complexity:
                  useMaxParams: 'off'
          - includes:
              - '**/*.${role.nest-controller}'
              - '**/*.${role.nest-provider}'
              - '**/*.${role.nest-filter}'
              - '**/*.${role.nest-pipe}'
              - '**/*.${role.nest-guard}'
              - '**/*.${role.nest-interceptor}'
            linter:
              rules:
                style:
                  useImportType: 'off'
        assist:
          actions:
            source:
              organizeImports:
                options:
                  groups@frameworks:
                    - - '@nest*'
                      - nest*
                    - ':BLANK_LINE:'
