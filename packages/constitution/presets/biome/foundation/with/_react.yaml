              - '**/*.tsx'
              - '**/*.jsx'
            assist:
              actions:
                source:
                  useSortedAttributes:
                    level: 'on'
                    options: {}
                  noDuplicateClasses:
                    level: 'on'
                    options: {}
            linter:
              rules:
                complexity:
                  noUselessFragments: error
        assist:
          actions:
            source:
              organizeImports:
                options:
                  groups@frameworks:
                    - - react
                      - react/**
                      - react-*
                    - ':BLANK_LINE:'
