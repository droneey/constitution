_react:
  hooks-at-top-level:
    typescript:
      biome.jsonc:
        overrides:
          - includes:
              - '**/*.ts'
            linter:
              rules:
                correctness:
                  useHookAtTopLevel: error
          - includes:
              - '**/*.tsx'
              - '**/*.jsx'
            assist:
              actions:
                source:
                  useSortedAttributes:
                    level: 'on'
                    options: {}
                  noDuplicateClasses:
                    level: 'on'
                    options: {}
            linter:
              rules:
                correctness:
                  useHookAtTopLevel: error
  '*':
