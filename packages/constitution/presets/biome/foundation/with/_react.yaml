  function-components-only:
    typescript:
      biome.jsonc:
        overrides:
          - includes:
              - '**/*.tsx'
              - '**/*.jsx'
            assist:
              actions:
                source:
                  useSortedAttributes:
                    level: 'on'
                    options: {}
                  noDuplicateClasses:
                    level: 'on'
                    options: {}
            linter:
              rules:
                style:
                  useReactFunctionComponents: error
  components-named-in-pascal-case:
    typescript:
      biome.jsonc:
        overrides:
          - includes:
              - '**/*.tsx'
              - '**/*.jsx'
            assist:
              actions:
                source:
                  useSortedAttributes:
                    level: 'on'
                    options: {}
                  noDuplicateClasses:
                    level: 'on'
                    options: {}
            linter:
              rules:
                style:
                  useNamingConvention:
                    level: error
                    options:
                      conventions:
                        - selector:
                            kind: typeParameter
                          match: T([A-Z].*)?
                          formats:
                            - PascalCase
                        - selector:
                            kind: objectLiteralProperty
                          match: '[_$]*([^_$].*?)[_$]*'
                          formats:
                            - camelCase
                            - PascalCase
                        - selector:
                            kind: typeProperty
                          match: '[_$]*([^_$].*?)[_$]*'
                          formats:
                            - camelCase
                            - PascalCase
  nothing-rendered-as-null:
    typescript:
      biome.jsonc:
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/nothing-rendered-as-null.grit]:
          includes:
            - '**/*.tsx'
  compound-parts-share-the-root-context:
