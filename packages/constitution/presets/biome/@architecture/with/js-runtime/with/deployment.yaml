js-runtime:
  process-env-read-only-by-the-provider:
    typescript:
      biome.jsonc:
        linter:
          rules:
            style:
              noProcessEnv: error
        overrides:
          - includes:
              - '**/${role.source}/${role.adapter}/*'
              - '**/${role.colocated-specs}/**'
              - '**/*.${role.spec-file}.ts'
              - '**/*.${role.spec-file}.tsx'
              - '**/${role.package-suites}/**'
            linter:
              rules:
                style:
                  noProcessEnv: 'off'
