typescript:
  null-mapped-to-undefined-in-the-adapter:
    typescript:
      biome.jsonc:
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/undefined-is-the-only-absence.${role.grit-rule}]:
          includes@left-out:
            - '!**/${role.adapter}/**'
            - '!**/${role.wire-model}/**'
  set-timeout-called-only-at-the-edge:
    typescript:
      biome.jsonc:
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/set-timeout-called-only-at-the-edge.${role.grit-rule}]:
          includes:
            - '**/${role.source}/**'
            - '!**/${role.source}/${role.adapter}/**'
            - '!**/${role.source}/${role.bounded-context}/*/${role.adapter}/**'
            - '!**/${role.source}/${role.composition-module}/*/${role.adapter}/**'
            - '!**/${role.source}/${role.generic-library}/**'
            - '!**/${role.source}/${role.composition-root}/**'
            - '!**/${role.source}/*.ts'
            - '!**/${role.source}/*.tsx'
            - '!**/${role.source}/${role.extra-entry}/*/${role.entry}.ts'
            - '!**/${role.source}/${role.host-integration}/**'
            - '!**/${role.source}/${role.bounded-context}/*/${role.presentation-layer}/${role.binding}/**'
            - '!**/${role.source}/${role.composition-module}/*/${role.presentation-layer}/${role.binding}/**'
            - '!**/${role.source}/${role.presentation-layer}/${role.binding}/**'
            - '!**/${role.colocated-specs}/**'
core:
  business-value-lives-in-the-domain:
    typescript:
      biome.jsonc:
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/entity-value-or-event-typed-readonly.${role.grit-rule}]:
          includes@business-types:
            - '**/${role.domain-layer}/**'
            - '**/${role.shared-kernel}/**'
            - '!**/${role.colocated-specs}/**'
  outside-shape-mapped-in-the-adapter:
    typescript:
      biome.jsonc:
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/closed-name-set-is-a-string-enum.${role.grit-rule}]:
          includes@left-out:
            - '!**/${role.adapter}/**'
            - '!**/${role.wire-model}/**'
  surface-only-re-exports:
    typescript:
      biome.jsonc:
        plugins[path=./${constitution.path}/presets/biome/plugins/typescript/surface-only-re-exports.${role.grit-rule}]:
          includes:
            - '**/index.ts'
            - '**/index.tsx'
            - '!**/${role.source}/${role.composition-root}/**/index.tsx'
            - slot: left-out
