tombi:
  '*':
    '*':
      lefthook.yaml:
        pre-commit:
          parallel: true
          jobs[name=tombi]:
            glob: '*.toml'
            run: tombi format {staged_files}
lefthook:
  hook-rewrites-only-staged-files:
    '*':
      lefthook.yaml:
        pre-commit:
          jobs[name=tombi]:
            stage_fixed: true
