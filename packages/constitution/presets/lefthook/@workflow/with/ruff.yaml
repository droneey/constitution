ruff:
  '*':
    '*':
      lefthook.yaml:
        pre-commit:
          parallel: true
          jobs[name=ruff]:
            glob: '*.{py,pyi}'
            run: >-
              uv run --locked ruff check --fix --force-exclude {staged_files} && uv run --locked
              ruff format --force-exclude {staged_files}
    python:
      lefthook.yaml:
        pre-commit:
          # Why: the root's job skips the members, each checked in its own run.
          jobs[name=ruff]:
            exclude:
              - ${workspace.members}/**
version-control:
  hook-rewrites-only-staged-files:
    '*':
      lefthook.yaml:
        pre-commit:
          jobs[name=ruff]:
            stage_fixed: true
  hook-restages-what-it-rewrote:
    '*':
      lefthook.yaml:
        pre-commit:
          jobs[name=ruff]:
            stage_fixed: true
