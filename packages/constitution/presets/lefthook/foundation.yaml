version-control:
  commit-subject-says-what-changed:
    '*':
      lefthook.yaml:
        commit-msg:
          jobs[name=commit-placeholder]:
            run: |
              SUBJECT="$(head -1 {1} | sed 's/^[A-Za-z]*\(([^)]*)\)\{0,1\}!\{0,1\}: //')"

              case "$(printf '%s' "$SUBJECT" | tr '[:upper:]' '[:lower:]')" in
                update | updates | changes | change | misc | wip | fix | fixes | \
                  "fix stuff" | stuff | \
                  "minor changes" | "small fix" | tmp | test)
                  echo "[commit-subject-says-what-changed]" \
                    "Subject '$SUBJECT' says nothing; say what changed"
                  exit 1
                  ;;
              esac
