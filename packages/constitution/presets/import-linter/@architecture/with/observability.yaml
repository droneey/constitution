observability:
  domain-and-application-log-nothing:
    python:
      pyproject.toml:
        tool:
          importlinter:
            include_external_packages: true
            contracts[name=domain-and-application-log-nothing]:
              type: forbidden
              source_modules:
                - '*.${role.composition-module}.*.${role.domain-layer}'
                - '*.${role.composition-module}.*.${role.application}'
                - '*.${role.bounded-context}.*.${role.domain-layer}'
                - '*.${role.bounded-context}.*.${role.application}'
              forbidden_modules:
                - logging
              allow_indirect_imports: true
