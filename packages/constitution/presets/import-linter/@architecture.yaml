core:
  kernel-imports-only-itself:
    python:
      pyproject.toml:
        tool:
          importlinter:
            contracts[name=kernel-imports-only-itself]:
              type: forbidden
              source_modules:
                - '*.${role.shared-kernel}'
              forbidden_modules:
                - '*.${role.adapter}'
                - '*.${role.composition-module}'
                - '*.${role.extra-entry}'
                - '*.${role.bounded-context}'
                - '*.${role.host-integration}'
                - '*.${role.generic-library}'
                - '*.${role.composition-root}'
                - '*.${role.shared-code}'
  libs-import-no-code-of-the-program:
    python:
      pyproject.toml:
        tool:
          importlinter:
            contracts[name=libs-import-no-code-of-the-program]:
              type: forbidden
              source_modules:
                - '*.${role.generic-library}'
              forbidden_modules:
                - '*.${role.adapter}'
                - '*.${role.composition-module}'
                - '*.${role.extra-entry}'
                - '*.${role.bounded-context}'
                - '*.${role.host-integration}'
                - '*.${role.shared-kernel}'
                - '*.${role.composition-root}'
                - '*.${role.shared-code}'
  shared-imports-no-feature-adapter-port-or-root:
    python:
      pyproject.toml:
        tool:
          importlinter:
            contracts[name=shared-imports-no-feature-adapter-port-or-root]:
              type: forbidden
              source_modules:
                - '*.${role.shared-code}'
              forbidden_modules:
                - '*.${role.adapter}'
                - '*.${role.composition-module}'
                - '*.${role.bounded-context}'
                - '*.${role.host-integration}'
                - '*.${role.shared-kernel}.${role.port}'
                - '*.${role.composition-root}'
  domain-imports-only-itself-and-the-kernel:
    python:
      pyproject.toml:
        tool:
          importlinter:
            contracts[name=domain-imports-only-itself-and-the-kernel]:
              type: forbidden
              source_modules:
                - '*.${role.bounded-context}.*.${role.domain-layer}'
              forbidden_modules:
                - '*.${role.adapter}'
                - '*.${role.composition-module}'
                - '*.${role.extra-entry}'
                - '*.${role.bounded-context}.*.${role.adapter}'
                - '*.${role.bounded-context}.*.${role.application}'
                - '*.${role.bounded-context}.*.${role.presentation-layer}'
                - '*.${role.shared-kernel}.${role.port}'
                - '*.${role.host-integration}'
                - '*.${role.generic-library}'
                - '*.${role.composition-root}'
                - '*.${role.shared-code}'
  application-imports-only-its-domain-the-kernel-and-composed-surfaces:
    python:
      pyproject.toml:
        tool:
          importlinter:
            contracts[name=application-imports-only-its-domain-the-kernel-and-composed-surfaces]:
              type: forbidden
              source_modules:
                - '*.${role.composition-module}.*.${role.application}'
                - '*.${role.bounded-context}.*.${role.application}'
              forbidden_modules:
                - '*.${role.adapter}'
                - '*.${role.composition-module}.*.${role.adapter}'
                - '*.${role.composition-module}.*.${role.presentation-layer}'
                - '*.${role.bounded-context}.*.${role.adapter}'
                - '*.${role.bounded-context}.*.${role.presentation-layer}'
                - '*.${role.extra-entry}'
                - '*.${role.host-integration}'
                - '*.${role.generic-library}'
                - '*.${role.composition-root}'
                - '*.${role.shared-code}'
  feature-never-imports-a-feature:
    python:
      pyproject.toml:
        tool:
          importlinter:
            contracts[name=feature-never-imports-a-feature]:
              type: independence
              modules:
                - '*.${role.bounded-context}.*'
  binding-unit-calls-only-use-cases:
    python:
      pyproject.toml:
        tool:
          importlinter:
            contracts[name=binding-unit-calls-only-use-cases]:
              type: forbidden
              source_modules:
                - '*.${role.composition-module}.*.${role.presentation-layer}'
                - '*.${role.bounded-context}.*.${role.presentation-layer}'
              forbidden_modules:
                - '*.${role.composition-module}.*.${role.application}.${role.port}'
                - '*.${role.bounded-context}.*.${role.application}.${role.port}'
              allow_indirect_imports: true
  domain-model-changed-only-through-a-use-case:
    python:
      pyproject.toml:
        tool:
          importlinter:
            # Why: a binding unit reaches the transitions through the use case it calls, so only a
            # direct import breaks the contract.
            contracts[id=domain-model-changed-only-through-a-use-case.presentation]:
              name: domain-model-changed-only-through-a-use-case
              type: forbidden
              source_modules:
                - '*.${role.composition-module}.*.${role.presentation-layer}'
                - '*.${role.bounded-context}.*.${role.presentation-layer}'
              forbidden_modules:
                - '*.${role.composition-module}.*.${role.domain-layer}.*.${role.aggregate-transition}'
                - '*.${role.bounded-context}.*.${role.domain-layer}.*.${role.aggregate-transition}'
              allow_indirect_imports: true
            contracts[id=domain-model-changed-only-through-a-use-case.adapters]:
              name: domain-model-changed-only-through-a-use-case
              type: forbidden
              source_modules:
                - '*.${role.composition-module}.*.${role.adapter}'
                - '*.${role.bounded-context}.*.${role.adapter}'
              forbidden_modules:
                - '*.${role.composition-module}.*.${role.domain-layer}.*.${role.aggregate-transition}'
                - '*.${role.bounded-context}.*.${role.domain-layer}.*.${role.aggregate-transition}'
              allow_indirect_imports: true
  composition-module-never-imports-another:
    python:
      pyproject.toml:
        tool:
          importlinter:
            contracts[name=composition-module-never-imports-another]:
              type: independence
              modules:
                - '*.${role.composition-module}.*'
  adapter-imports-only-its-owners-domain-ports-or-shared-layers:
    python:
      pyproject.toml:
        tool:
          importlinter:
            contracts[id=adapter-imports-only-its-owners-domain-ports-or-shared-layers.adapters-apart]:
              name: adapter-imports-only-its-owners-domain-ports-or-shared-layers
              type: independence
              modules:
                - '*.${role.adapter}.*'
                - '*.${role.composition-module}.*.${role.adapter}.*'
                - '*.${role.bounded-context}.*.${role.adapter}.*'
            contracts[id=adapter-imports-only-its-owners-domain-ports-or-shared-layers.outer-layers]:
              name: adapter-imports-only-its-owners-domain-ports-or-shared-layers
              type: forbidden
              source_modules:
                - '*.${role.adapter}'
                - '*.${role.bounded-context}.*.${role.adapter}'
              forbidden_modules:
                - '*.${role.composition-module}'
                - '*.${role.extra-entry}'
                - '*.${role.bounded-context}.*.${role.application}.${role.use-case}'
                - '*.${role.bounded-context}.*.${role.presentation-layer}'
                - '*.${role.composition-root}'
            contracts[id=adapter-imports-only-its-owners-domain-ports-or-shared-layers.shared-adapters]:
              name: adapter-imports-only-its-owners-domain-ports-or-shared-layers
              type: forbidden
              source_modules:
                - '*.${role.adapter}'
              forbidden_modules:
                - '*.${role.bounded-context}'
            # Why: composition implements a feature's contract through another feature's surface.
            contracts[id=adapter-imports-only-its-owners-domain-ports-or-shared-layers.composition-adapters]:
              name: adapter-imports-only-its-owners-domain-ports-or-shared-layers
              type: forbidden
              source_modules:
                - '*.${role.composition-module}.*.${role.adapter}'
              forbidden_modules:
                - '*.${role.composition-module}.*.${role.application}.${role.use-case}'
                - '*.${role.composition-module}.*.${role.presentation-layer}'
                - '*.${role.extra-entry}'
                - '*.${role.bounded-context}.*.${role.adapter}'
                - '*.${role.bounded-context}.*.${role.application}.${role.use-case}'
                - '*.${role.bounded-context}.*.${role.presentation-layer}'
                - '*.${role.composition-root}'
  root-imported-only-by-entry-files:
    python:
      pyproject.toml:
        tool:
          importlinter:
            contracts[name=root-imported-only-by-entry-files]:
              type: protected
              protected_modules:
                - '*.${role.composition-root}'
              allowed_importers:
                - '*.main'
                - '*.${role.extra-entry}.*.main'
  adapter-imported-only-by-the-root:
    python:
      pyproject.toml:
        tool:
          importlinter:
            contracts[name=adapter-imported-only-by-the-root]:
              type: protected
              protected_modules:
                - '*.${role.adapter}'
                - '*.${role.adapter}.**'
                - '*.${role.composition-module}.*.${role.adapter}'
                - '*.${role.composition-module}.*.${role.adapter}.**'
                - '*.${role.bounded-context}.*.${role.adapter}'
                - '*.${role.bounded-context}.*.${role.adapter}.**'
              allowed_importers:
                - '*'
                - '*.${role.composition-root}'
                - '*.${role.composition-root}.**'
                - '*.${role.adapter}'
                - '*.${role.adapter}.**'
                - '*.${role.composition-module}.*.${role.adapter}'
                - '*.${role.composition-module}.*.${role.adapter}.**'
                - '*.${role.bounded-context}.*.${role.adapter}'
                - '*.${role.bounded-context}.*.${role.adapter}.**'
              as_packages: false
  entrypoint-never-imported:
    python:
      pyproject.toml:
        tool:
          importlinter:
            contracts[id=entrypoint-never-imported.entrypoints]:
              name: entrypoint-never-imported
              type: protected
              protected_modules:
                - '*.${role.extra-entry}'
              allowed_importers: []
            contracts[id=entrypoint-never-imported.entrypoints-apart]:
              name: entrypoint-never-imported
              type: independence
              modules:
                - '*.${role.extra-entry}.*'
            contracts[id=entrypoint-never-imported.dunder-main]:
              name: entrypoint-never-imported
              type: protected
              protected_modules:
                - '*.__main__'
              allowed_importers: []
            contracts[id=entrypoint-never-imported.main]:
              name: entrypoint-never-imported
              type: protected
              protected_modules:
                - '*.main'
              allowed_importers:
                - '*.__main__'
  integration-never-imported:
    python:
      pyproject.toml:
        tool:
          importlinter:
            contracts[id=integration-never-imported.integrations]:
              name: integration-never-imported
              type: protected
              protected_modules:
                - '*.${role.host-integration}'
              allowed_importers: []
            contracts[id=integration-never-imported.integrations-apart]:
              name: integration-never-imported
              type: independence
              modules:
                - '*.${role.host-integration}.*'
  import-points-inward:
    python:
      pyproject.toml:
        tool:
          importlinter:
            contracts[name=import-points-inward]:
              type: forbidden
              source_modules:
                - '*.${role.adapter}'
                - '*.${role.bounded-context}'
                - '*.${role.shared-kernel}'
                - '*.${role.generic-library}'
                - '*.${role.shared-code}'
              forbidden_modules:
                - '*.${role.composition-module}'
  query-and-command-apart:
    python:
      pyproject.toml:
        tool:
          importlinter:
            contracts[id=query-and-command-apart.queries]:
              name: query-and-command-apart
              type: forbidden
              source_modules:
                - '**.${role.use-case}.${role.read-operation}'
                - '**.${role.binding}.${role.read-operation}'
              forbidden_modules:
                - '**.${role.use-case}.${role.write-operation}'
                - '**.${role.binding}.${role.write-operation}'
              allow_indirect_imports: true
            contracts[id=query-and-command-apart.commands]:
              name: query-and-command-apart
              type: forbidden
              source_modules:
                - '**.${role.use-case}.${role.write-operation}'
                - '**.${role.binding}.${role.write-operation}'
              forbidden_modules:
                - '**.${role.use-case}.${role.read-operation}'
                - '**.${role.binding}.${role.read-operation}'
              allow_indirect_imports: true
  surface-only-on-a-module-or-one-kind:
    python:
      pyproject.toml:
        tool:
          importlinter:
            contracts[name=surface-only-on-a-module-or-one-kind]:
              type: forbidden
              source_modules:
                - '**'
              forbidden_modules:
                - ${package.name}
                - '*.${role.adapter}'
                - '*.${role.composition-module}'
                - '*.${role.composition-module}.*.${role.adapter}'
                - '*.${role.composition-module}.*.${role.application}'
                - '*.${role.composition-module}.*.${role.presentation-layer}'
                - '*.${role.composition-module}.*.${role.domain-layer}'
                - '*.${role.composition-module}.*.${role.domain-layer}.*'
                - '*.${role.bounded-context}'
                - '*.${role.bounded-context}.*.${role.adapter}'
                - '*.${role.bounded-context}.*.${role.application}'
                - '*.${role.bounded-context}.*.${role.presentation-layer}'
                - '*.${role.bounded-context}.*.${role.domain-layer}'
                - '*.${role.bounded-context}.*.${role.domain-layer}.*'
                - '*.${role.host-integration}'
                - '*.${role.shared-kernel}'
                - '*.${role.generic-library}'
                - '*.${role.shared-code}'
              as_packages: false
              allow_indirect_imports: true
  module-reached-only-through-its-surface:
    python:
      pyproject.toml:
        tool:
          importlinter:
            # Why: a role folder of the kernel and a module of each layer are reached from outside
            # only through their __init__.py.
            contracts[id=module-reached-only-through-its-surface.kernel]:
              name: module-reached-only-through-its-surface
              type: protected
              protected_modules:
                - '*.${role.shared-kernel}.*.*'
              allowed_importers:
                - '*.${role.shared-kernel}.*'
            contracts[id=module-reached-only-through-its-surface.adapters]:
              name: module-reached-only-through-its-surface
              type: protected
              protected_modules:
                - '*.${role.adapter}.*.*'
              allowed_importers:
                - '*.${role.adapter}.*'
            # Why: the root and the package's surface reach a composition module's adapter through
            # the adapter's own surface.
            contracts[id=module-reached-only-through-its-surface.composition]:
              name: module-reached-only-through-its-surface
              type: protected
              protected_modules:
                - '*.${role.composition-module}.*.*'
              allowed_importers:
                - '*.${role.composition-module}.*'
              ignore_imports:
                - '*.${role.composition-root} -> *.${role.composition-module}.*.${role.adapter}.*'
                - '*.${role.composition-root}.**
                  -> *.${role.composition-module}.*.${role.adapter}.*'
                - '* -> *.${role.composition-module}.*.${role.adapter}.*'
              unmatched_ignore_imports_alerting: none
            # Why: the root and the package's surface reach a feature's adapter through the
            # adapter's own surface.
            contracts[id=module-reached-only-through-its-surface.features]:
              name: module-reached-only-through-its-surface
              type: protected
              protected_modules:
                - '*.${role.bounded-context}.*.*'
              allowed_importers:
                - '*.${role.bounded-context}.*'
              ignore_imports:
                - '*.${role.composition-root} -> *.${role.bounded-context}.*.${role.adapter}.*'
                - '*.${role.composition-root}.** -> *.${role.bounded-context}.*.${role.adapter}.*'
                - '* -> *.${role.bounded-context}.*.${role.adapter}.*'
              unmatched_ignore_imports_alerting: none
            contracts[id=module-reached-only-through-its-surface.libs]:
              name: module-reached-only-through-its-surface
              type: protected
              protected_modules:
                - '*.${role.generic-library}.*.*'
              allowed_importers:
                - '*.${role.generic-library}.*'
            contracts[id=module-reached-only-through-its-surface.shared]:
              name: module-reached-only-through-its-surface
              type: protected
              protected_modules:
                - '*.${role.shared-code}.*.*'
              allowed_importers:
                - '*.${role.shared-code}.*'
python:
  standard-module-with-an-effect-imported-only-by-the-edge:
    python:
      pyproject.toml:
        tool:
          importlinter:
            include_external_packages: true
            contracts[name=standard-module-with-an-effect-imported-only-by-the-edge]:
              type: forbidden
              source_modules:
                - '*.${role.composition-module}.*.${role.presentation-layer}'
                - '*.${role.composition-module}.*.${role.application}'
                - '*.${role.composition-module}.*.${role.domain-layer}'
                - '*.${role.bounded-context}.*.${role.presentation-layer}'
                - '*.${role.bounded-context}.*.${role.application}'
                - '*.${role.bounded-context}.*.${role.domain-layer}'
                - '*.${role.shared-kernel}'
                - '*.${role.shared-code}'
              forbidden_modules:
                - ctypes
                - curses
                - dbm
                - fcntl
                - fileinput
                - ftplib
                - getpass
                - glob
                - grp
                - imaplib
                - mmap
                - multiprocessing
                - os
                - platform
                - poplib
                - pty
                - pwd
                - random
                - resource
                - runpy
                - secrets
                - select
                - selectors
                - shelve
                - shutil
                - signal
                - smtplib
                - socket
                - socketserver
                - sqlite3
                - ssl
                - subprocess
                - syslog
                - tempfile
                - termios
                - time
                - tty
                - webbrowser
                - wsgiref
                - xmlrpc
