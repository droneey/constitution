nestjs:
  '*':
    typescript:
      .swcrc !jsonc:
        $schema: https://swc.rs/schema.json
        jsc:
          parser:
            syntax: typescript
            decorators: true
            dynamicImport: true
          target: es2023
          keepClassNames: true
        minify: false
  nestjs-keeps-decorator-metadata:
    typescript:
      .swcrc !jsonc:
        jsc:
          transform:
            legacyDecorator: true
            decoratorMetadata: true
