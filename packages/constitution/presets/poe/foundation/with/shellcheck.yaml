shellcheck:
  '*':
    shell:
      pyproject.toml:
        tool:
          poe:
            tasks:
              check:shell:
                shell: !words
                  - git ls-files -z --cached --others --exclude-standard -- '*.sh' '*.bash'
                  - "':(exclude)${workspace.members}'"
                  - '| xargs -0 -r shellcheck'
