mutmut:
  '*':
    python:
      pyproject.toml:
        tool:
          poe:
            tasks:
              mutate:branch: >-
                python ${constitution.path}/tools/mutmut-check/dist/mutmut-check.pyz
              mutate:all: >-
                python ${constitution.path}/tools/mutmut-check/dist/mutmut-check.pyz all
_task-runner:
  check-task-is-the-units-whole-gate:
    python:
      pyproject.toml:
        tool:
          poe:
            tasks:
              check:
                shell@mutations:
                  - '&& poe mutate:branch'
