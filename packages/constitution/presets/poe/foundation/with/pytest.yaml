pytest:
  coverage-gate-with-branches:
    python:
      pyproject.toml:
        tool:
          poe:
            tasks:
              test:specs: 'pytest --cov -o "norecursedirs=.* ${role.end-to-end-suite}"'
_task-runner:
  check-task-is-the-units-whole-gate:
    python:
      pyproject.toml:
        tool:
          poe:
            tasks:
              check:
                shell@tests:
                  - '&& poe test'
