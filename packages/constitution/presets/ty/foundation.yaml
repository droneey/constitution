ty:
  type-ignore-silences-nothing:
    python:
      pyproject.toml:
        tool:
          ty:
            analysis:
              respect-type-ignore-comments: false
            rules:
              all: error
core:
  rule-held-by-a-tool-where-one-can:
    python:
      pyproject.toml:
        tool:
          ty:
            rules:
              all: error
            terminal:
              error-on-warning: true
  async-work-awaited-or-held-by-a-scope:
    python:
      pyproject.toml:
        tool:
          ty:
            rules:
              all: error
python:
  typing-any-never-written:
    python:
      pyproject.toml:
        tool:
          ty:
            rules:
              all: error
  overrides-marked-by-decorator:
    python:
      pyproject.toml:
        tool:
          ty:
            rules:
              all: error
