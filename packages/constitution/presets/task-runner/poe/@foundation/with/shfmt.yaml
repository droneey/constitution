shfmt:
  '*':
    shell:
      pyproject.toml:
        tool:
          poe:
            tasks:
              check:shell-format:
                shell: !words
                  - ${constitution.path}/presets/plugins/shell/run-on-shell-scripts.sh shfmt -d --
                  - "'${workspace.members}'"
              fix:shell-format:
                shell: !words
                  - ${constitution.path}/presets/plugins/shell/run-on-shell-scripts.sh shfmt -w --
                  - "'${workspace.members}'"
