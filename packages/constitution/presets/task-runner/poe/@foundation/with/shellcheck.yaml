shellcheck:
  '*':
    shell:
      pyproject.toml:
        tool:
          poe:
            tasks:
              check:lint:
                shell: !commands
                  - !words
                    - ${constitution.path}/presets/plugins/shell/run-on-files.sh
                    - "'*.sh'"
                    - "'*.bash'"
                    - --
                    - shellcheck
                    - --
                    - "'${workspace.members}'"
