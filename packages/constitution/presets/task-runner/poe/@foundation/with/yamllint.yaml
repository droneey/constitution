yamllint:
  '*':
    yaml:
      pyproject.toml:
        tool:
          poe:
            tasks:
              check:lint:
                shell: !commands
                  - !words
                    - ${constitution.path}/presets/plugins/shell/run-on-files.sh
                    - "'*.yaml'"
                    - "'*.yml'"
                    - --
                    - yamllint
                    - --strict
                    - --
                    - "'${workspace.members}'"
