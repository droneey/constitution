biome:
  '*':
    python:
      pyproject.toml:
        tool:
          poe:
            tasks:
              check:lint:
                shell: !commands
                  - bunx --bun biome check --formatter-enabled=false --error-on-warnings
              check:format:
                shell: !commands
                  - bunx --bun biome format
              fix:lint:
                shell: !commands
                  - bunx --bun biome check --write
              fix:format:
                shell: !commands
                  - bunx --bun biome format --write
