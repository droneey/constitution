rumdl:
  '*':
    markdown:
      pyproject.toml:
        tool:
          poe:
            tasks:
              check:lint:
                shell: !commands
                  - rumdl check .
              check:format:
                shell: !commands
                  - rumdl fmt --check .
              fix:lint:
                shell: !commands
                  - rumdl check --fix .
              fix:format:
                shell: !commands
                  - rumdl fmt .
