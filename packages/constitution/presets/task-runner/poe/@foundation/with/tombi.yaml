tombi:
  '*':
    toml:
      pyproject.toml:
        tool:
          poe:
            tasks:
              check:lint:
                shell: !commands
                  - tombi lint
              fix:format:
                shell: !commands
                  - tombi format
  tombi-is-the-formatter:
    toml:
      pyproject.toml:
        tool:
          poe:
            tasks:
              check:format:
                shell: !commands
                  - tombi format --check
