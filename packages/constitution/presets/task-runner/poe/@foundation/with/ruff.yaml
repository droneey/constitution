ruff:
  '*':
    python:
      pyproject.toml:
        tool:
          poe:
            tasks:
              check:format:
                shell: !commands
                  - ruff format --check
              check:lint:
                shell: !commands
                  - ruff check
              fix:format:
                shell: !commands
                  - ruff format
              fix:lint:
                shell: !commands
                  - ruff check --fix
