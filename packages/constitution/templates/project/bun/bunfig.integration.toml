[test]
preload = [] # only the fixtures of active blocks (lingui, dom), never the sandbox
randomize = true
pathIgnorePatterns = ["tests/**"]
coverage = true
coverageReporter = ["text"]
coverageSkipTestFiles = true
coverageThreshold = { functions = 1.0, lines = 1.0 }
coveragePathIgnorePatterns = [
  "**/__tests__/**",
  "**/main.*",
  "**/root/wiring.*",
  "**/root/root.module.*",
  "**/*.gen.*",
]
