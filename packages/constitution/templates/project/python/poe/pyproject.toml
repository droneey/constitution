# poe: pinned in the dev group
[dependency-groups]
dev = [
  "poethepoet==0.49.0",
]

# poe: each task runs in the environment uv entered, and check runs the tests and every gate
[tool.poe]
executor = "simple"

[tool.poe.tasks.check]
sequence = ["<test and every *:check task the fragments give, in order>"]
