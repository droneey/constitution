# This repository runs mutation-check from its workspace's source, never the distribution's build.
stryker:
  stryker-runs-the-bun-specs-runner:
    typescript:
      stryker.${role.config-file}.json:
        plugins: !replace
          - ../@mutation-check/typescript/${role.source}/integrations/stryker/index.ts
          - ../@mutation-check/typescript/${role.source}/integrations/stryker/ignorers.ts
