[test]
root = "."
preload = ["../../../../.droneey/constitution/templates/project/bun/src/__tests__/sandbox.fixtures.ts"]
randomize = true
coverage = true
coverageReporter = ["text"]
coverageSkipTestFiles = true
coverageThreshold = { functions = 1.0, lines = 1.0 }
coveragePathIgnorePatterns = [
  "**/__tests__/**",
  "**/main.*",
]

[install]
minimumReleaseAge = 259200 # three days, in seconds

[run]
bun = true
