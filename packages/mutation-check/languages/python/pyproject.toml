[project]
name = "droneey-mutation-check"
version = "0.0.0"
requires-python = ">=3.14"
authors = [{ name = "Dmytro Kurovskyi", email = "me@kurovskyi.dev" }]
# it ships only inside the Constitution's release archive
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[project.scripts]
mutmut-check = "droneey_mutation_check.main:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest]
minversion = "9.1"
strict = true
testpaths = ["tests"]
pythonpath = ["tests"]
# the list replaces pytest's defaults: `.*` keeps the hidden folders out, or Hypothesis warns of .hypothesis/
norecursedirs = [".*", "integration", "e2e"]
addopts = ["-ra", "--import-mode=importlib"]
filterwarnings = ["error"]
anyio_mode = "auto"
timeout = "10"

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["**/main.py", "**/root/wiring.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", 'assert_never\(']

[tool.mutmut]
source_paths = ["src"]
do_not_mutate = ["*/main.py", "*/root/wiring.py"]
# a log call's text and level are no behaviour a caller relies on
do_not_mutate_patterns = ['^\s*logger\.(debug|info|warning|error|exception|critical)\(']
# each mutant's run collects the integration specs too, as the coverage gate's run does
pytest_add_cli_args = ["-p", "no:randomly", "-o", "norecursedirs=.* e2e"]
# mutmut runs the type check from mutants/, so the part's path climbs out of it
type_check_command = [
  "ty",
  "check",
  "--output-format",
  "gitlab",
  "--config-file",
  "../../../../../.droneey/constitution/presets/python/ty/foundation/self.toml"
]

# vulture: the Constitution's parts, copied, each between its two lines, since vulture reads no other file
# from .droneey/constitution/presets/python/vulture/foundation/core.toml
[tool.vulture]
paths = ["src"]
min_confidence = 60
# end .droneey/constitution/presets/python/vulture/foundation/core.toml
ignore_names = [
  "main", # the entry of the zipapp in the archive and of the console script
]

# complexipy: the Constitution's parts, copied, each between its two lines, since complexipy reads no other file
# from .droneey/constitution/presets/python/complexipy/foundation/core.toml
[tool.complexipy]
max-complexity-allowed = 15
# end .droneey/constitution/presets/python/complexipy/foundation/core.toml

# deptry: the Constitution's parts, copied, each between its two lines, since deptry reads no other file
# from .droneey/constitution/presets/python/deptry/foundation/core.toml
# deptry: no issue code lifted, so each fails the check
[tool.deptry]
ignore = []
# end .droneey/constitution/presets/python/deptry/foundation/core.toml

# ruff: the Constitution's parts, each extending the one before; ruff extends the last
# from .droneey/constitution/presets/python/ruff/foundation/self.toml, .droneey/constitution/presets/python/ruff/foundation/core.toml, .droneey/constitution/presets/python/ruff/foundation/python.toml, .droneey/constitution/presets/python/ruff/foundation/pytest.toml
[tool.ruff]
extend = "../../../../.droneey/constitution/presets/python/ruff/foundation/pytest.toml"
target-version = "py314"

[tool.ruff.lint.extend-per-file-ignores]
"tests/**" = [
  "INP001",
  "PLR2004",
  "S101",
]

# `uv run poe` has already entered the environment, so a task runs in it rather than through uv again
[tool.poe]
executor = "simple"

[tool.poe.tasks]
"format:check" = "ruff format --check"
"format:fix" = "ruff format"
"lint:check" = { shell = "ruff check && bunx --bun biome check --error-on-warnings" }
"lint:fix" = { shell = "ruff check --fix && bunx --bun biome check --write" }
"type:check" = "ty check --config-file ../../../../.droneey/constitution/presets/python/ty/foundation/self.toml"
"code:check" = "python-check src tests"
"complexity:check" = "complexipy src tests"
test = 'pytest --cov -o "norecursedirs=.* e2e"'
"mutation:check" = "mutmut-check"
"mutation:all" = "mutmut-check all"
"unused:check" = "vulture"
"dependencies:check" = "deptry src"
"yaml:check" = "yamllint --strict ."
"toml:check" = { shell = "tombi format --check && tombi lint" }
"toml:fix" = "tombi format"
