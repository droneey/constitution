[project]
name = "droneey-mutation-check"
version = "0.0.0"
requires-python = ">=3.14"
authors = [{ name = "Dmytro Kurovskyi", email = "me@kurovskyi.dev" }]
dependencies = []

[project.scripts]
mutmut-check = "droneey_mutation_check.main:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest]
minversion = "9.1"
strict = true
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
filterwarnings = ["error"]
anyio_mode = "auto"
timeout = "10"

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["**/main.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.mutmut]
source_paths = ["src"]
do_not_mutate = ["*/main.py"]
pytest_add_cli_args = ["-p", "no:randomly"]
type_check_command = ["ty", "check", "--output-format", "gitlab"]

[tool.vulture]
paths = ["src"]
ignore_names = [
  "main", # the entry of the zipapp in the archive and of the console script
]
min_confidence = 60

[tool.complexipy]
max-complexity-allowed = 15

[tool.ruff]
extend = "../../../../.droneey/constitution/presets/python/ruff/pytest.toml"
target-version = "py314"

[tool.ruff.lint.extend-per-file-ignores]
"tests/**" = [
  "INP001",
  "PLR2004",
  "S101",
]

# poethepoet: each tool's check as a task of the package, named for what it checks
# `uv run poe` has already entered the environment, so a task runs in it rather than through uv again
[tool.poe]
executor = "simple"

[tool.poe.tasks]
"format:check" = "ruff format --check"
"format:fix" = "ruff format"
"lint:check" = "ruff check"
"lint:fix" = "ruff check --fix"
"type:check" = "ty check --config-file ../../../../.droneey/constitution/presets/python/ty/self.toml"
"code:check" = "python-check src tests"
"complexity:check" = "complexipy src tests"
test = "pytest --cov"
"mutation:check" = "mutmut-check"
"mutation:all" = "mutmut-check all"
"unused:check" = "vulture"
"dependencies:check" = "deptry src"
